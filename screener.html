<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Screener — Ridge Run</title>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#fff;--ink:#0f172a;--ink2:#475569;--muted:#94a3b8;--line:#e2e8f0;--brand:#2563eb;--brand2:#1d4ed8;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--chip:#f1f5f9}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif}
  a{color:var(--brand);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{padding:14px;max-width:1800px;margin:0 auto}
  .panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
  .h1{font-size:18px;font-weight:700;margin:0 0 8px}
  .h2{font-size:13px;font-weight:700;color:var(--ink2);margin:8px 0 6px;text-transform:uppercase;letter-spacing:.04em}
  .muted{color:var(--muted)}
  .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 12px}
  .field-mini{display:flex;flex-direction:column;gap:2px}
  .field-mini label{font-size:11px;font-weight:700;color:var(--ink);letter-spacing:.02em}
  .field-mini input, .field-mini select{padding:5px 7px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px;align-items:center}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn.ghost{background:transparent}
  .btn:hover{filter:brightness(.98)}
  .toggles{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px}
  .toggles label{display:flex;gap:6px;align-items:center;font-weight:600;color:var(--ink2)}
  .scroller{overflow:auto;max-height:78vh;border:1px solid var(--line);border-radius:8px}
  table.grid{border-collapse:collapse;width:100%;font-size:12px}
  table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:5px 7px;text-align:right;white-space:nowrap}
  table.grid th:first-child,table.grid td:first-child{text-align:left}
  table.grid th{position:sticky;top:0;background:#f8fafc;color:var(--ink2);font-weight:600;cursor:pointer;user-select:none;z-index:1}
  table.grid th:hover{background:#eef2ff}
  table.grid tr:hover td{background:#fafbff}
  .ticker-link{font-weight:700;color:var(--brand);cursor:pointer}
  .ticker-link:hover{text-decoration:underline}
  .ok-txt{color:var(--ok);font-weight:600}
  .bad-txt{color:var(--bad);font-weight:600}
  .pill{display:inline-block;padding:1px 6px;border-radius:999px;font-size:10px;font-weight:600;background:var(--chip)}
  .pill.cheap{background:#dcfce7;color:#166534}
  .pill.rich{background:#fee2e2;color:#991b1b}
  .pill.warn{background:#fef3c7;color:#92400e}
  .pill.brand{background:var(--brand);color:#fff}
  .empty{color:var(--muted);padding:24px;text-align:center;font-size:13px}
  .meta{display:flex;gap:14px;font-size:11px;color:var(--ink2);margin:6px 0;flex-wrap:wrap}
  .add-btn{background:transparent;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:10px;cursor:pointer;color:var(--brand)}
  .add-btn:hover{background:#eef2ff}
  .hint{background:#fef3c7;border:1px solid #fde68a;color:#92400e;padding:8px 12px;border-radius:8px;margin:8px 0;font-size:12px}
</style>
</head>
<body>
  <nav style="display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid #e5e7eb;background:#fafafa;font:14px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;align-items:center;position:sticky;top:0;z-index:50">
  <strong style="margin-right:12px">Ridge Run</strong>
  <a href="/strategy.html" style="padding:6px 12px;border-radius:6px;text-decoration:none;color:#111;background:#fff;border:1px solid #e5e7eb">Strategy</a>
  <a href="/research.html" style="padding:6px 12px;border-radius:6px;text-decoration:none;color:#111;background:#fff;border:1px solid #e5e7eb">Research</a>
  <a href="/screener.html" style="padding:6px 12px;border-radius:6px;text-decoration:none;color:#111;background:#fff;border:1px solid #e5e7eb">Screener</a>
  <a href="/model.html" style="padding:6px 12px;border-radius:6px;text-decoration:none;color:#111;background:#fff;border:1px solid #e5e7eb">Model</a>
  <a href="/portfolio.html" style="padding:6px 12px;border-radius:6px;text-decoration:none;color:#111;background:#fff;border:1px solid #e5e7eb">Portfolio</a>
  <a href="/watchlist.html" style="padding:6px 12px;border-radius:6px;text-decoration:none;color:#111;background:#fff;border:1px solid #e5e7eb">Watchlist</a>
  <a href="/dna.html" style="padding:6px 12px;border-radius:6px;text-decoration:none;color:#111;background:#fff;border:1px solid #e5e7eb">DNA</a>
</nav>
<div id="nav"></div>
<script src="/nav.js"></script>

<div class="wrap">
  <section class="panel">
    <div class="h1">Screener</div>
    <div class="muted" style="font-size:12px;margin-bottom:8px">Universe: ~2,978 active companies. Optionable: ~1,640. Default min market cap $200M.</div>

    <div class="filters">
      <div class="field-mini"><label>Min mkt cap ($M)</label><input id="f_min_mkt_cap" type="number" value="200" min="0"/></div>
      <div class="field-mini"><label>Max mkt cap ($M)</label><input id="f_max_mkt_cap" type="number"/></div>
      <div class="field-mini"><label>Max EV/Rev</label><input id="f_max_ev_rev" type="number" step="0.1"/></div>
      <div class="field-mini"><label>Max EV/EBITDA</label><input id="f_max_ev_ebitda" type="number" step="0.1"/></div>
      <div class="field-mini"><label>Min FCF yield</label><input id="f_min_fcf_yield" type="number" step="0.01" placeholder="0.05"/></div>
      <div class="field-mini"><label>Min rev g 1y hist</label><input id="f_min_rev_growth_1y_hist" type="number" step="0.01"/></div>
      <div class="field-mini"><label>Min rev g 3y hist</label><input id="f_min_rev_growth_3y_hist" type="number" step="0.01"/></div>
      <div class="field-mini"><label>Min rev g 3y fwd</label><input id="f_min_rev_growth_3y_fwd" type="number" step="0.01"/></div>
      <div class="field-mini"><label>Min fwd/hist ratio</label><input id="f_min_rev_growth_ratio_fwd" type="number" step="0.1"/></div>
      <div class="field-mini"><label>Max ND/EBITDA</label><input id="f_max_net_debt_ebitda" type="number" step="0.1"/></div>
      <div class="field-mini"><label>Max P/E</label><input id="f_max_pe" type="number" step="1"/></div>
      <div class="field-mini"><label>Min P/E</label><input id="f_min_pe" type="number" step="1"/></div>
      <div class="field-mini"><label>Min div yield</label><input id="f_min_div_yield" type="number" step="0.001"/></div>
      <div class="field-mini"><label>Min % from high</label><input id="f_min_pct_from_high" type="number" step="0.01" placeholder="e.g. -0.30"/></div>
      <div class="field-mini"><label>Max % from low</label><input id="f_max_pct_from_low" type="number" step="0.01"/></div>
      <div class="field-mini"><label>Vol regime</label>
        <select id="f_vol_regime"><option value="">Any</option><option value="cheap">Cheap (IV rank &lt;25)</option><option value="neutral">Neutral</option><option value="rich">Rich (&gt;75)</option></select>
      </div>
      <div class="field-mini"><label>Order by</label>
        <select id="f_order_by">
          <option value="market_cap_desc">Market cap ↓</option>
          <option value="fcf_yield_desc">FCF yield ↓</option>
          <option value="rev_growth_3y_fwd_desc">Rev growth fwd ↓</option>
          <option value="quality_desc">Quality score ↓</option>
          <option value="div_yield_desc">Div yield ↓</option>
        </select>
      </div>
      <div class="field-mini"><label>Limit</label><input id="f_limit" type="number" value="500" min="1" max="3000"/></div>
    </div>

    <div class="toggles">
      <label><input id="f_has_options" type="checkbox" checked/> Optionable only</label>
      <label><input id="f_shortlist_only" type="checkbox"/> Shortlist only</label>
      <label><input id="f_watchlist_only" type="checkbox"/> Watchlist only</label>
    </div>

    <div class="actions">
      <button class="btn primary" id="runBtn">Run screen</button>
      <button class="btn" id="universeBtn">Whole universe (clear filters)</button>
      <button class="btn ghost" id="resetBtn">Reset defaults</button>
      <button class="btn ghost" id="exportBtn">Export CSV</button>
      <div class="meta" id="meta"></div>
    </div>
    <div id="hint"></div>
  </section>

  <section class="panel" style="padding:0">
    <div class="scroller" id="scroller">
      <div class="empty">Click "Run screen" to fetch results.</div>
    </div>
  </section>
</div>

<script>
(function(){
  if(!window.RR_CONFIG){alert("Missing RR_CONFIG (load /config.js first)");return;}
  const sb = window.supabase = supabase.createClient(window.RR_CONFIG.SUPABASE_URL, window.RR_CONFIG.SUPABASE_ANON_KEY);
  const USER_ID = window.RR_CONFIG.USER_ID || 'e048e890-8554-429e-883e-d9c5d03a3510';

  const $=(s,r=document)=>r.querySelector(s); const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
  function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
  function fmt(x,d=2){return (x==null||isNaN(x))?'—':Number(x).toFixed(d)}
  function fmtPct(x,d=1){return (x==null||isNaN(x))?'—':((x>=0?'+':'')+(x*100).toFixed(d)+'%')}
  function fmtMcap(x){if(x==null)return'—';if(x>=1e12)return '$'+(x/1e12).toFixed(2)+'T';if(x>=1e9)return '$'+(x/1e9).toFixed(1)+'B';if(x>=1e6)return '$'+(x/1e6).toFixed(0)+'M';return '$'+x}
  function perfColor(x){if(x==null||isNaN(x))return'';return x>=0?'ok-txt':'bad-txt'}
  function num(x){const n=parseFloat(x);return isFinite(n)?n:null}

  const COLS = [
    {k:'ticker', l:'Ticker', f:(r)=>`<span class="ticker-link" onclick="window.location.href='/research.html?ticker=${esc(r.ticker)}'">${esc(r.ticker)}</span>${r.in_watchlist?' <span class="pill brand">W</span>':''}`},
    {k:'company_name', l:'Name', f:(r)=>`<span class="muted">${esc(r.company_name||'')}</span>`},
    {k:'sector', l:'Sector', f:(r)=>esc(r.sector||'')},
    {k:'market_cap', l:'Mcap', f:(r)=>fmtMcap(r.market_cap), n:true},
    {k:'price', l:'Px', f:(r)=>fmt(r.price), n:true},
    {k:'pe', l:'PE', f:(r)=>fmt(r.pe,1), n:true},
    {k:'ev_ebitda_ntm', l:'EV/EBITDA', f:(r)=>fmt(r.ev_ebitda_ntm,1), n:true},
    {k:'fcf_yield_ntm', l:'FCF Yld', f:(r)=>fmtPct(r.fcf_yield_ntm), n:true},
    {k:'rev_growth_1y_hist', l:'g 1y h', f:(r)=>fmtPct(r.rev_growth_1y_hist), n:true},
    {k:'rev_growth_3y_hist', l:'g 3y h', f:(r)=>fmtPct(r.rev_growth_3y_hist), n:true},
    {k:'rev_growth_3y_fwd', l:'g 3y f', f:(r)=>fmtPct(r.rev_growth_3y_fwd), n:true},
    {k:'rev_growth_ratio_fwd_over_hist', l:'f/h', f:(r)=>fmt(r.rev_growth_ratio_fwd_over_hist,2), n:true},
    {k:'net_debt_ebitda', l:'ND/EB', f:(r)=>fmt(r.net_debt_ebitda,1), n:true},
    {k:'dividend_yield', l:'Div', f:(r)=>fmtPct(r.dividend_yield), n:true},
    {k:'pct_from_high', l:'%↓52H', f:(r)=>`<span class="${perfColor(r.pct_from_high)}">${fmtPct(r.pct_from_high)}</span>`, n:true},
    {k:'pct_from_low', l:'%↑52L', f:(r)=>`<span class="${perfColor(r.pct_from_low)}">${fmtPct(r.pct_from_low)}</span>`, n:true},
    {k:'iv_30d', l:'IV30', f:(r)=>fmtPct(r.iv_30d), n:true},
    {k:'iv_rank_1y', l:'IV rank', f:(r)=>r.iv_rank_1y==null?'—':`${fmt(r.iv_rank_1y,0)} ${r.vol_regime?`<span class="pill ${r.vol_regime}">${esc(r.vol_regime)}</span>`:''}`, n:true},
    {k:'top_strategy', l:'Strat', f:(r)=>esc(r.top_strategy||'')},
    {k:'asymmetry', l:'Asym', f:(r)=>fmt(r.asymmetry,2), n:true},
    {k:'_add', l:'', f:(r)=>r.in_watchlist?'':`<button class="add-btn" onclick="addWatch('${esc(r.ticker)}',this)">+W</button>`}
  ];

  function defaults(){
    return {
      p_min_mkt_cap: 200_000_000,
      p_limit: 500,
      p_order_by: 'market_cap_desc',
      p_has_options: true,
      p_shortlist_only: false,
      p_watchlist_only: false
    };
  }

  function readFilters(){
    const f = defaults();
    const v = id => $(id).value;
    const mk = num(v('#f_min_mkt_cap')); if(mk!=null) f.p_min_mkt_cap = mk * 1_000_000;
    const mkx = num(v('#f_max_mkt_cap')); if(mkx!=null) f.p_max_mkt_cap = mkx * 1_000_000;
    [['#f_max_ev_rev','p_max_ev_rev'],['#f_max_ev_ebitda','p_max_ev_ebitda'],['#f_min_fcf_yield','p_min_fcf_yield'],
     ['#f_min_rev_growth_1y_hist','p_min_rev_growth_1y_hist'],['#f_min_rev_growth_3y_hist','p_min_rev_growth_3y_hist'],
     ['#f_min_rev_growth_3y_fwd','p_min_rev_growth_3y_fwd'],['#f_min_rev_growth_ratio_fwd','p_min_rev_growth_ratio_fwd'],
     ['#f_max_net_debt_ebitda','p_max_net_debt_ebitda'],['#f_max_pe','p_max_pe'],['#f_min_pe','p_min_pe'],
     ['#f_min_div_yield','p_min_div_yield'],['#f_max_pct_from_low','p_max_pct_from_low'],['#f_min_pct_from_high','p_min_pct_from_high']]
     .forEach(([id,k])=>{const n=num(v(id));if(n!=null) f[k]=n});
    const reg = v('#f_vol_regime'); if(reg) f.p_vol_regime = reg;
    const ord = v('#f_order_by'); if(ord) f.p_order_by = ord;
    const lim = parseInt(v('#f_limit'),10); if(lim) f.p_limit = lim;
    f.p_has_options = $('#f_has_options').checked || null;
    f.p_shortlist_only = $('#f_shortlist_only').checked || false;
    f.p_watchlist_only = $('#f_watchlist_only').checked || false;
    f.p_user_id = USER_ID;
    return f;
  }

  function clearFilters(){
    $$('.filters input').forEach(el=>el.value='');
    $$('.filters select').forEach(el=>el.selectedIndex=0);
    $('#f_min_mkt_cap').value = '';
    $('#f_limit').value = '500';
    $('#f_has_options').checked = false;
    $('#f_shortlist_only').checked = false;
    $('#f_watchlist_only').checked = false;
  }

  function setDefaults(){
    clearFilters();
    $('#f_min_mkt_cap').value = '200';
    $('#f_has_options').checked = true;
    $('#f_order_by').value = 'market_cap_desc';
    $('#f_limit').value = '500';
  }

  let lastRows = [];
  let sortKey = null, sortDir = 1;

  function renderTable(rows){
    if(!rows.length){
      $('#scroller').innerHTML = '<div class="empty">No matches.</div>';
      if($('#f_shortlist_only').checked){
        $('#hint').innerHTML = '<div class="hint">No shortlist matches. Try unchecking "Shortlist only" or running WF34 to populate monthly_shortlist.</div>';
      }else if($('#f_watchlist_only').checked){
        $('#hint').innerHTML = '<div class="hint">No watchlist matches your filters. Loosen filters or uncheck "Watchlist only".</div>';
      }else{
        $('#hint').innerHTML = '<div class="hint">Filters returned nothing. Try widening min mkt cap or removing growth/EV filters.</div>';
      }
      return;
    }
    $('#hint').innerHTML = '';
    const head = `<tr>${COLS.map(c=>`<th data-k="${c.k}">${esc(c.l)}${sortKey===c.k?(sortDir>0?' ▲':' ▼'):''}</th>`).join('')}</tr>`;
    const body = rows.map(r=>`<tr>${COLS.map(c=>`<td>${c.f(r)}</td>`).join('')}</tr>`).join('');
    $('#scroller').innerHTML = `<table class="grid"><thead>${head}</thead><tbody>${body}</tbody></table>`;
    $$('table.grid th').forEach(th=>th.addEventListener('click',()=>{
      const k = th.dataset.k; if(!k||k==='_add') return;
      if(sortKey===k) sortDir=-sortDir; else {sortKey=k; sortDir=1}
      const sorted = lastRows.slice().sort((a,b)=>{
        const x=a[k], y=b[k];
        if(x==null) return 1; if(y==null) return -1;
        if(typeof x==='number') return (x-y)*sortDir;
        return String(x).localeCompare(String(y))*sortDir;
      });
      renderTable(sorted);
    }));
  }

  async function runScreen(){
    $('#scroller').innerHTML = '<div class="empty">Running…</div>';
    $('#hint').innerHTML = '';
    const t0 = Date.now();
    try{
      const params = readFilters();
      const {data, error} = await sb.rpc('screen_companies', params);
      if(error) throw error;
      const rows = Array.isArray(data)?data:[];
      lastRows = rows;
      const elapsed = ((Date.now()-t0)/1000).toFixed(1);
      $('#meta').innerHTML = `<span><b>${rows.length}</b> results · ${elapsed}s</span><span class="muted">filters: ${describeFilters(params)}</span>`;
      renderTable(rows);
    }catch(e){
      console.error(e);
      $('#scroller').innerHTML = `<div class="empty">Failed: ${esc(e.message||e)}</div>`;
    }
  }

  function describeFilters(p){
    const parts=[];
    if(p.p_min_mkt_cap) parts.push(`mcap≥${fmtMcap(p.p_min_mkt_cap)}`);
    if(p.p_max_mkt_cap) parts.push(`mcap≤${fmtMcap(p.p_max_mkt_cap)}`);
    if(p.p_max_ev_ebitda) parts.push(`EV/EBITDA≤${p.p_max_ev_ebitda}`);
    if(p.p_min_fcf_yield) parts.push(`FCF≥${fmtPct(p.p_min_fcf_yield)}`);
    if(p.p_min_rev_growth_3y_fwd) parts.push(`g3yf≥${fmtPct(p.p_min_rev_growth_3y_fwd)}`);
    if(p.p_max_net_debt_ebitda!=null) parts.push(`ND/EB≤${p.p_max_net_debt_ebitda}`);
    if(p.p_vol_regime) parts.push(`vol=${p.p_vol_regime}`);
    if(p.p_has_options) parts.push('optionable');
    if(p.p_shortlist_only) parts.push('shortlist');
    if(p.p_watchlist_only) parts.push('watchlist');
    return parts.join(' · ');
  }

  function exportCsv(){
    if(!lastRows.length) return alert('Run a screen first.');
    const cols = COLS.filter(c=>c.k!=='_add');
    const head = cols.map(c=>c.l).join(',');
    const body = lastRows.map(r=>cols.map(c=>{
      const v = r[c.k]; if(v==null) return ''; return JSON.stringify(v).replace(/^"|"$/g,'');
    }).join(',')).join('\n');
    const blob = new Blob([head+'\n'+body],{type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=`screener-${new Date().toISOString().slice(0,10)}.csv`; a.click();
    URL.revokeObjectURL(url);
  }

  async function addWatch(ticker, btn){
    btn.disabled=true; btn.textContent='…';
    try{
      const {error} = await sb.from('ticker_watchlist').insert({user_id:USER_ID, ticker, symbol:ticker, is_active:true});
      if(error) throw error;
      btn.textContent='✓'; btn.style.color='#16a34a';
      const row = lastRows.find(r=>r.ticker===ticker); if(row) row.in_watchlist = true;
    }catch(e){btn.disabled=false; btn.textContent='+W'; alert('Failed: '+e.message)}
  }
  window.addWatch = addWatch;

  $('#runBtn').addEventListener('click', runScreen);
  $('#universeBtn').addEventListener('click', ()=>{clearFilters(); $('#f_limit').value='1000'; runScreen()});
  $('#resetBtn').addEventListener('click', setDefaults);
  $('#exportBtn').addEventListener('click', exportCsv);

  setDefaults();
  runScreen();
})();
</script>
</body>
</html>
