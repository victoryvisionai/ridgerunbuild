<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Watchlist · Ridge Run</title>
<script>(function(){try{var t=localStorage.getItem('RR_THEME')||'editorial';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/themes.css" />
<style>
  :root{
    --bg:#fff;--bg-tint:#f8fafc;--bg-blue:#eff6ff;--border:#e2e8f0;--border-blue:#bfdbfe;
    --text:#0f172a;--text-muted:#475569;--text-dim:#94a3b8;
    --accent:#2563eb;--accent-dark:#1e40af;
    --success:#059669;--success-bg:#d1fae5;--warning:#d97706;
    --danger:#dc2626;--danger-bg:#fee2e2;
    --serif:'Source Serif 4',Georgia,serif;--sans:'Inter',-apple-system,sans-serif;--mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:var(--bg-tint);color:var(--text);font-family:var(--sans);font-size:13.5px;line-height:1.5;min-height:100vh}
  .hidden{display:none!important}
  .loading{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--mono);font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-dim)}
  .shell{max-width:1640px;margin:0 auto;padding:0 20px 80px}
  h1.page-title{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:-0.02em;margin:24px 0 4px}
  .page-sub{color:var(--text-muted);margin:0 0 22px;font-size:14px}

  .btn{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;padding:9px 14px;border-radius:4px;cursor:pointer;border:1px solid transparent;font-weight:500}
  .btn-primary{background:var(--accent);color:#fff} .btn-primary:hover{background:var(--accent-dark)}
  .btn-ghost{background:var(--bg);color:var(--text-muted);border-color:var(--border)} .btn-ghost:hover{border-color:var(--text-dim);color:var(--text)}
  .btn-danger{background:var(--bg);color:var(--danger);border-color:#fecaca}
  .btn-sm{font-size:10px;padding:4px 8px}

  .banner-card{background:var(--bg);border:1px solid var(--border);border-radius:6px;margin-bottom:18px;overflow:hidden}
  .banner-head{background:#0f172a;color:#f1f5f9;padding:13px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
  .banner-head h2{font-family:var(--serif);font-size:17px;font-weight:500;margin:0;color:#f1f5f9}
  .banner-meta{font-family:var(--mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#94a3b8}
  .banner-body{padding:18px 20px}

  .form-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
  .field label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px}
  .field input{width:100%;background:var(--bg);border:1px solid var(--border);padding:8px 10px;font-family:var(--mono);font-size:12px;color:var(--text);border-radius:3px}

  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-muted);padding:7px 8px;border-bottom:1px solid var(--border);background:var(--bg-tint);white-space:nowrap}
  td{padding:7px 8px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:11px;white-space:nowrap}
  td.num{text-align:right} td.pos{color:var(--success)} td.neg{color:var(--danger)} td.dim{color:var(--text-muted)}
  td a{color:var(--accent);text-decoration:none;font-weight:600}
  tbody tr:hover{background:var(--bg-tint)}

  .target-input{width:65px;background:transparent;border:1px solid transparent;text-align:right;font-family:var(--mono);font-size:11px;color:var(--text);padding:2px 4px;border-radius:2px}
  .target-input:hover{border-color:var(--border)}
  .target-input:focus{outline:none;border-color:var(--accent);background:var(--bg)}

  .thesis-cell{max-width:280px;white-space:normal;font-family:var(--sans);font-size:11.5px;line-height:1.4;color:var(--text-muted)}

  .tag{display:inline-block;padding:1px 5px;border-radius:8px;font-size:8.5px;font-weight:600;letter-spacing:0.04em;margin-left:5px;vertical-align:middle}
  .tag-live{background:var(--success-bg);color:#065f46}
  .tag-eod{background:var(--border);color:var(--text-muted)}
  .tag-loading{background:var(--bg-blue);color:var(--accent-dark)}

  .empty{padding:32px 20px;text-align:center;color:var(--text-muted);font-size:13px;font-style:italic}
  .msg{padding:10px 14px;font-size:13px;border-radius:4px;margin:10px 0}
  .msg-error{background:var(--danger-bg);border:1px solid #fecaca;color:#991b1b}
  .msg-success{background:var(--success-bg);border:1px solid #a7f3d0;color:#065f46}
  .msg-info{background:var(--bg-blue);border:1px solid var(--border-blue);color:var(--accent-dark)}

  @media (max-width:980px){ .form-grid-3{grid-template-columns:1fr} }
</style>
</head>
<body>
<div id="loading-screen" class="loading">Loading watchlist…</div>
<div id="app" class="shell hidden">
  <div id="rr-nav-container"></div>

  <h1 class="page-title">Watchlist</h1>
  <p class="page-sub">Live quotes during market hours; falls back to last completed session's close-to-close move outside RTH.</p>

  <div id="msg-area"></div>

  <div class="banner-card">
    <div class="banner-head"><h2>Add ticker</h2><span class="banner-meta">Auto-fires research bootstrap</span></div>
    <div class="banner-body">
      <form id="add-form">
        <div class="form-grid-3">
          <div class="field"><label>Ticker</label><input type="text" name="ticker" required maxlength="8" style="text-transform:uppercase" placeholder="ADBE"></div>
          <div class="field"><label>Company name</label><input type="text" name="company_name" placeholder="Adobe Inc."></div>
          <div class="field"><label>Thesis (short)</label><input type="text" name="thesis" placeholder="Why this is on the list"></div>
        </div>
        <button type="submit" class="btn btn-primary">Add to watchlist</button>
      </form>
    </div>
  </div>

  <div class="banner-card">
    <div class="banner-head">
      <h2>Active tickers <span id="quote-status" class="tag tag-loading">FETCHING LIVE…</span></h2>
      <div style="display:flex;gap:10px;align-items:center">
        <span class="banner-meta" id="wl-count">—</span>
        <button id="refresh-btn" class="btn btn-ghost btn-sm" type="button">Refresh quotes</button>
      </div>
    </div>
    <div class="banner-body scroll">
      <table>
        <thead><tr>
          <th>Ticker</th>
          <th style="text-align:right">Price</th>
          <th style="text-align:right">1D</th>
          <th style="text-align:right">1W</th>
          <th style="text-align:right">1M</th>
          <th style="text-align:right">1Y</th>
          <th style="text-align:right">3Y</th>
          <th style="text-align:right">IVR</th>
          <th style="text-align:right">Up TGT $</th>
          <th style="text-align:right">Up %</th>
          <th style="text-align:right">Down TGT $</th>
          <th style="text-align:right">Down %</th>
          <th style="text-align:right">Cons.</th>
          <th>Thesis</th>
          <th></th>
        </tr></thead>
        <tbody id="wl-tbody"><tr><td colspan="15" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="/nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script>
(() => {
  const N8N = 'https://victoryvision.app.n8n.cloud';
  const cfg = window.RR_CONFIG || {};
  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_PUBLISHABLE_KEY);
  const DXLINK_URL = cfg.SUPABASE_URL + '/functions/v1/dxlink-quotes';
  let currentUser = null;
  let currentRows = [];
  let liveQuotes = {};

  const $ = id => document.getElementById(id);
  const show = (id, on) => $(id).classList.toggle('hidden', !(on!==false));
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const num = (n, d) => (n==null||isNaN(Number(n)))?'—':Number(n).toFixed(d==null?2:d);
  const pct = (n) => (n==null||isNaN(Number(n)))?'—':(Number(n)>=0?'+':'')+Number(n).toFixed(1)+'%';
  const usd2 = n => (n==null||isNaN(Number(n)))?'—':'$'+Number(n).toFixed(2);
  const cls = n => (n==null||isNaN(Number(n)))?'':(Number(n)>=0?'pos':'neg');
  const flash = (text, kind) => {
    $('msg-area').innerHTML = '<div class="msg msg-'+esc(kind||'info')+'">'+esc(text)+'</div>';
    if (kind !== 'error') setTimeout(() => { $('msg-area').innerHTML=''; }, 5000);
  };

  // Detect if US equity market is open (very rough: Mon-Fri 9:30-16:00 ET).
  function marketIsOpen() {
    const now = new Date();
    // Convert to ET via locale
    const etStr = now.toLocaleString('en-US', { timeZone: 'America/New_York', hour12: false });
    const et = new Date(etStr);
    const day = et.getDay();
    if (day === 0 || day === 6) return false;
    const mins = et.getHours()*60 + et.getMinutes();
    return mins >= 570 && mins < 960; // 9:30-16:00
  }

  (async () => {
    const r = await sb.auth.getSession();
    if (!r.data?.session?.user) { window.location.href='/index.html'; return; }
    currentUser = r.data.session.user;
    show('loading-screen', false); show('app', true);
    try { if (window.RidgeRunNav) await window.RidgeRunNav.mount({active:'watchlist', supabase:sb}); } catch(e){}
    $('add-form').addEventListener('submit', addTicker);
    $('refresh-btn').addEventListener('click', () => fetchLiveQuotes());
    await loadWatchlist();
  })();

  async function loadWatchlist() {
    const r = await sb.rpc('get_watchlist_view', { p_user: currentUser.id });
    if (r.error) { $('wl-tbody').innerHTML='<tr><td colspan="15" class="empty">Error: '+esc(r.error.message)+'</td></tr>'; return; }
    currentRows = (r.data && r.data.watchlist) || [];
    $('wl-count').textContent = currentRows.length+' ticker'+(currentRows.length===1?'':'s');
    if (!currentRows.length) { $('wl-tbody').innerHTML='<tr><td colspan="15" class="empty">No tickers yet.</td></tr>'; return; }
    renderTable();
    if (marketIsOpen()) {
      fetchLiveQuotes();
    } else {
      $('quote-status').textContent = 'MARKET CLOSED · showing last EOD';
      $('quote-status').className = 'tag tag-eod';
    }
  }

  async function fetchLiveQuotes() {
    $('quote-status').textContent = 'FETCHING LIVE…';
    $('quote-status').className = 'tag tag-loading';
    const tickers = currentRows.map(r => r.ticker).filter(t => t && t !== 'VIX');
    const batches = [];
    for (let i=0; i<tickers.length; i+=25) batches.push(tickers.slice(i, i+25));

    const results = await Promise.allSettled(batches.map(b =>
      fetch(DXLINK_URL, {
        method:'POST',
        headers:{'content-type':'application/json', 'apikey': cfg.SUPABASE_PUBLISHABLE_KEY, 'Authorization':'Bearer '+cfg.SUPABASE_PUBLISHABLE_KEY},
        body: JSON.stringify({ symbols: b })
      }).then(r => r.json())
    ));

    let liveCount = 0;
    results.forEach(res => {
      if (res.status === 'fulfilled' && res.value && Array.isArray(res.value.quotes)) {
        res.value.quotes.forEach(q => {
          if (q.symbol && q.bid != null && q.ask != null && Number(q.bid) > 0 && Number(q.ask) > 0) {
            const mid = (Number(q.bid) + Number(q.ask)) / 2;
            liveQuotes[q.symbol] = { bid: Number(q.bid), ask: Number(q.ask), mid };
            liveCount++;
          }
        });
      }
    });

    if (liveCount > 0) {
      $('quote-status').textContent = liveCount+'/'+tickers.length+' LIVE · '+new Date().toLocaleTimeString();
      $('quote-status').className = 'tag tag-live';
    } else {
      $('quote-status').textContent = 'NO LIVE · showing last EOD';
      $('quote-status').className = 'tag tag-eod';
    }
    renderTable();
  }

  function renderTable() {
    $('wl-tbody').innerHTML = currentRows.map(w => {
      const upTgt = w.user_target_price != null ? Number(w.user_target_price).toFixed(2) : '';
      const dnTgt = w.user_downside_price != null ? Number(w.user_downside_price).toFixed(2) : '';
      const lastClose  = w.last_close  != null ? Number(w.last_close)  : null;
      const priorClose = w.prior_close != null ? Number(w.prior_close) : null;
      const live = liveQuotes[w.ticker];
      const livePrice = live ? live.mid : null;
      const spot = livePrice != null ? livePrice : lastClose;

      // 1D logic:
      // - If live: compare live mid to last EOD close (today's intraday move)
      // - Else:    compare last EOD close to prior EOD close (last completed session's move)
      let perf1d = null, tag1d = '';
      if (livePrice != null && lastClose != null && lastClose > 0) {
        perf1d = (livePrice/lastClose - 1) * 100;
        tag1d  = '<span class="tag tag-live">LIVE</span>';
      } else if (lastClose != null && priorClose != null && priorClose > 0) {
        perf1d = (lastClose/priorClose - 1) * 100;
        tag1d  = '<span class="tag tag-eod" title="Close-to-close move on '+esc(w.last_date||'')+'">EOD</span>';
      }

      // Other perf bands: use whatever spot we have (live preferred, else last close)
      const perf1w = (spot != null && w.px_1wk_back > 0) ? (spot/w.px_1wk_back - 1)*100 : null;
      const perf1m = (spot != null && w.px_1mo_back > 0) ? (spot/w.px_1mo_back - 1)*100 : null;
      const perf1y = (spot != null && w.px_1yr_back > 0) ? (spot/w.px_1yr_back - 1)*100 : null;
      const perf3y = (spot != null && w.px_3yr_back > 0) ? (spot/w.px_3yr_back - 1)*100 : null;
      const userUp = (spot != null && w.user_target_price != null && spot > 0) ? (w.user_target_price/spot - 1)*100 : null;
      const userDn = (spot != null && w.user_downside_price != null && spot > 0) ? (w.user_downside_price/spot - 1)*100 : null;
      const consUp = (spot != null && w.analyst_target_high != null && spot > 0) ? (w.analyst_target_high/spot - 1)*100 : null;
      const priceTag = livePrice != null ? '<span class="tag tag-live">LIVE</span>' : '<span class="tag tag-eod" title="As of '+esc(w.last_date||'')+'">EOD</span>';

      return '<tr>'
        + '<td><a href="/research.html?ticker='+esc(w.ticker)+'">'+esc(w.ticker)+'</a></td>'
        + '<td class="num">'+usd2(spot)+priceTag+'</td>'
        + '<td class="num '+cls(perf1d)+'">'+(perf1d==null?'—':pct(perf1d))+tag1d+'</td>'
        + '<td class="num '+cls(perf1w)+'">'+pct(perf1w)+'</td>'
        + '<td class="num '+cls(perf1m)+'">'+pct(perf1m)+'</td>'
        + '<td class="num '+cls(perf1y)+'">'+pct(perf1y)+'</td>'
        + '<td class="num '+cls(perf3y)+'">'+pct(perf3y)+'</td>'
        + '<td class="num dim">'+(w.ivr!=null?num(w.ivr,0):'—')+'</td>'
        + '<td class="num"><input type="number" class="target-input" step="0.01" data-id="'+esc(w.id)+'" data-field="target_price" value="'+esc(upTgt)+'" placeholder="—"></td>'
        + '<td class="num '+cls(userUp)+'">'+pct(userUp)+'</td>'
        + '<td class="num"><input type="number" class="target-input" step="0.01" data-id="'+esc(w.id)+'" data-field="downside_target_price" value="'+esc(dnTgt)+'" placeholder="—"></td>'
        + '<td class="num '+cls(userDn)+'">'+pct(userDn)+'</td>'
        + '<td class="num dim" title="Analyst high '+usd2(w.analyst_target_high)+' / low '+usd2(w.analyst_target_low)+' ('+(w.analyst_count||0)+' analysts)">'+pct(consUp)+'</td>'
        + '<td class="thesis-cell" title="'+esc(w.thesis||'')+'">'+esc(w.thesis||'—')+'</td>'
        + '<td><button type="button" class="btn btn-sm btn-ghost" data-bootstrap="'+esc(w.ticker)+'" title="Re-fetch all data sources">↻</button> <button type="button" class="btn btn-sm btn-danger" data-remove="'+esc(w.id)+'" title="Remove">×</button></td>'
        + '</tr>';
    }).join('');
    wireRowEvents();
  }

  function wireRowEvents() {
    document.querySelectorAll('.target-input').forEach(inp => {
      inp.addEventListener('blur', async () => {
        const id = inp.dataset.id, field = inp.dataset.field;
        const val = inp.value === '' ? null : Number(inp.value);
        const upd = {}; upd[field] = val;
        const r = await sb.from('ticker_watchlist').update(upd).eq('id', id);
        if (r.error) flash('Save failed: '+r.error.message,'error');
        else { flash('Saved.','success'); loadWatchlist(); }
      });
    });
    document.querySelectorAll('button[data-remove]').forEach(b => {
      b.addEventListener('click', async () => {
        if (!confirm('Remove from watchlist?')) return;
        const r = await sb.from('ticker_watchlist').update({is_active:false}).eq('id', b.dataset.remove);
        if (r.error) flash('Remove failed: '+r.error.message,'error');
        else { flash('Removed.','success'); loadWatchlist(); }
      });
    });
    document.querySelectorAll('button[data-bootstrap]').forEach(b => {
      b.addEventListener('click', () => {
        const tk = b.dataset.bootstrap;
        flash('Refreshing data for '+tk+'…','info');
        bootstrapTicker(tk, false);  // incremental on re-fetch
      });
    });
  }

  async function addTicker(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const ticker = (fd.get('ticker')||'').trim().toUpperCase();
    if (!ticker) return;
    const row = {
      user_id: currentUser.id, ticker, symbol: ticker,
      company_name: fd.get('company_name') || null,
      thesis: fd.get('thesis') || null,
      is_active: true, added_at: new Date().toISOString()
    };
    const r = await sb.from('ticker_watchlist').insert(row);
    if (r.error) { flash('Save failed: '+r.error.message,'error'); return; }
    e.target.reset();
    flash('Added '+ticker+'. Fetching profile, fundamentals, analyst targets, bars, IV/IVR, and options chain…','info');
    loadWatchlist();
    bootstrapTicker(ticker, true);  // full_history=true for new ticker
  }

  // Fires all 6 backfill edge functions in parallel via the ticker-bootstrap orchestrator.
  // Populates: company_profile, company_fundamentals, analyst_price_targets, daily_bars,
  // vol_snapshots_v2, options_chain_snapshots. Drives research.html, model.html, watchlist.
  async function bootstrapTicker(ticker, fullHistory) {
    const url = cfg.SUPABASE_URL + '/functions/v1/ticker-bootstrap';
    try {
      const r = await fetch(url, {
        method:'POST',
        headers:{'content-type':'application/json','apikey':cfg.SUPABASE_PUBLISHABLE_KEY,'Authorization':'Bearer '+cfg.SUPABASE_PUBLISHABLE_KEY},
        body: JSON.stringify({ ticker, full_history: !!fullHistory })
      });
      const data = await r.json().catch(()=>({}));
      const ok = data.ok_count || 0;
      const tot = data.total || 6;
      const ms = data.total_ms || 0;
      if (ok === tot) {
        flash('✓ '+ticker+': all '+tot+' sources loaded ('+(ms/1000).toFixed(1)+'s). Refresh page to see new data.','success');
      } else {
        const failed = (data.results||[]).filter(x=>!x.ok).map(x=>x.fn).join(', ');
        flash('⚠ '+ticker+': '+ok+'/'+tot+' sources loaded ('+(ms/1000).toFixed(1)+'s). Failed: '+failed,'info');
      }
      loadWatchlist();
    } catch (e) {
      flash('Bootstrap failed for '+ticker+': '+String(e),'error');
    }
  }
})();
</script>
</body>
</html>
