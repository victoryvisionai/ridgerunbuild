<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Model — Ridge Run</title>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#fff;--ink:#0f172a;--ink2:#475569;--muted:#94a3b8;--line:#e2e8f0;--brand:#2563eb;--brand2:#1d4ed8;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--chip:#f1f5f9}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif}
  a{color:var(--brand);text-decoration:none}a:hover{text-decoration:underline}
  .wrap{padding:14px;max-width:1400px;margin:0 auto}
  .panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  .h1{font-size:18px;font-weight:700;margin:0 0 8px}
  .h2{font-size:13px;font-weight:700;color:var(--ink2);margin:10px 0 6px;text-transform:uppercase;letter-spacing:.04em}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .muted{color:var(--muted)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  .lookup{display:flex;gap:6px}
  .lookup input{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;text-transform:uppercase;font-weight:600}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
  .btn:hover{filter:brightness(.98)}
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
  .kpi{border:1px solid var(--line);border-radius:8px;padding:6px 8px}
  .kpi .l{font-size:10px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
  .kpi .v{font-size:14px;font-weight:700}
  table.tbl{border-collapse:collapse;width:100%;font-size:12px}
  table.tbl th,table.tbl td{border-bottom:1px solid var(--line);padding:5px 7px;text-align:right;white-space:nowrap}
  table.tbl th:first-child,table.tbl td:first-child{text-align:left}
  table.tbl th{background:#f8fafc;color:var(--ink2);font-weight:600}
  table.tbl input{width:80px;padding:3px 5px;border:1px solid var(--line);border-radius:4px;font:inherit;text-align:right}
  .ok-txt{color:var(--ok);font-weight:600}
  .bad-txt{color:var(--bad);font-weight:600}
  .scenario{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
  .scenario.bear{border-left:4px solid var(--bad)}
  .scenario.base{border-left:4px solid var(--brand)}
  .scenario.bull{border-left:4px solid var(--ok)}
  .scen-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
  .assump-grid{display:grid;grid-template-columns:1fr 90px;gap:4px 8px;font-size:12px;align-items:center}
  .assump-grid label{color:var(--ink2);font-weight:600}
  .assump-grid input{padding:3px 5px;border:1px solid var(--line);border-radius:4px;font:inherit;text-align:right}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--chip)}
  .pill.warn{background:#fef3c7;color:#92400e}
  .pill.brand{background:var(--brand);color:#fff}
  .empty{color:var(--muted);padding:24px;text-align:center;font-size:13px}
  .notes{width:100%;min-height:54px;padding:8px;border:1px solid var(--line);border-radius:6px;font:inherit;resize:vertical}
  .ticker-link{font-weight:700;color:var(--brand);cursor:pointer}
  .mode-banner{background:#fef3c7;border:1px solid #fde68a;color:#92400e;padding:8px 12px;border-radius:8px;margin:8px 0;font-size:12px}
</style>
</head>
<body>
<div id="nav"></div>
<script src="/nav.js"></script>

<div class="wrap">
  <section class="panel">
    <div class="h1">Valuation Model</div>
    <div class="lookup" style="margin-bottom:8px">
      <input id="tickerInput" placeholder="TICKER (e.g. AAPL, CORZ, TSM)" maxlength="10"/>
      <button class="btn primary" id="loadBtn">Load</button>
      <button class="btn" id="saveBtn">Save thesis</button>
    </div>
    <div id="header"></div>
    <div id="modeBanner"></div>
  </section>

  <section class="panel">
    <div class="h2">Annual history</div>
    <div id="historyTbl"><div class="empty">Load a ticker.</div></div>
  </section>

  <div class="grid2">
    <section class="panel">
      <div class="h2">Scenarios</div>
      <div id="scenarios"></div>
    </section>

    <section class="panel">
      <div class="h2">Output</div>
      <div id="output"><div class="empty">Adjust assumptions → live recompute.</div></div>
      <div class="h2" style="margin-top:14px">Notes</div>
      <textarea id="notes" class="notes" placeholder="Thesis notes, what would change your mind, exit triggers…"></textarea>
    </section>
  </div>
</div>

<script>
(function(){
  if(!window.RR_CONFIG){alert("Missing RR_CONFIG");return;}
  const sb = window.supabase = supabase.createClient(window.RR_CONFIG.SUPABASE_URL, window.RR_CONFIG.SUPABASE_PUBLISHABLE_KEY||window.RR_CONFIG.SUPABASE_ANON_KEY);
  const USER_ID = window.RR_CONFIG.USER_ID || 'e048e890-8554-429e-883e-d9c5d03a3510';

  const $=(s,r=document)=>r.querySelector(s); const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
  function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
  function fmt(x,d=2){return (x==null||isNaN(x))?'—':Number(x).toFixed(d)}
  function fmtPct(x,d=1){return (x==null||isNaN(x))?'—':((x>=0?'+':'')+(x*100).toFixed(d)+'%')}
  function fmtMoney(x){if(x==null||isNaN(x))return'—';const n=Number(x);if(Math.abs(n)>=1e9)return '$'+(n/1e9).toFixed(2)+'B';if(Math.abs(n)>=1e6)return '$'+(n/1e6).toFixed(0)+'M';if(Math.abs(n)>=1e3)return '$'+(n/1e3).toFixed(0)+'K';return '$'+n.toFixed(0)}
  function fmtMcap(x){if(x==null)return'—';if(x>=1e12)return '$'+(x/1e12).toFixed(2)+'T';if(x>=1e9)return '$'+(x/1e9).toFixed(1)+'B';if(x>=1e6)return '$'+(x/1e6).toFixed(0)+'M';return '$'+x}
  function num(x){const n=parseFloat(x);return isFinite(n)?n:null}

  let state = { ticker:null, spot:null, history:[], fund:null, mode:null, scenarios:null, assumptions:{} };

  async function loadTicker(t){
    if(!t) return;
    t = String(t).toUpperCase().trim();
    state.ticker = t;
    const url = new URL(window.location.href); url.searchParams.set('ticker',t); window.history.replaceState(null,'',url.toString());
    $('#header').innerHTML = `<div class="muted">Loading ${esc(t)}…</div>`;
    try{
      const {data, error} = await sb.rpc('get_ticker_deepdive', {p_user:USER_ID, p_ticker:t});
      if(error) throw error;
      const co = (data&&data.company)||{};
      const f = (data&&data.fundamentals_latest)||{};
      const annual = (data&&data.annual_history)||[];
      const thesis = (data&&data.thesis_model)||null;

      state.spot = co.price || null;
      state.history = annual;
      state.fund = f;

      const yrs = annual.filter(r=>r.revenue!=null).length;
      const isNewlyPublic = yrs < 3 || annual[0]?.year < (new Date().getFullYear() - 1);
      state.mode = (yrs >= 3) ? 'established' : 'forward_only';

      renderHeader(t, co, f);
      renderHistory(annual);
      renderModeBanner(state.mode, yrs);
      buildScenarios(thesis);
      recompute();

      if(thesis && thesis.notes) $('#notes').value = thesis.notes;
    }catch(e){console.error(e); $('#header').innerHTML = `<div class="empty">Failed: ${esc(e.message||e)}</div>`}
  }
  window.loadTicker = loadTicker;

  function renderHeader(t, co, f){
    $('#header').innerHTML = `
      <div class="row" style="justify-content:space-between">
        <div>
          <div class="h1" style="margin:0">${esc(t)} <span class="muted" style="font-weight:400;font-size:14px">${esc(co.name||'')}</span></div>
          <div class="muted" style="font-size:12px">${esc(co.sector||'')} · ${fmtMcap(co.market_cap)}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:24px;font-weight:700">$${fmt(co.price)}</div>
          <div class="muted" style="font-size:11px">52w: $${fmt(co.year_low)} – $${fmt(co.year_high)}</div>
        </div>
      </div>
      <div class="kpi-grid" style="margin-top:10px">
        <div class="kpi"><div class="l">PE</div><div class="v">${fmt(co.pe||f.pe_ltm,1)}</div></div>
        <div class="kpi"><div class="l">EV/EBITDA</div><div class="v">${fmt(f.ev_ebitda_ntm||f.ev_ebitda_ltm,1)}</div></div>
        <div class="kpi"><div class="l">FCF Yield</div><div class="v">${fmtPct(f.fcf_yield_ntm||f.fcf_yield_ltm)}</div></div>
        <div class="kpi"><div class="l">Rev g 3yh</div><div class="v">${fmtPct(f.rev_growth_3y_hist)}</div></div>
        <div class="kpi"><div class="l">Rev g 3yf</div><div class="v">${fmtPct(f.rev_growth_3y_fwd)}</div></div>
        <div class="kpi"><div class="l">ND/EBITDA</div><div class="v">${fmt(f.net_debt_ebitda,1)}</div></div>
        <div class="kpi"><div class="l">Gross %</div><div class="v">${fmtPct(f.gross_margin)}</div></div>
        <div class="kpi"><div class="l">EBITDA %</div><div class="v">${fmtPct(f.ebitda_margin)}</div></div>
      </div>`;
  }

  function renderHistory(hist){
    if(!hist.length){$('#historyTbl').innerHTML = '<div class="empty">No annual history</div>';return}
    const rows = hist.slice(0,7);
    $('#historyTbl').innerHTML = `<table class="tbl"><thead><tr><th>Year</th><th>Revenue</th><th>EBITDA</th><th>FCF</th><th>EPS</th><th>Shares (M)</th><th>Net debt</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.year)}</td><td>${fmtMoney(r.revenue)}</td><td>${fmtMoney(r.ebitda)}</td><td>${fmtMoney(r.fcf)}</td><td>${fmt(r.eps,2)}</td><td>${r.shares?fmt(r.shares/1e6,0):'—'}</td><td>${fmtMoney(r.net_debt)}</td></tr>`).join('')}</tbody></table>`;
  }

  function renderModeBanner(mode, yrs){
    if(mode==='forward_only'){
      $('#modeBanner').innerHTML = `<div class="mode-banner">⚠️ Only ${yrs} years of history. Switched to forward-only DCF based on analyst estimates. Use multiples cross-check on comps.</div>`;
    }else{
      $('#modeBanner').innerHTML = '';
    }
  }

  function defaultAssumptions(scenario){
    const f = state.fund || {};
    const histG = f.rev_growth_3y_hist;
    const fwdG = f.rev_growth_3y_fwd;
    const ebitdaM = f.ebitda_margin || 0.20;
    const fcfM = f.fcf_margin || 0.12;
    const evEbitda = f.ev_ebitda_ntm || f.ev_ebitda_ltm || 12;
    const peM = f.pe_ltm || 18;

    const baseG = (fwdG!=null && histG!=null) ? (fwdG*0.5 + histG*0.5) : (fwdG ?? histG ?? 0.05);

    const scenarios = {
      bear:    { growth: baseG-0.05, margin: ebitdaM*0.85, exit_mult: evEbitda*0.75, pe_exit: peM*0.75, years:3 },
      base:    { growth: baseG,      margin: ebitdaM,       exit_mult: evEbitda,      pe_exit: peM,      years:3 },
      bull:    { growth: baseG+0.05, margin: ebitdaM*1.15,  exit_mult: evEbitda*1.20, pe_exit: peM*1.20, years:3 }
    };
    return scenarios[scenario];
  }

  function buildScenarios(thesis){
    const saved = (thesis && thesis.assumptions) || {};
    state.scenarios = {
      bear: Object.assign(defaultAssumptions('bear'), saved.bear||{}),
      base: Object.assign(defaultAssumptions('base'), saved.base||{}),
      bull: Object.assign(defaultAssumptions('bull'), saved.bull||{})
    };
    renderScenarios();
  }

  function renderScenarios(){
    const labels = {bear:'Bear', base:'Base', bull:'Bull'};
    $('#scenarios').innerHTML = ['bear','base','bull'].map(k=>{
      const a = state.scenarios[k];
      return `<div class="scenario ${k}">
        <div class="scen-head">${labels[k]}<span class="muted" style="font-size:11px">${k==='base'?'most likely':k==='bear'?'downside':'upside'}</span></div>
        <div class="assump-grid">
          <label>Rev growth (annual)</label><input type="number" step="0.01" value="${fmt(a.growth,3)}" data-scen="${k}" data-key="growth"/>
          <label>EBITDA margin</label><input type="number" step="0.01" value="${fmt(a.margin,3)}" data-scen="${k}" data-key="margin"/>
          <label>Exit EV/EBITDA</label><input type="number" step="0.5" value="${fmt(a.exit_mult,1)}" data-scen="${k}" data-key="exit_mult"/>
          <label>Exit P/E</label><input type="number" step="0.5" value="${fmt(a.pe_exit,1)}" data-scen="${k}" data-key="pe_exit"/>
          <label>Years</label><input type="number" step="1" value="${a.years||3}" data-scen="${k}" data-key="years"/>
        </div>
      </div>`;
    }).join('');
    $$('#scenarios input').forEach(el=>el.addEventListener('input', onAssumpChange));
  }
  function onAssumpChange(e){
    const k = e.target.dataset.scen; const key = e.target.dataset.key;
    const v = num(e.target.value); if(v==null) return;
    state.scenarios[k][key] = v;
    recompute();
  }

  function recompute(){
    if(!state.scenarios){return}
    const out = {};
    for(const k of ['bear','base','bull']){
      out[k] = projectScenario(state.scenarios[k]);
    }
    state.computed = out;
    renderOutput(out);
  }

  function projectScenario(a){
    const latest = state.history[0] || {};
    const baseRev = latest.revenue;
    const sharesM = (latest.shares||0)/1e6 || null;
    const netDebt = latest.net_debt;

    if(!baseRev || baseRev<=0){
      // Forward-only: use analyst estimates
      const f = state.fund || {};
      const ntmRev = f.market_cap && f.ev_revenue_ntm ? (f.market_cap+f.net_debt||0)/f.ev_revenue_ntm : null;
      if(!ntmRev) return {error:'no_base'};
      const futureRev = ntmRev * Math.pow(1+a.growth, a.years);
      const ebitda = futureRev * a.margin;
      const ev = ebitda * a.exit_mult;
      const eq = ev - (netDebt||0);
      const implied = sharesM ? eq/sharesM : null;
      return {ebitda, ev, equity:eq, implied_price:implied, return_pct: implied&&state.spot ? (implied/state.spot - 1) : null, ann_return: implied&&state.spot ? Math.pow(implied/state.spot, 1/a.years) - 1 : null, mode:'forward'};
    }
    const futureRev = baseRev * Math.pow(1+a.growth, a.years);
    const ebitda = futureRev * a.margin;
    const ev = ebitda * a.exit_mult;
    const eq = ev - (netDebt||0);
    const implied = sharesM ? eq/sharesM : null;
    return {ebitda, ev, equity:eq, implied_price:implied, return_pct: implied&&state.spot ? (implied/state.spot - 1) : null, ann_return: implied&&state.spot ? Math.pow(implied/state.spot, 1/a.years) - 1 : null, mode:'history'};
  }

  function renderOutput(out){
    const spot = state.spot;
    const asymmetry = (out.bull?.implied_price && out.bear?.implied_price && spot && spot>out.bear.implied_price)
      ? (out.bull.implied_price - spot) / (spot - out.bear.implied_price) : null;
    const labels = {bear:'Bear',base:'Base',bull:'Bull'};
    const rows = ['bear','base','bull'].map(k=>{
      const o = out[k]||{};
      const color = o.return_pct>=0?'ok-txt':'bad-txt';
      return `<tr><td><b>${labels[k]}</b></td><td>${fmtMoney(o.ebitda)}</td><td>${fmtMoney(o.equity)}</td><td>$${fmt(o.implied_price)}</td><td class="${color}">${fmtPct(o.return_pct)}</td><td class="${color}">${fmtPct(o.ann_return)} /yr</td></tr>`;
    }).join('');
    $('#output').innerHTML = `
      <div class="kpi-grid">
        <div class="kpi"><div class="l">Current price</div><div class="v">$${fmt(spot)}</div></div>
        <div class="kpi"><div class="l">Base implied</div><div class="v">$${fmt(out.base?.implied_price)}</div></div>
        <div class="kpi"><div class="l">Base return</div><div class="v ${out.base?.return_pct>=0?'ok-txt':'bad-txt'}">${fmtPct(out.base?.return_pct)}</div></div>
        <div class="kpi"><div class="l">Asymmetry (bull$/bear$)</div><div class="v">${asymmetry==null?'—':fmt(asymmetry,2)+'x'}</div></div>
      </div>
      <table class="tbl" style="margin-top:8px"><thead><tr><th>Scenario</th><th>EBITDA exit</th><th>Equity</th><th>Implied $</th><th>Return</th><th>Annualized</th></tr></thead><tbody>${rows}</tbody></table>
      ${state.mode==='forward_only'?'<div class="muted" style="font-size:11px;margin-top:6px">Forward-only mode: base revenue derived from NTM estimates.</div>':''}`;
  }

  async function saveThesis(){
    if(!state.ticker || !state.computed){return alert('Load a ticker first.')}
    const row = {
      user_id: USER_ID,
      ticker: state.ticker,
      scenario_label: 'base',
      base_price: state.spot,
      assumptions: state.scenarios,
      computed: {
        bear_implied_price: state.computed.bear?.implied_price,
        base_implied_price: state.computed.base?.implied_price,
        bull_implied_price: state.computed.bull?.implied_price,
        annualized_return: state.computed.base?.ann_return,
        return_pct: state.computed.base?.return_pct
      },
      notes: $('#notes').value || null,
      is_active: true,
      updated_at: new Date().toISOString()
    };
    try{
      const {error} = await sb.from('thesis_models').upsert(row, {onConflict:'user_id,ticker,scenario_label'});
      if(error) throw error;
      alert('Thesis saved.');
    }catch(e){alert('Save failed: '+e.message)}
  }

  $('#loadBtn').addEventListener('click', ()=>{const v=$('#tickerInput').value.trim().toUpperCase(); if(v) loadTicker(v)});
  $('#tickerInput').addEventListener('keydown', e=>{if(e.key==='Enter'){const v=e.target.value.trim().toUpperCase(); if(v) loadTicker(v)}});
  $('#saveBtn').addEventListener('click', saveThesis);

  const url = new URL(window.location.href);
  const initT = url.searchParams.get('ticker');
  if(initT){$('#tickerInput').value = initT; loadTicker(initT)}
})();
</script>
</body>
</html>
