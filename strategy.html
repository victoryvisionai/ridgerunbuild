<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Strategy — Ridge Run</title>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#fff;--ink:#0f172a;--ink2:#475569;--muted:#94a3b8;--line:#e2e8f0;--brand:#2563eb;--brand2:#1d4ed8;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--chip:#f1f5f9;}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif}
  a{color:var(--brand);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{display:grid;grid-template-columns:380px 1fr;gap:14px;padding:14px;max-width:1600px;margin:0 auto}
  @media(max-width:1100px){.wrap{grid-template-columns:1fr}}
  .panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
  .h1{font-size:18px;font-weight:700;margin:0 0 8px}
  .h2{font-size:14px;font-weight:700;color:var(--ink2);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em}
  .muted{color:var(--muted)}
  .row{display:flex;gap:8px;align-items:center}
  .pill{display:inline-block;background:var(--chip);color:var(--ink);padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
  .pill.brand{background:var(--brand);color:#fff}
  .pill.ok{background:#dcfce7;color:#166534}
  .pill.warn{background:#fef3c7;color:#92400e}
  .pill.bad{background:#fee2e2;color:#991b1b}
  .tk{font-weight:700;cursor:pointer;color:var(--brand)}
  .tk:hover{text-decoration:underline}
  .card{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff}
  .card .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
  .card .body{color:var(--ink);font-size:13px}
  .card .meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px;margin:6px 0}
  .kv b{color:var(--ink2);font-weight:600}
  .slot{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
  .btnrow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  button,.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 12px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
  button.primary,.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  button.primary:hover{background:var(--brand2)}
  button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
  button.warn{background:#fff;color:var(--warn);border-color:var(--warn)}
  button.bad{background:#fff;color:var(--bad);border-color:var(--bad)}
  button:hover{filter:brightness(.98)}
  .note{width:100%;min-height:54px;padding:8px;border:1px solid var(--line);border-radius:6px;font:inherit;resize:vertical;margin-top:6px}
  .chatwrap{display:flex;flex-direction:column;height:calc(100vh - 120px);min-height:520px}
  .msgs{flex:1;overflow-y:auto;padding:6px 2px 12px}
  .msg{margin:8px 0;max-width:90%}
  .msg.user{margin-left:auto;background:#eef2ff;border:1px solid #c7d2fe;border-radius:10px;padding:8px 10px}
  .msg.assistant{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .composer{display:flex;gap:6px;border-top:1px solid var(--line);padding-top:8px}
  .composer textarea{flex:1;min-height:54px;padding:8px;border:1px solid var(--line);border-radius:6px;font:inherit;resize:vertical}
  table.tbl{border-collapse:collapse;width:100%;font-size:12px;margin:6px 0}
  table.tbl th,table.tbl td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:right}
  table.tbl th:first-child,table.tbl td:first-child{text-align:left}
  table.tbl th{color:var(--ink2);font-weight:600;background:#f8fafc}
  .ok-txt{color:var(--ok);font-weight:600}
  .bad-txt{color:var(--bad);font-weight:600}
  .ticker-link{font-weight:700;color:var(--brand);cursor:pointer}
  .ticker-link:hover{text-decoration:underline}
  .empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:8px}
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.4);display:none;align-items:center;justify-content:center;z-index:50}
  .modal.show{display:flex}
  .modal .inner{background:#fff;border-radius:12px;max-width:720px;width:92%;max-height:80vh;overflow:auto;padding:18px}
</style>
</head>
<body>
<div id="nav"></div>
<script src="/nav.js"></script>

<div class="wrap">
  <!-- LEFT: Today's recs feed -->
  <section class="panel">
    <div class="row" style="justify-content:space-between">
      <h2 class="h1">Today's Scout</h2>
      <button id="refreshRecs" class="btn">Refresh</button>
    </div>
    <div class="muted" id="recsMeta" style="margin-bottom:8px"></div>
    <div id="recsList"><div class="empty">Loading…</div></div>
  </section>

  <!-- RIGHT: Chat -->
  <section class="panel chatwrap">
    <h2 class="h1">Chat with Ridge Run AI</h2>
    <div class="muted" style="margin-bottom:6px">Scans 150 candidates incl. watchlist + positions. Mention a ticker for a deep dive (chains, spreads, comps).</div>
    <div id="msgs" class="msgs"></div>
    <div class="composer">
      <textarea id="composerInput" placeholder='e.g. "Give me the best 3 short-theta ideas in semis right now" or "Deep dive PYPL"'></textarea>
      <button id="sendBtn" class="primary">Send</button>
    </div>
  </section>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)hideModal()">
  <div class="inner" id="modalInner"></div>
</div>

<script>
(function(){
  if(!window.RR_CONFIG){alert("Missing RR_CONFIG (load /config.js first)");return;}
  const sb = window.supabase = supabase.createClient(window.RR_CONFIG.SUPABASE_URL, window.RR_CONFIG.SUPABASE_ANON_KEY);
  const USER_ID = window.RR_CONFIG.USER_ID || 'e048e890-8554-429e-883e-d9c5d03a3510';

  const fnURL = (slug) => `${window.RR_CONFIG.SUPABASE_URL}/functions/v1/${slug}`;
  async function authHeader(){
    const {data:{session}} = await sb.auth.getSession();
    const t = session?.access_token || window.RR_CONFIG.SUPABASE_ANON_KEY;
    return {Authorization:`Bearer ${t}`,'Content-Type':'application/json'};
  }

  // ---------- Helpers ----------
  const $=(s,r=document)=>r.querySelector(s); const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
  function fmtPct(x,d=1){return (x==null||isNaN(x))?'—':((x>=0?'+':'')+(x*100).toFixed(d)+'%')}
  function fmtNum(x,d=2){return (x==null||isNaN(x))?'—':Number(x).toFixed(d)}
  function fmtMcap(x){if(x==null)return'—';if(x>=1e12)return '$'+(x/1e12).toFixed(2)+'T';if(x>=1e9)return '$'+(x/1e9).toFixed(1)+'B';if(x>=1e6)return '$'+(x/1e6).toFixed(0)+'M';return '$'+x}
  function tickerLink(t){return `<span class="ticker-link" onclick="window.location.href='/research.html?ticker=${encodeURIComponent(t)}'">${t}</span>`}
  function pillClass(score){if(score==null)return'';if(score>=75)return 'ok';if(score>=50)return 'warn';return'bad'}
  function esc(s){return String(s==null?'':s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
  function showModal(html){$('#modalInner').innerHTML=html;$('#modal').classList.add('show')}
  function hideModal(){$('#modal').classList.remove('show')}
  window.hideModal=hideModal;

  // ---------- Slot/component renderer ----------
  function renderSlot(slot){
    if(!slot||!slot.component) return '';
    const t = slot.title?`<div class="h2" style="margin-top:2px">${esc(slot.title)}</div>`:'';
    const d = slot.data||{};
    try{
      switch(slot.component){
        case 'thesis_card': return t+renderThesisCard(d);
        case 'payoff_diagram': return t+renderPayoff(d);
        case 'iv_term_chart': return t+renderIvTerm(d);
        case 'fundamentals_5fy': return t+renderFiveYr(d);
        case 'peer_comparison': return t+renderPeers(d);
        case 'position_sizing': return t+renderSizing(d);
        case 'catalyst_timeline': return t+renderCatalysts(d);
        case 'growth_x_multiple': return t+renderGrowthMultiple(d);
        case 'short_thesis_card': return t+renderShortThesis(d);
        case 'ranked_list': return t+renderRanked(d);
        case 'kpi_grid': return t+renderKpi(d);
        case 'bar_chart': case 'line_chart': return t+renderChart(slot.component,d);
        case 'table_simple': return t+renderTableSimple(d);
        case 'markdown_text': return t+`<div class="body">${esc(d.text||'')}</div>`;
        case 'pair_correlation': return t+renderPair(d);
        case 'credit_recovery': return t+renderCredit(d);
        case 'deal_arb': return t+renderDealArb(d);
        case 'core_holding_card': return t+renderCoreHolding(d);
        default: return t+`<pre style="white-space:pre-wrap;font-size:11px;color:var(--ink2)">${esc(JSON.stringify(d,null,2))}</pre>`;
      }
    }catch(e){console.warn('slot render',e); return t+`<div class="muted">render error</div>`}
  }
  function renderThesisCard(d){
    const tk = d.ticker?tickerLink(d.ticker):'';
    return `<div class="kv">
      ${tk?`<b>Ticker</b><div>${tk}</div>`:''}
      ${d.opportunity_type?`<b>Type</b><div>${esc(d.opportunity_type)}${d.direction?' / '+esc(d.direction):''}</div>`:''}
      ${d.structure?`<b>Structure</b><div>${esc(d.structure)}</div>`:''}
      ${d.strike!=null?`<b>Strike</b><div>${esc(d.strike)}</div>`:''}
      ${d.expiry?`<b>Expiry</b><div>${esc(d.expiry)}</div>`:''}
      ${d.conviction!=null?`<b>Conviction</b><div>${esc(d.conviction)}/5</div>`:''}
      ${d.expected_return_pct!=null?`<b>Exp return</b><div>${fmtPct(d.expected_return_pct)}</div>`:''}
      ${d.expected_horizon_days!=null?`<b>Horizon</b><div>${esc(d.expected_horizon_days)}d</div>`:''}
      ${d.max_loss!=null?`<b>Max loss</b><div>$${esc(d.max_loss)}</div>`:''}
    </div>
    ${d.thesis?`<div class="body" style="margin:6px 0">${esc(d.thesis)}</div>`:''}
    ${d.what_to_watch?`<div class="kv"><b>Watch</b><div>${esc(d.what_to_watch)}</div></div>`:''}
    ${d.exit_criteria?`<div class="kv"><b>Exit</b><div>${esc(d.exit_criteria)}</div></div>`:''}`;
  }
  function renderPayoff(d){
    return `<div class="kv">
      <b>Ticker</b><div>${d.ticker?tickerLink(d.ticker):'—'}</div>
      <b>Structure</b><div>${esc(d.structure||'—')}</div>
      <b>Spot</b><div>${fmtNum(d.spot)}</div>
      <b>Strike</b><div>${fmtNum(d.strike)}</div>
      <b>Premium</b><div>${fmtNum(d.premium)}</div>
      <b>Breakeven</b><div>${fmtNum(d.breakeven)}</div>
      <b>Max loss</b><div>${fmtNum(d.max_loss)}</div>
      <b>Max gain</b><div>${d.max_gain==null?'—':fmtNum(d.max_gain)}</div>
    </div>`;
  }
  function renderIvTerm(d){
    const pts=Array.isArray(d.points)?d.points:[];
    return `<table class="tbl"><thead><tr><th>DTE</th><th>IV</th></tr></thead><tbody>${pts.map(p=>`<tr><td>${esc(p.dte)}</td><td>${fmtPct(p.iv)}</td></tr>`).join('')}</tbody></table>
    ${d.iv_rank!=null?`<div class="muted">IV rank: ${fmtNum(d.iv_rank,0)}${d.regime?' · '+esc(d.regime):''}</div>`:''}`;
  }
  function renderFiveYr(d){
    const y=Array.isArray(d.years)?d.years:[];
    return `<table class="tbl"><thead><tr><th>Year</th><th>Rev</th><th>EBITDA</th><th>FCF</th><th>EPS</th></tr></thead><tbody>${y.map(r=>`<tr><td>${esc(r.year)}</td><td>${fmtMcap(r.revenue)}</td><td>${fmtMcap(r.ebitda)}</td><td>${fmtMcap(r.fcf)}</td><td>${fmtNum(r.eps)}</td></tr>`).join('')}</tbody></table>`;
  }
  function renderPeers(d){
    const t=Array.isArray(d.tickers)?d.tickers:[];
    return `<table class="tbl"><thead><tr><th>Ticker</th><th>PE</th><th>EV/EBITDA</th><th>FCF Yld</th><th>Rev g</th><th>1y</th></tr></thead><tbody>${t.map(r=>`<tr><td>${tickerLink(r.ticker)}</td><td>${fmtNum(r.pe,1)}</td><td>${fmtNum(r.ev_ebitda,1)}</td><td>${fmtPct(r.fcf_yield)}</td><td>${fmtPct(r.rev_growth)}</td><td>${fmtPct(r.return_1y)}</td></tr>`).join('')}</tbody></table>`;
  }
  function renderSizing(d){
    return `<div class="kv">
      <b>Ticker</b><div>${d.ticker?tickerLink(d.ticker):'—'}</div>
      <b>Structure</b><div>${esc(d.structure||'—')}</div>
      <b>Contracts</b><div>${esc(d.recommended_contracts??'—')}</div>
      <b>Sizing $</b><div>${d.sizing_dollars==null?'—':'$'+fmtNum(d.sizing_dollars,0)}</div>
      <b>Max loss</b><div>${d.max_loss==null?'—':'$'+fmtNum(d.max_loss,0)}</div>
      <b>% of NAV</b><div>${fmtPct(d.pct_of_nav)}</div>
      <b>Breakeven</b><div>${fmtNum(d.breakeven_at_expiry)}</div>
      <b>DTE</b><div>${esc(d.days_to_expiry??'—')}</div>
    </div>`;
  }
  function renderCatalysts(d){
    const c=Array.isArray(d.catalysts)?d.catalysts:[];
    return `<table class="tbl"><thead><tr><th>Date</th><th>Type</th><th>Label</th><th>Impact</th></tr></thead><tbody>${c.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.type)}</td><td>${esc(x.label||'')}</td><td>${esc(x.impact||'')}</td></tr>`).join('')}</tbody></table>`;
  }
  function renderGrowthMultiple(d){
    const s=Array.isArray(d.scenarios)?d.scenarios:[];
    return `<div class="kv"><b>Base price</b><div>${fmtNum(d.base_price)}</div></div>
    <table class="tbl"><thead><tr><th>Scenario</th><th>Mult</th><th>Growth</th><th>Implied $</th><th>Return</th></tr></thead><tbody>${s.map(r=>`<tr><td>${esc(r.label)}</td><td>${fmtNum(r.multiple,1)}x</td><td>${fmtPct(r.growth_pct)}</td><td>${fmtNum(r.implied_price)}</td><td>${fmtPct(r.return_pct)}</td></tr>`).join('')}</tbody></table>`;
  }
  function renderShortThesis(d){
    return `<div class="kv">
      <b>Ticker</b><div>${d.ticker?tickerLink(d.ticker):'—'}</div>
      <b>Short interest</b><div>${fmtPct(d.short_interest_pct)}</div>
      <b>Days to cover</b><div>${fmtNum(d.days_to_cover,1)}</div>
      <b>Borrow cost</b><div>${fmtPct(d.borrow_cost_pct)}</div>
      <b>Catalyst</b><div>${esc(d.downside_catalyst||'')}</div>
      <b>Hedge strike</b><div>${esc(d.upside_protection_strike||'')}</div>
    </div>`;
  }
  function renderRanked(d){
    const items=Array.isArray(d.items)?d.items:[];
    return `<table class="tbl"><thead><tr><th>Ticker</th><th>Score</th><th>Reason</th></tr></thead><tbody>${items.map(r=>`<tr><td>${tickerLink(r.ticker)}</td><td>${fmtNum(r.score,0)}</td><td style="text-align:left">${esc(r.reason||'')}</td></tr>`).join('')}</tbody></table>`;
  }
  function renderKpi(d){
    const t=Array.isArray(d.tiles)?d.tiles:[];
    return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px">${t.map(k=>`<div style="border:1px solid var(--line);border-radius:8px;padding:6px 8px"><div class="muted" style="font-size:11px">${esc(k.label||'')}</div><div style="font-weight:700">${esc(k.value||'')}</div>${k.delta?`<div style="font-size:11px">${esc(k.delta)}</div>`:''}</div>`).join('')}</div>`;
  }
  function renderChart(kind,d){
    const pts=Array.isArray(d.points||d.data)?(d.points||d.data):[];
    return `<div class="muted" style="font-size:11px">${esc(kind)}</div>
    <table class="tbl"><thead><tr><th>${esc(d.x_label||'X')}</th><th>${esc(d.y_label||'Y')}</th></tr></thead><tbody>${pts.map(p=>`<tr><td>${esc(p.x??p.label??'')}</td><td>${fmtNum(p.y??p.value)}</td></tr>`).join('')}</tbody></table>`;
  }
  function renderTableSimple(d){
    const cols=Array.isArray(d.columns)?d.columns:[]; const rows=Array.isArray(d.rows)?d.rows:[];
    return `<table class="tbl"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${(Array.isArray(r)?r:cols.map(c=>r[c])).map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  }
  function renderPair(d){
    return `<div class="kv">
      <b>Long</b><div>${d.long_ticker?tickerLink(d.long_ticker):'—'}</div>
      <b>Short</b><div>${d.short_ticker?tickerLink(d.short_ticker):'—'}</div>
      <b>Correlation</b><div>${fmtNum(d.correlation,2)}</div>
      <b>Beta</b><div>${fmtNum(d.beta,2)}</div>
      <b>Current spread</b><div>${fmtNum(d.current_spread)}</div>
      <b>Mean</b><div>${fmtNum(d.mean_spread)}</div>
      <b>σ</b><div>${fmtNum(d.sigma)}</div>
    </div>`;
  }
  function renderCredit(d){return `<pre style="white-space:pre-wrap;font-size:11px">${esc(JSON.stringify(d,null,2))}</pre>`}
  function renderDealArb(d){return `<pre style="white-space:pre-wrap;font-size:11px">${esc(JSON.stringify(d,null,2))}</pre>`}
  function renderCoreHolding(d){return renderThesisCard(d)}

  // ---------- Today's Recs ----------
  async function loadRecs(){
    $('#recsList').innerHTML='<div class="empty">Loading…</div>';
    try{
      const {data,error} = await sb.rpc('get_todays_recs',{p_user:USER_ID});
      if(error) throw error;
      const recs = Array.isArray(data)?data:[];
      $('#recsMeta').textContent = `${recs.length} ideas pending · ${new Date().toLocaleString()}`;
      if(!recs.length){$('#recsList').innerHTML='<div class="empty">No new ideas. Trigger overnight scout or chat below.</div>';return}
      $('#recsList').innerHTML = recs.map(renderRecCard).join('');
      $$('.rec-action').forEach(b=>b.addEventListener('click',onRecAction));
    }catch(e){
      console.error(e);
      $('#recsList').innerHTML='<div class="empty">Failed to load recs.</div>';
    }
  }
  function renderRecCard(r){
    const slots = Array.isArray(r.slots)?r.slots:[];
    const slotsHtml = slots.map(s=>`<div class="slot">${renderSlot(s)}</div>`).join('');
    const id = r.id;
    return `<div class="card" data-rec-id="${id}">
      <div class="hd">
        <div>${tickerLink(r.ticker)} <span class="pill brand">${esc(r.opportunity_type||'—')}</span>${r.direction?' <span class="pill">'+esc(r.direction)+'</span>':''}</div>
        <div><span class="pill ${pillClass(r.composite_score)}">${r.composite_score!=null?Math.round(r.composite_score):'—'}</span></div>
      </div>
      <div class="body">${esc(r.reasoning||'')}</div>
      <div class="kv">
        ${r.structure?`<b>Structure</b><div>${esc(r.structure)}</div>`:''}
        ${r.what_to_watch?`<b>Watch</b><div>${esc(r.what_to_watch)}</div>`:''}
        ${r.exit_criteria?`<b>Exit</b><div>${esc(r.exit_criteria)}</div>`:''}
        ${r.expected_return_pct!=null?`<b>Exp return</b><div>${fmtPct(r.expected_return_pct)}</div>`:''}
        ${r.expected_horizon_days!=null?`<b>Horizon</b><div>${esc(r.expected_horizon_days)}d</div>`:''}
        ${r.sizing_dollars!=null?`<b>Sizing $</b><div>$${fmtNum(r.sizing_dollars,0)}</div>`:''}
        ${r.max_loss!=null?`<b>Max loss</b><div>$${fmtNum(r.max_loss,0)}</div>`:''}
      </div>
      ${slotsHtml}
      <textarea class="note" data-rec-id="${id}" placeholder="Why accept / dismiss? (saves to your DNA + ticker notes)"></textarea>
      <div class="btnrow">
        <button class="rec-action ok" data-action="accept" data-rec-id="${id}">Accept</button>
        <button class="rec-action warn" data-action="later" data-rec-id="${id}">Later</button>
        <button class="rec-action bad" data-action="dismiss" data-rec-id="${id}">Dismiss</button>
      </div>
    </div>`;
  }
  async function onRecAction(ev){
    const btn = ev.currentTarget; const id = btn.dataset.recId; const action = btn.dataset.action;
    const card = btn.closest('.card'); const note = card.querySelector('.note').value.trim();
    btn.disabled=true; btn.textContent='…';
    const r = recCache[id]||{};
    const body = {user_id:USER_ID, action, rec:{
      ai_recommendation_id:id, ticker:r.ticker, opportunity_type:r.opportunity_type, direction:r.direction,
      structure:r.structure, composite_score:r.composite_score, thesis:r.reasoning,
      what_to_watch:r.what_to_watch, exit_criteria:r.exit_criteria,
      expected_horizon_days:r.expected_horizon_days, expected_return_pct:r.expected_return_pct,
      max_loss:r.max_loss, user_reason: note || null,
      strike:r.strike, expiry:r.expiry, conviction:r.conviction
    }};
    try{
      const headers = await authHeader();
      const res = await fetch(fnURL('strategy-save-rec'),{method:'POST',headers,body:JSON.stringify(body)});
      if(!res.ok) throw new Error(await res.text());
      card.style.opacity=.5; card.style.pointerEvents='none';
      setTimeout(loadRecs,400);
    }catch(e){console.error(e); alert('Save failed: '+e.message); btn.disabled=false; btn.textContent=action}
  }
  const recCache = {};
  const origRender = renderRecCard;
  renderRecCard = function(r){recCache[r.id]=r; return origRender(r)};

  // ---------- Chat ----------
  async function loadChatHistory(){
    try{
      const {data,error} = await sb.from('strategy_chat_log').select('role,content,slots,created_at').eq('user_id',USER_ID).order('created_at',{ascending:false}).limit(20);
      if(error) throw error;
      const msgs = (data||[]).slice().reverse();
      const box = $('#msgs'); box.innerHTML='';
      for(const m of msgs) appendMsg(m.role, m.content, m.slots);
      box.scrollTop = box.scrollHeight;
    }catch(e){console.warn('chat history',e)}
  }
  function appendMsg(role, content, slots){
    const div = document.createElement('div'); div.className='msg '+(role==='user'?'user':'assistant');
    div.innerHTML = `<div>${esc(content)}</div>` + (Array.isArray(slots)?slots.map(s=>`<div class="slot">${renderSlot(s)}</div>`).join(''):'');
    $('#msgs').appendChild(div);
    $('#msgs').scrollTop = $('#msgs').scrollHeight;
    return div;
  }
  async function sendChat(){
    const t = $('#composerInput'); const text = t.value.trim(); if(!text) return;
    appendMsg('user', text, null); t.value='';
    const thinking = appendMsg('assistant','Thinking…',null);
    try{
      const headers = await authHeader();
      const {data:hist} = await sb.from('strategy_chat_log').select('role,content').eq('user_id',USER_ID).order('created_at',{ascending:false}).limit(10);
      const history = (hist||[]).slice().reverse().map(m=>({role:m.role,content:m.content}));
      const res = await fetch(fnURL('strategy-chat'),{method:'POST',headers,body:JSON.stringify({user_id:USER_ID,message:text,history})});
      const j = await res.json();
      thinking.remove();
      appendMsg('assistant', j.reply||'(no reply)', j.slots);
    }catch(e){thinking.querySelector('div').textContent='Error: '+e.message}
  }

  // ---------- Wire up ----------
  $('#refreshRecs').addEventListener('click',loadRecs);
  $('#sendBtn').addEventListener('click',sendChat);
  $('#composerInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();sendChat()}});

  loadRecs();
  loadChatHistory();
})();
</script>
</body>
</html>
