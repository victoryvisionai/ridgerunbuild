<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Research · Ridge Run</title>
<script>(function(){try{var t=localStorage.getItem('RR_THEME')||'editorial';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/themes.css" />
<style>
  :root{
    --bg:#fff;--bg-tint:#f8fafc;--bg-blue:#eff6ff;--border:#e2e8f0;--border-blue:#bfdbfe;
    --text:#0f172a;--text-muted:#475569;--text-dim:#94a3b8;
    --accent:#2563eb;--accent-dark:#1e40af;
    --success:#059669;--success-bg:#d1fae5;--warning:#d97706;--warning-bg:#fed7aa;
    --danger:#dc2626;--danger-bg:#fee2e2;
    --serif:'Source Serif 4',Georgia,serif;--sans:'Inter',-apple-system,sans-serif;--mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:var(--bg-tint);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;min-height:100vh}
  .hidden{display:none!important}
  .loading{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--mono);font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-dim)}
  .shell{max-width:1320px;margin:0 auto;padding:0 24px 80px}

  .ticker-bar{display:flex;align-items:center;gap:10px;margin:18px 0 8px;flex-wrap:wrap}
  .ticker-input{font-family:var(--mono);font-size:16px;font-weight:500;background:var(--bg);border:1px solid var(--border);padding:9px 12px;border-radius:4px;width:180px;color:var(--text);text-transform:uppercase;letter-spacing:0.05em}
  .ticker-input:focus{outline:none;border-color:var(--accent)}
  .btn{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;padding:9px 14px;border-radius:4px;cursor:pointer;border:1px solid transparent;font-weight:500;transition:all .15s}
  .btn-primary{background:var(--accent);color:#fff} .btn-primary:hover{background:var(--accent-dark)} .btn-primary:disabled{opacity:.5;cursor:wait}
  .btn-ghost{background:var(--bg);color:var(--text-muted);border-color:var(--border)} .btn-ghost:hover{border-color:var(--text-dim);color:var(--text)}
  .btn-sm{font-size:10px;padding:5px 9px}

  .watchlist-row{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px;align-items:center}
  .watchlist-row .wl-label{font-family:var(--mono);font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted);margin-right:6px}
  .watchlist-chip{font-family:var(--mono);font-size:11px;letter-spacing:0.04em;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 11px;border-radius:14px;cursor:pointer;text-decoration:none;font-weight:600}
  .watchlist-chip:hover{border-color:var(--accent);color:var(--accent);background:var(--bg-blue)}
  .watchlist-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

  .banner-card{background:var(--bg);border:1px solid var(--border);border-radius:6px;margin-bottom:18px;overflow:hidden}
  .banner-head{background:#0f172a;color:#f1f5f9;padding:13px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
  .banner-head h2{font-family:var(--serif);font-size:17px;font-weight:500;margin:0;color:#f1f5f9;letter-spacing:-0.01em}
  .banner-meta{font-family:var(--mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#94a3b8}
  .banner-body{padding:20px 22px}
  .h2-sub{color:var(--text-muted);font-size:13px;margin:0 0 14px;line-height:1.55}

  .header-grid{display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:start}
  .company-block .name{font-family:var(--serif);font-size:28px;font-weight:600;letter-spacing:-0.02em;margin-bottom:4px}
  .company-block .sub{font-family:var(--mono);font-size:11px;color:var(--text-muted);letter-spacing:0.06em;margin-bottom:14px;text-transform:uppercase}
  .company-block .desc{font-size:13.5px;color:var(--text-muted);line-height:1.6;margin:0}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

  .metric-box{padding:13px 14px;background:var(--bg-tint);border:1px solid var(--border);border-radius:4px;display:flex;flex-direction:column}
  .metric-box .l{font-family:var(--mono);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}
  .metric-box .v{font-family:var(--serif);font-size:20px;font-weight:500;letter-spacing:-0.01em;color:var(--text)}
  .metric-box .v.pos{color:var(--success)} .metric-box .v.neg{color:var(--danger)}
  .metric-box .sub{font-family:var(--mono);font-size:10px;color:var(--text-dim);margin-top:3px}
  .metric-box.cheap{border-color:#a7f3d0;background:#ecfdf5}
  .metric-box.rich{border-color:#fcd34d;background:#fffbeb}
  .metric-box.neutral{border-color:var(--border-blue);background:var(--bg-blue)}

  .badge{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:4px 10px;border-radius:3px;border:1px solid var(--border);background:var(--bg-tint);color:var(--text-muted);margin-right:6px}
  .badge.cheap{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
  .badge.rich{background:#fffbeb;border-color:#fcd34d;color:#92400e}
  .badge.lean-buy{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}
  .badge.lean-sell{background:#fef3c7;border-color:#fcd34d;color:#92400e}
  .badge.neutral{background:#f1f5f9;border-color:#cbd5e1;color:#334155}
  .badge.contango{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}
  .badge.backwardation{background:#fef3c7;border-color:#fcd34d;color:#92400e}

  .strat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  .strat-card{background:var(--bg);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:4px;padding:14px 16px}
  .strat-card.sell{border-left-color:var(--warning)}
  .strat-card .strat-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .strat-card .strat-name{font-family:var(--serif);font-size:16px;font-weight:600}
  .strat-card .strat-score{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:600}
  .strat-card .strat-side{font-family:var(--mono);font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px}
  .strat-card .strat-rat{font-size:12.5px;line-height:1.55;margin-bottom:8px}
  .strat-card .strat-when{font-size:11.5px;color:var(--text-muted);line-height:1.5;margin-bottom:4px}
  .strat-card .strat-when b{color:var(--text);font-weight:600}
  .strat-card .strat-flag{font-size:11.5px;color:var(--danger);line-height:1.5;margin-bottom:8px}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);padding:8px;border-bottom:1px solid var(--border);background:var(--bg-tint);position:sticky;top:0;z-index:1}
  td{padding:7px 8px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:11.5px;color:var(--text)}
  td.num{text-align:right} td.pos{color:var(--success)} td.neg{color:var(--danger)}
  td.itm{background:#fef3c7}
  tr.atm td{background:#eff6ff;font-weight:600}
  tr:hover td{background:var(--bg-blue)}

  .chain-wrap{max-height:520px;overflow:auto;border:1px solid var(--border);border-radius:4px}
  .chain-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .chain-controls select, .chain-controls input{font-family:var(--mono);font-size:11px;background:var(--bg);border:1px solid var(--border);padding:6px 10px;border-radius:3px;color:var(--text)}
  .chain-controls label{font-family:var(--mono);font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-muted)}

  .term-sparkline{display:flex;align-items:flex-end;gap:14px;height:80px;padding:8px 0}
  .term-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
  .term-bar .b{width:100%;background:linear-gradient(to top,var(--accent),#60a5fa);border-radius:2px 2px 0 0;min-height:4px}
  .term-bar .l{font-family:var(--mono);font-size:9px;color:var(--text-muted);letter-spacing:0.1em;text-transform:uppercase}
  .term-bar .v{font-family:var(--mono);font-size:11px;color:var(--text);font-weight:600}

  .news-item{padding:10px 0;border-bottom:1px solid var(--border)}
  .news-item:last-child{border-bottom:none}
  .news-item .headline{font-size:13.5px;color:var(--text);text-decoration:none;line-height:1.4;display:block;margin-bottom:3px}
  .news-item .headline:hover{color:var(--accent)}
  .news-item .src{font-family:var(--mono);font-size:10px;color:var(--text-dim);letter-spacing:0.08em;text-transform:uppercase}

  .note-item{padding:10px 12px;background:var(--bg-tint);border:1px solid var(--border);border-radius:4px;margin-bottom:8px;display:flex;justify-content:space-between;gap:12px}
  .note-item.pinned{border-left:3px solid var(--accent)}
  .note-item .txt{flex:1;font-size:13px;line-height:1.5;white-space:pre-wrap}
  .note-item .meta{font-family:var(--mono);font-size:10px;color:var(--text-dim);margin-top:4px}

  .empty{padding:24px;text-align:center;color:var(--text-muted);font-size:13px;font-style:italic}
  .msg{padding:10px 14px;font-size:13px;border-radius:4px;line-height:1.5;margin:8px 0}
  .msg-error{background:var(--danger-bg);border:1px solid #fecaca;color:#991b1b}
  .msg-info{background:var(--bg-blue);border:1px solid var(--border-blue);color:var(--accent-dark)}
  .msg-success{background:var(--success-bg);border:1px solid #a7f3d0;color:#065f46}

  @media (max-width:980px){
    .header-grid{grid-template-columns:1fr}
    .grid-4{grid-template-columns:repeat(2,1fr)}
    .grid-3{grid-template-columns:1fr}
    .strat-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div id="loading-screen" class="loading">Loading research…</div>

<div id="app" class="shell hidden">
  <div id="rr-nav-container"></div>

  <div class="ticker-bar">
    <input type="text" id="ticker-input" class="ticker-input" placeholder="Ticker" maxlength="8" autocomplete="off">
    <button class="btn btn-primary" id="load-btn">Load</button>
    <button class="btn btn-ghost" id="refresh-btn" title="Re-fire data webhooks">Refresh data</button>
    <span class="banner-meta" id="ticker-status"></span>
  </div>

  <div class="watchlist-row" id="watchlist-row">
    <span class="wl-label">Watchlist</span>
    <span class="banner-meta" id="wl-empty" style="font-style:italic">Loading…</span>
  </div>

  <div id="msg-area"></div>
  <div id="content"></div>
</div>

<script src="/nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script>
(() => {
  const N8N = 'https://victoryvision.app.n8n.cloud';
  const cfg = window.RR_CONFIG || {};
  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_PUBLISHABLE_KEY);
  let currentUser = null;
  let currentTicker = null;
  let currentSpot = null;

  const $ = id => document.getElementById(id);
  const show = (id, on=true) => $(id).classList.toggle('hidden', !on);
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt2 = n => (n==null||isNaN(n))?'—':Number(n).toFixed(2);
  const fmt4 = n => (n==null||isNaN(n))?'—':Number(n).toFixed(4);
  const fmtPct = (n,d=1) => (n==null||isNaN(n))?'—':(Number(n)*100).toFixed(d)+'%';
  const fmtBigUSD = n => {
    if (n == null || isNaN(n)) return '—';
    const x = Number(n);
    if (x >= 1e12) return '$'+(x/1e12).toFixed(2)+'T';
    if (x >= 1e9) return '$'+(x/1e9).toFixed(2)+'B';
    if (x >= 1e6) return '$'+(x/1e6).toFixed(1)+'M';
    return '$'+x.toLocaleString();
  };
  const flash = (text, kind) => {
    $('msg-area').innerHTML = '<div class="msg msg-'+esc(kind||'info')+'">'+esc(text)+'</div>';
    if (kind !== 'error') setTimeout(function(){ $('msg-area').innerHTML=''; }, 6000);
  };

  (async () => {
    const r = await sb.auth.getSession();
    const session = r && r.data && r.data.session;
    if (!session || !session.user) { window.location.href='/index.html'; return; }
    currentUser = session.user;
    show('loading-screen', false);
    show('app', true);
    try { if (window.RidgeRunNav) await window.RidgeRunNav.mount({active:'research', supabase:sb}); } catch(e){}

    loadWatchlist();

    const params = new URLSearchParams(location.search);
    const t = (params.get('ticker') || '').toUpperCase();
    if (t) {
      $('ticker-input').value = t;
      loadTicker(t);
    } else {
      $('content').innerHTML = '<div class="banner-card"><div class="banner-body"><div class="empty">Click a watchlist ticker above or enter a symbol to load research.</div></div></div>';
    }
  })();

  $('load-btn').addEventListener('click', () => {
    const t = ($('ticker-input').value||'').trim().toUpperCase();
    if (t) {
      history.replaceState(null,'','?ticker='+encodeURIComponent(t));
      loadTicker(t);
    }
  });
  $('ticker-input').addEventListener('keydown', e => { if (e.key==='Enter') $('load-btn').click(); });
  $('refresh-btn').addEventListener('click', () => { if (currentTicker) fireBootstrap(currentTicker, true); });

  async function loadWatchlist() {
    const res = await sb.from('ticker_watchlist')
      .select('ticker, company_name').eq('user_id', currentUser.id).eq('is_active', true)
      .order('ticker');
    const data = res.data || [];
    const row = $('watchlist-row');
    const html = ['<span class="wl-label">Watchlist</span>'];
    if (!data.length) {
      html.push('<span class="banner-meta" style="font-style:italic">No watchlist tickers — add some on /watchlist.html</span>');
    } else {
      data.forEach(w => {
        const title = w.company_name ? esc(w.company_name) : esc(w.ticker);
        html.push('<a href="?ticker='+esc(w.ticker)+'" class="watchlist-chip" data-wl="'+esc(w.ticker)+'" title="'+title+'">'+esc(w.ticker)+'</a>');
      });
    }
    row.innerHTML = html.join('');
    row.querySelectorAll('a.watchlist-chip').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        const t = a.dataset.wl;
        $('ticker-input').value = t;
        history.replaceState(null,'','?ticker='+encodeURIComponent(t));
        document.querySelectorAll('.watchlist-chip').forEach(x => x.classList.remove('active'));
        a.classList.add('active');
        loadTicker(t);
      });
    });
    // Mark active if URL has ticker
    if (currentTicker) {
      const m = row.querySelector('a.watchlist-chip[data-wl="'+currentTicker+'"]');
      if (m) m.classList.add('active');
    }
  }

  async function loadTicker(ticker) {
    currentTicker = ticker;
    document.querySelectorAll('.watchlist-chip').forEach(x => {
      x.classList.toggle('active', x.dataset.wl === ticker);
    });
    $('ticker-status').textContent = 'Loading…';
    $('content').innerHTML = '<div class="banner-card"><div class="banner-body"><div class="empty">Loading data for '+esc(ticker)+'…</div></div></div>';
    // Always fire bootstrap — refreshes API data for this ticker
    fireBootstrap(ticker, false);
    $('content').innerHTML = renderSkeleton();
    await Promise.allSettled([
      loadHeader(ticker), loadThesis(ticker), loadStrategies(ticker), loadOptionsChain(ticker),
      loadTermStructure(ticker), loadInsider(ticker), loadAnalysts(ticker), loadPriceTargets(ticker),
      loadNews(ticker), loadCatalysts(ticker), loadFundamentals(ticker), loadNotes(ticker)
    ]);
    $('ticker-status').textContent = 'Loaded ' + ticker;
  }

  function fireBootstrap(ticker, announce) {
    if (announce) flash('Refreshing data for '+ticker+' — fundamentals, options, vol, insider, analyst. Re-querying in ~10s.', 'info');
    // Try /research/bootstrap first; if 404 or fail, fall back to firing the 5 individual webhooks.
    fetch(N8N+'/webhook/research/bootstrap', {
      method:'POST',
      headers:{'content-type':'application/json'},
      body: JSON.stringify({ ticker: ticker })
    }).then(function(r){
      if (!r.ok && r.status === 404) {
        // Fallback: fire 5 webhooks in parallel
        ['historical/backfill','insider/sync','analyst/sync','options/snap','vol/backfill'].forEach(function(p){
          fetch(N8N+'/webhook/'+p, {
            method:'POST', headers:{'content-type':'application/json'},
            body: JSON.stringify({ ticker: ticker })
          }).catch(function(){});
        });
      }
      if (announce) setTimeout(function(){ if (currentTicker===ticker) loadTicker(ticker); }, 10000);
    }).catch(function(){
      // Network fail — fall back
      ['historical/backfill','insider/sync','analyst/sync','options/snap','vol/backfill'].forEach(function(p){
        fetch(N8N+'/webhook/'+p, {
          method:'POST', headers:{'content-type':'application/json'},
          body: JSON.stringify({ ticker: ticker })
        }).catch(function(){});
      });
    });
  }

  function renderSkeleton() {
    return ''
      + '<div id="sec-header"></div>'
      + '<div id="sec-thesis"></div>'
      + '<div id="sec-regime"></div>'
      + '<div id="sec-term"></div>'
      + '<div id="sec-chain"></div>'
      + '<div class="grid-2"><div id="sec-insider"></div><div id="sec-analysts"></div></div>'
      + '<div id="sec-targets"></div>'
      + '<div class="grid-2"><div id="sec-news"></div><div id="sec-catalysts"></div></div>'
      + '<div id="sec-fund"></div>'
      + '<div id="sec-notes"></div>';
  }

  async function loadHeader(ticker) {
    const profR = await sb.from('company_profile').select('*').eq('ticker',ticker).maybeSingle();
    const fundR = await sb.from('company_fundamentals').select('*').eq('ticker',ticker).order('as_of_date',{ascending:false}).limit(1).maybeSingle();
    const volR = await sb.from('v_latest_vol_strategy').select('*').eq('ticker',ticker).maybeSingle();
    const wlR = await sb.from('ticker_watchlist').select('id, is_active').eq('user_id',currentUser.id).eq('ticker',ticker).maybeSingle();
    const prof = profR.data; const vol = volR.data;
    const inWL = !!(wlR.data && wlR.data.is_active);
    if (vol && vol.spot) currentSpot = Number(vol.spot);
    const ivR = vol && vol.iv_rank_1y;
    const ivClass = ivR == null ? 'neutral' : (ivR < 25 ? 'cheap' : ivR > 75 ? 'rich' : 'neutral');
    const ivLabel = ivR == null ? '' : (ivR < 25 ? 'Cheap vol' : ivR > 75 ? 'Rich vol' : 'Moderate');
    const sub = [
      prof && prof.ceo ? 'CEO '+esc(prof.ceo) : null,
      prof && prof.employees ? Number(prof.employees).toLocaleString()+' employees' : null,
      prof && prof.beta != null ? 'β '+Number(prof.beta).toFixed(2) : null,
      prof && prof.next_earnings_date ? 'Next earnings '+esc(prof.next_earnings_date) : null
    ].filter(Boolean).join(' · ');
    const desc = (prof && prof.description) ? prof.description.slice(0,640)+((prof.description.length>640)?'…':'') : 'No description available.';
    const wlBtn = inWL
      ? '<span class="btn btn-sm" style="background:var(--success);color:#fff;cursor:default">✓ In watchlist</span>'
      : '<button type="button" class="btn btn-sm btn-primary" id="add-wl-btn">＋ Add to watchlist</button>';
    $('sec-header').innerHTML = ''
      + '<div class="banner-card"><div class="banner-head">'
      + '<h2>'+esc(ticker)+(prof && prof.company_name ? ' · '+esc(prof.company_name) : '')+'</h2>'
      + '<span style="display:flex;gap:10px;align-items:center">'
      + '<span class="banner-meta">'+(prof && prof.sector ? esc(prof.sector) : '')+(prof && prof.industry ? ' · '+esc(prof.industry) : '')+'</span>'
      + wlBtn
      + '</span>'
      + '</div><div class="banner-body">'
      + '<div class="header-grid"><div class="company-block">'
      + '<div class="sub">'+sub+'</div><p class="desc">'+esc(desc)+'</p>'
      + '</div><div class="grid-2" style="grid-template-columns:1fr 1fr">'
      + '<div class="metric-box"><div class="l">Spot</div><div class="v">'+(vol && vol.spot!=null?'$'+fmt2(vol.spot):'—')+'</div><div class="sub">'+(vol && vol.as_of_date || '')+'</div></div>'
      + '<div class="metric-box '+ivClass+'"><div class="l">IV Rank 1y</div><div class="v">'+(vol && vol.iv_rank_1y!=null?Math.round(vol.iv_rank_1y):'—')+'</div><div class="sub">'+ivLabel+'</div></div>'
      + '<div class="metric-box"><div class="l">IV 30d</div><div class="v">'+(vol && vol.iv_30d!=null?fmtPct(vol.iv_30d):'—')+'</div><div class="sub">'+(vol && vol.hv_30d!=null?'HV30 '+fmtPct(vol.hv_30d):'')+'</div></div>'

  function badgeFor(kind, val) {
    if (!val) return '';
    const lbl = String(val).replace(/_/g,' ');
    let cls = 'neutral';
    if (kind === 'vol') {
      if (val.indexOf('cheap')>=0) cls='cheap';
      else if (val.indexOf('rich')>=0) cls='rich';
      else if (val==='lean_buy') cls='lean-buy';
      else if (val==='lean_sell') cls='lean-sell';
    } else if (kind === 'term') {
      if (val==='contango') cls='contango';
      else if (val==='backwardation') cls='backwardation';
    } else if (kind === 'skew') {
      if (String(val).indexOf('put')>=0) cls='lean-sell';
      else if (String(val).indexOf('call')>=0) cls='lean-buy';
    }
    return '<span class="badge '+cls+'">'+esc(lbl)+'</span>';
  }

  async function useStrategy(ticker, stratName, side) {
    const oppType = inferOppType(stratName);
    const structure = stratName.toLowerCase().replace(/ /g,'_');
    const direction = side === 'buy' ? 'long' : 'short';
    const r = await sb.from('trade_ideas').insert({
      user_id: currentUser.id, ticker, opportunity_type: oppType, direction,
      proposed_structure: structure, thesis: 'Seeded from research.html: '+stratName,
      status: 'idea', source: 'research_strategy_button', conviction: 3
    });
    if (r.error) flash('Save failed: '+r.error.message, 'error');
    else flash('Saved as trade idea: '+stratName+' on '+ticker+'. Open Strategy page to flesh out.', 'success');
  }

  function inferOppType(s) {
    s = (s||'').toLowerCase();
    if (s.indexOf('leap')>=0) return 'asymmetric_leap';
    if (s.indexOf('straddle')>=0 || s.indexOf('strangle')>=0) return 'earnings_play';
    if (s.indexOf('iron condor')>=0 || s.indexOf('covered call')>=0 || s.indexOf('cash-secured')>=0) return 'short_thesis';
    if (s.indexOf('calendar')>=0) return 'pair_trade';
    return 'asymmetric_leap';
  }

  async function loadOptionsChain(ticker) {
    const fiveDaysAgo = new Date(Date.now()-5*86400000).toISOString().slice(0,10);
    const r = await sb.from('options_chain_snapshots')
      .select('expiry, strike, side, bid, ask, last, volume, open_interest, iv, delta, gamma, theta, vega, underlying_price, as_of_date')
      .eq('ticker', ticker).gte('as_of_date', fiveDaysAgo)
      .order('expiry',{ascending:true}).order('strike',{ascending:true}).limit(5000);
    const data = r.data; const error = r.error;
    if (error || !data || !data.length) {
      $('sec-chain').innerHTML = '<div class="banner-card"><div class="banner-head"><h2>Options expirations</h2><span class="banner-meta">Click an expiry to see all strikes</span></div>'
        + '<div class="banner-body"><div class="empty">No recent options chain for '+esc(ticker)+'. Click "Refresh data" above to fire backfill.'+(error?' Error: '+esc(error.message):'')+'</div></div></div>';
      return;
    }
    const latestDate = data.reduce((m,row) => row.as_of_date > m ? row.as_of_date : m, '');
    const fresh = data.filter(row => row.as_of_date === latestDate);
    const spot = (fresh[0] && fresh[0].underlying_price) || currentSpot;

    // Group by expiry — compute summary stats per expiry
    const byExp = {};
    fresh.forEach(rw => {
      if (!byExp[rw.expiry]) byExp[rw.expiry] = { calls:0, puts:0, total_oi:0, total_vol:0, ivs:[], strikes:new Set(), rows:[] };
      const g = byExp[rw.expiry];
      g.rows.push(rw);
      if (rw.side === 'call') g.calls++; else if (rw.side === 'put') g.puts++;
      if (rw.open_interest!=null) g.total_oi += Number(rw.open_interest)||0;
      if (rw.volume!=null) g.total_vol += Number(rw.volume)||0;
      if (rw.iv!=null && spot && Math.abs(rw.strike-spot)/spot < 0.05) g.ivs.push(Number(rw.iv));
      g.strikes.add(rw.strike);
    });
    const today = new Date();
    const expRows = Object.keys(byExp).sort().map(exp => {
      const g = byExp[exp];
      const dte = Math.round((new Date(exp+'T00:00:00Z').getTime() - today.getTime()) / 86400000);
      const atmIv = g.ivs.length ? (g.ivs.reduce((a,b)=>a+b,0)/g.ivs.length) : null;
      return { expiry: exp, dte: dte, atm_iv: atmIv, strikes: g.strikes.size, calls: g.calls, puts: g.puts, total_oi: g.total_oi, total_vol: g.total_vol, rows: g.rows };
    });

    $('sec-chain').innerHTML = ''
      + '<div class="banner-card"><div class="banner-head"><h2>Options expirations</h2>'
      + '<span class="banner-meta">As of '+esc(latestDate)+' · Spot $'+fmt2(spot)+' · '+expRows.length+' expirations · '+fresh.length+' contracts</span>'
      + '</div><div class="banner-body">'
      + '<table style="cursor:pointer"><thead><tr>'
      + '<th>Expiry</th><th style="text-align:right">DTE</th>'
      + '<th style="text-align:right">ATM IV</th>'
      + '<th style="text-align:right">Strikes</th>'
      + '<th style="text-align:right">Calls</th><th style="text-align:right">Puts</th>'
      + '<th style="text-align:right">Total OI</th><th style="text-align:right">Total vol</th>'
      + '</tr></thead><tbody id="exp-tbody"></tbody></table>'

      + '<div id="strikes-modal-root"></div>';
    $('exp-tbody').innerHTML = expRows.map((e,i) => '<tr data-exp-idx="'+i+'" style="cursor:pointer"><td><strong>'+esc(e.expiry)+'</strong></td><td class="num">'+e.dte+'</td><td class="num">'+(e.atm_iv!=null?(e.atm_iv*100).toFixed(1)+'%':'—')+'</td><td class="num">'+e.strikes+'</td><td class="num">'+e.calls+'</td><td class="num">'+e.puts+'</td><td class="num">'+Number(e.total_oi).toLocaleString()+'</td><td class="num">'+Number(e.total_vol).toLocaleString()+'</td></tr>').join('');
    document.querySelectorAll('[data-exp-idx]').forEach(tr => {

  async function loadTermStructure(ticker) {
    // Current IVs
    const cur = await sb.from('v_latest_vol_strategy').select('*').eq('ticker',ticker).maybeSingle();
    const curData = cur.data;
    if (!curData) { $('sec-term').innerHTML=''; return; }
    // Historical 90d of vol_snapshots for averages
    const since = new Date(Date.now()-90*86400000).toISOString().slice(0,10);
    const hist = await sb.from('vol_snapshots').select('as_of_date,iv_30d,iv_90d,iv_180d,iv_365d')
      .eq('ticker',ticker).gte('as_of_date',since).order('as_of_date',{ascending:true});
    const histRows = (hist.data || []);
    function avg(field) {
      const vals = histRows.map(r=>Number(r[field])).filter(v=>isFinite(v));
      return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
    }
    const tenors = [
      { label: '30d',  cur: Number(curData.iv_30d),  avg: avg('iv_30d') },
      { label: '90d',  cur: Number(curData.iv_90d),  avg: avg('iv_90d') },
      { label: '180d', cur: Number(curData.iv_180d), avg: avg('iv_180d') },
      { label: '365d', cur: Number(curData.iv_365d), avg: avg('iv_365d') }
    ].filter(t => isFinite(t.cur));
    if (!tenors.length) { $('sec-term').innerHTML=''; return; }
    const maxIV = Math.max.apply(null, tenors.flatMap(t => [t.cur, t.avg].filter(v=>v!=null)));
    const histDays = histRows.length;
    const slope = (curData.iv_365d != null && curData.iv_30d != null) ? ((curData.iv_365d-curData.iv_30d)/curData.iv_30d) : null;
    const slopeLabel = slope == null ? '' : (slope > 0.05 ? 'Contango' : slope < -0.05 ? 'Backwardation' : 'Flat term');

    const w = 720, h = 240, m = {top:18,right:24,bottom:36,left:48};
    const iw = w-m.left-m.right, ih = h-m.top-m.bottom;
    const barW = iw / tenors.length;
    let svg = '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:240px">';
    // y-axis labels
    for (let i=0;i<=4;i++){
      const v = maxIV * (i/4);
      const y = m.top + ih - (i/4)*ih;
      svg += '<line x1="'+m.left+'" y1="'+y+'" x2="'+(m.left+iw)+'" y2="'+y+'" stroke="#e2e8f0" stroke-dasharray="2,3"/>';
      svg += '<text x="'+(m.left-6)+'" y="'+(y+3)+'" text-anchor="end" font-size="10" fill="#64748b">'+(v*100).toFixed(0)+'%</text>';
    }
    tenors.forEach((t, i) => {
      const cx = m.left + barW*i + barW*0.5;
      const wB = barW*0.32;
      const curBarH = (t.cur/maxIV)*ih;
      const avgBarH = t.avg != null ? (t.avg/maxIV)*ih : 0;
      // current (blue, left)
      svg += '<rect x="'+(cx - wB - 4)+'" y="'+(m.top+ih-curBarH)+'" width="'+wB+'" height="'+curBarH+'" rx="3" fill="#1d4ed8"/>';
      svg += '<text x="'+(cx - wB/2 - 4)+'" y="'+(m.top+ih-curBarH-4)+'" text-anchor="middle" font-size="10" fill="#1d4ed8" font-weight="600">'+(t.cur*100).toFixed(1)+'%</text>';
      // historical avg (gray, right)
      if (t.avg != null) {
        svg += '<rect x="'+(cx + 4)+'" y="'+(m.top+ih-avgBarH)+'" width="'+wB+'" height="'+avgBarH+'" rx="3" fill="#94a3b8"/>';
        svg += '<text x="'+(cx + wB/2 + 4)+'" y="'+(m.top+ih-avgBarH-4)+'" text-anchor="middle" font-size="10" fill="#64748b">'+(t.avg*100).toFixed(1)+'%</text>';
        // delta vs avg
        const dpct = (t.cur - t.avg) / t.avg;
        const dCol = Math.abs(dpct) < 0.05 ? '#64748b' : (dpct > 0 ? '#dc2626' : '#059669');
        svg += '<text x="'+cx+'" y="'+(m.top+ih+24)+'" text-anchor="middle" font-size="10" fill="'+dCol+'" font-weight="600">'+(dpct>0?'+':'')+(dpct*100).toFixed(0)+'% vs 90d avg</text>';
      }
      svg += '<text x="'+cx+'" y="'+(m.top+ih+14)+'" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="600">'+t.label+'</text>';
    });
    // Legend
    svg += '<g transform="translate('+(m.left)+','+(h-8)+')">'
      + '<rect x="0" y="-9" width="10" height="10" fill="#1d4ed8"/><text x="14" y="0" font-size="10" fill="#0f172a">Current</text>'
      + '<rect x="80" y="-9" width="10" height="10" fill="#94a3b8"/><text x="94" y="0" font-size="10" fill="#0f172a">90d avg</text>'
      + '</g>';
    svg += '</svg>';

    $('sec-term').innerHTML = '<div class="banner-card"><div class="banner-head"><h2>IV term: current vs historical avg</h2>'
      + '<span class="banner-meta">'+esc(slopeLabel)+(slope!=null?' · slope '+(slope*100).toFixed(1)+'%':'')+' · '+histDays+' days of history</span>'
      + '</div><div class="banner-body">'+svg+'</div></div>';
  }

      + '<div class="banner-body" style="max-height:340px;overflow:auto"><table><thead><tr><th>Date</th><th>Insider</th><th>Type</th><th style="text-align:right">Shares</th><th style="text-align:right">Value</th></tr></thead><tbody>'
      + data.map(rw => {
        const isBuy = (rw.transaction_type||'').toLowerCase().indexOf('buy')>=0 || (rw.transaction_type||'').toLowerCase().indexOf('purchase')>=0;
        return '<tr><td>'+esc(rw.transaction_date||'')+'</td><td>'+esc((rw.insider_name||'').slice(0,28))+'<br><span style="font-size:9px;color:var(--text-dim)">'+esc(rw.insider_title||'')+'</span></td>'
          + '<td class="'+(isBuy?'pos':'neg')+'">'+esc(rw.transaction_type||'')+'</td>'
          + '<td class="num">'+(rw.shares!=null?Number(rw.shares).toLocaleString():'—')+'</td>'
          + '<td class="num">'+fmtBigUSD(rw.value)+'</td></tr>';
      }).join('')
      + '</tbody></table></div></div>';
  }

  async function loadAnalysts(ticker) {
    const since = new Date(Date.now()-90*86400000).toISOString().slice(0,10);
    const r = await sb.from('analyst_ratings').select('*').eq('ticker',ticker).gte('published_date',since)
      .order('published_date',{ascending:false}).limit(15);
    const data = r.data;
    if (!data || !data.length) {
      $('sec-analysts').innerHTML = '<div class="banner-card"><div class="banner-head"><h2>Analyst ratings</h2><span class="banner-meta">90d</span></div><div class="banner-body"><div class="empty">No analyst actions in last 90d.</div></div></div>';
      return;
    }
    $('sec-analysts').innerHTML = '<div class="banner-card"><div class="banner-head"><h2>Analyst ratings</h2><span class="banner-meta">Last 90d · '+data.length+' actions</span></div>'
      + '<div class="banner-body" style="max-height:340px;overflow:auto"><table><thead><tr><th>Date</th><th>Firm</th><th>Action</th><th>Rating</th><th style="text-align:right">PT</th></tr></thead><tbody>'
      + data.map(rw => '<tr><td>'+esc(rw.published_date||'')+'</td><td>'+esc(rw.firm||'')+'</td><td>'+esc(rw.action||'')+'</td><td>'+esc(rw.rating_current||rw.rating_prior||'')+'</td><td class="num">'+(rw.price_target_current!=null?'$'+fmt2(rw.price_target_current):'')+'</td></tr>').join('')
      + '</tbody></table></div></div>';
  }

  async function loadPriceTargets(ticker) {
    const r = await sb.from('analyst_price_targets').select('*').eq('ticker',ticker)
      .order('as_of_date',{ascending:false}).limit(1).maybeSingle();
    const data = r.data;
    if (!data) { $('sec-targets').innerHTML=''; return; }
    $('sec-targets').innerHTML = '<div class="banner-card"><div class="banner-head"><h2>Analyst price targets</h2><span class="banner-meta">'+(data.analyst_count||0)+' analysts</span></div>'
      + '<div class="banner-body"><div class="grid-4">'
      + '<div class="metric-box"><div class="l">High</div><div class="v pos">'+(data.target_high!=null?'$'+fmt2(data.target_high):'—')+'</div></div>'
      + '<div class="metric-box"><div class="l">Consensus</div><div class="v">'+(data.target_consensus!=null?'$'+fmt2(data.target_consensus):'—')+'</div></div>'
      + '<div class="metric-box"><div class="l">Median</div><div class="v">'+(data.target_median!=null?'$'+fmt2(data.target_median):'—')+'</div></div>'
      + '<div class="metric-box"><div class="l">Low</div><div class="v neg">'+(data.target_low!=null?'$'+fmt2(data.target_low):'—')+'</div></div>'
      + '</div></div></div>';
  }

  async function loadNews(ticker) {
    const since = new Date(Date.now()-14*86400000).toISOString();
    // FIX: real columns are title, article_url, publisher_name
    const r = await sb.from('news_articles')
      .select('title, publisher_name, article_url, published_at')
      .eq('ticker',ticker).gte('published_at',since)
      .order('published_at',{ascending:false}).limit(12);
    const data = r.data;
    if (!data || !data.length) {
      $('sec-news').innerHTML = '<div class="banner-card"><div class="banner-head"><h2>Recent news</h2><span class="banner-meta">14d</span></div><div class="banner-body"><div class="empty">No news.</div></div></div>';
      return;
    }
    $('sec-news').innerHTML = '<div class="banner-card"><div class="banner-head"><h2>Recent news</h2><span class="banner-meta">14d · top 12</span></div>'
      + '<div class="banner-body" style="max-height:380px;overflow:auto">'
      + data.map(n => '<div class="news-item"><a class="headline" href="'+esc(n.article_url||'#')+'" target="_blank" rel="noopener">'+esc(n.title||'')+'</a><div class="src">'+esc(n.publisher_name||'')+' · '+esc((n.published_at||'').slice(0,10))+'</div></div>').join('')
      + '</div></div>';
  }

  async function loadCatalysts(ticker) {
    const today = new Date().toISOString().slice(0,10);
    const in30 = new Date(Date.now()+30*86400000).toISOString().slice(0,10);
    const r = await sb.from('catalysts').select('*').eq('ticker',ticker)
      .gte('catalyst_date',today).lte('catalyst_date',in30)
      .order('catalyst_date',{ascending:true}).limit(20);
    const data = r.data;
    $('sec-catalysts').innerHTML = '<div class="banner-card"><div class="banner-head"><h2>Upcoming catalysts</h2><span class="banner-meta">Next 30d</span></div>'
      + '<div class="banner-body" style="max-height:380px;overflow:auto">'
      + ((!data||!data.length) ? '<div class="empty">No upcoming catalysts.</div>'
        : data.map(c => '<div class="news-item"><div class="headline">'+esc(c.catalyst_type||'')+' — '+esc(c.description||'')+'</div><div class="src">'+esc(c.catalyst_date||'')+(c.importance?' · importance '+esc(c.importance):'')+'</div></div>').join(''))
      + '</div></div>';
  }

  async function loadFundamentals(ticker) {
    const r = await sb.from('company_fundamentals')
      .select('as_of_date, ev_ebitda_ltm, pe_ltm, fcf_yield_ltm, ev_revenue_ntm, rev_growth_1y, gross_margin, ebitda_margin, fcf_margin, net_debt_ebitda')
      .eq('ticker',ticker).order('as_of_date',{ascending:false}).limit(5);
    const data = r.data;
    if (!data || !data.length) {
      $('sec-fund').innerHTML = '<div class="banner-card"><div class="banner-head"><h2>Fundamentals history</h2></div><div class="banner-body"><div class="empty">No fundamentals.</div></div></div>';
      return;
    }
    $('sec-fund').innerHTML = '<div class="banner-card"><div class="banner-head"><h2>Fundamentals history</h2><span class="banner-meta">Last '+data.length+' FY</span></div>'
      + '<div class="banner-body" style="overflow-x:auto"><table><thead><tr><th>As of</th><th style="text-align:right">P/E</th><th style="text-align:right">EV/EBITDA</th><th style="text-align:right">EV/Rev NTM</th><th style="text-align:right">FCF yld</th><th style="text-align:right">Rev gr 1y</th><th style="text-align:right">GM</th><th style="text-align:right">EBITDA m</th><th style="text-align:right">FCF m</th><th style="text-align:right">ND/EBITDA</th></tr></thead><tbody>'
      + data.map(rw => '<tr><td>'+esc(rw.as_of_date||'')+'</td>'
        + '<td class="num">'+(rw.pe_ltm!=null?fmt2(rw.pe_ltm):'—')+'</td>'
        + '<td class="num">'+(rw.ev_ebitda_ltm!=null?fmt2(rw.ev_ebitda_ltm):'—')+'</td>'
        + '<td class="num">'+(rw.ev_revenue_ntm!=null?fmt2(rw.ev_revenue_ntm):'—')+'</td>'
        + '<td class="num">'+(rw.fcf_yield_ltm!=null?fmtPct(rw.fcf_yield_ltm):'—')+'</td>'
        + '<td class="num">'+(rw.rev_growth_1y!=null?fmtPct(rw.rev_growth_1y):'—')+'</td>'
        + '<td class="num">'+(rw.gross_margin!=null?fmtPct(rw.gross_margin):'—')+'</td>'
        + '<td class="num">'+(rw.ebitda_margin!=null?fmtPct(rw.ebitda_margin):'—')+'</td>'
        + '<td class="num">'+(rw.fcf_margin!=null?fmtPct(rw.fcf_margin):'—')+'</td>'
        + '<td class="num">'+(rw.net_debt_ebitda!=null?fmt2(rw.net_debt_ebitda):'—')+'</td>'
        + '</tr>').join('')
      + '</tbody></table></div></div>';
  }

  async function loadNotes(ticker) {
    const r = await sb.from('ticker_notes')
      .select('*').eq('user_id',currentUser.id).eq('ticker',ticker)
      .order('pinned',{ascending:false}).order('created_at',{ascending:false}).limit(50);
    const data = r.data;
    $('sec-notes').innerHTML = '<div class="banner-card"><div class="banner-head"><h2>Notes</h2><span class="banner-meta">'+(data?data.length:0)+' note(s)</span></div>'
      + '<div class="banner-body">'
      + '<div style="display:flex;gap:8px;margin-bottom:14px;align-items:flex-start">'
      + '<textarea id="note-text" style="flex:1;background:var(--bg);border:1px solid var(--border);padding:9px 12px;border-radius:3px;min-height:60px;font-size:13px;font-family:var(--sans)" placeholder="Add a note for '+esc(ticker)+'…"></textarea>'
      + '<button class="btn btn-primary" id="add-note-btn">Add note</button></div>'
      + '<div id="notes-list">'
      + ((!data||!data.length) ? '<div class="empty">No notes yet.</div>'
        : data.map(n => '<div class="note-item '+(n.pinned?'pinned':'')+'">'
            + '<div><div class="txt">'+esc(n.note_text||'')+'</div>'
            + '<div class="meta">'+esc((n.created_at||'').slice(0,16).replace('T',' '))+(n.pinned?' · pinned':'')+'</div></div>'
            + '<div><button class="btn btn-sm btn-ghost" data-note-del="'+esc(n.id)+'">Delete</button></div></div>').join(''))
      + '</div></div></div>';

    $('add-note-btn').addEventListener('click', async () => {
      const text = ($('note-text').value||'').trim();
      if (!text) return;
      const ins = await sb.from('ticker_notes').insert({ user_id: currentUser.id, ticker, note_text: text, pinned: false });
      if (ins.error) flash('Failed: '+ins.error.message,'error');
      else { $('note-text').value=''; loadNotes(ticker); }
    });
    $('notes-list').querySelectorAll('button[data-note-del]').forEach(b => {
      b.addEventListener('click', async () => {
        if (!confirm('Delete this note?')) return;
        await sb.from('ticker_notes').delete().eq('id', b.dataset.noteDel);
        loadNotes(ticker);
      });
    });
  }
})();
</script>
</body>
</html>
