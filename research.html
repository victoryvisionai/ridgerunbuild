<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Research · Ridge Run</title>
<script>(function(){try{var t=localStorage.getItem('RR_THEME')||'editorial';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/themes.css" />
<style>
  :root{
    --bg:#fff;--bg-tint:#f8fafc;--bg-blue:#eff6ff;--border:#e2e8f0;--border-blue:#bfdbfe;
    --text:#0f172a;--text-muted:#475569;--text-dim:#94a3b8;
    --accent:#2563eb;--accent-dark:#1e40af;
    --success:#059669;--success-bg:#d1fae5;--warning:#d97706;--warning-bg:#fed7aa;
    --danger:#dc2626;--danger-bg:#fee2e2;
    --serif:'Source Serif 4',Georgia,serif;--sans:'Inter',-apple-system,sans-serif;--mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:var(--bg-tint);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;min-height:100vh}
  .hidden{display:none!important}
  .loading{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--mono);font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-dim)}
  .shell{max-width:1320px;margin:0 auto;padding:0 24px 80px}

  .ticker-bar{display:flex;align-items:center;gap:12px;margin:20px 0 18px;flex-wrap:wrap}
  .ticker-input{font-family:var(--mono);font-size:16px;font-weight:500;background:var(--bg);border:1px solid var(--border);padding:10px 14px;border-radius:4px;width:200px;color:var(--text);text-transform:uppercase;letter-spacing:0.05em}
  .ticker-input:focus{outline:none;border-color:var(--accent)}
  .btn{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;padding:9px 14px;border-radius:4px;cursor:pointer;border:1px solid transparent;font-weight:500;transition:all .15s}
  .btn-primary{background:var(--accent);color:#fff} .btn-primary:hover{background:var(--accent-dark)} .btn-primary:disabled{opacity:.5;cursor:wait}
  .btn-ghost{background:var(--bg);color:var(--text-muted);border-color:var(--border)} .btn-ghost:hover{border-color:var(--text-dim);color:var(--text)}
  .btn-sm{font-size:10px;padding:5px 9px}

  .banner-card{background:var(--bg);border:1px solid var(--border);border-radius:6px;margin-bottom:18px;overflow:hidden}
  .banner-head{background:#0f172a;color:#f1f5f9;padding:13px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
  .banner-head h2{font-family:var(--serif);font-size:17px;font-weight:500;margin:0;color:#f1f5f9;letter-spacing:-0.01em}
  .banner-meta{font-family:var(--mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#94a3b8}
  .banner-body{padding:20px 22px}
  .h2-sub{color:var(--text-muted);font-size:13px;margin:0 0 14px;line-height:1.55}

  .header-grid{display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:start}
  .company-block .name{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:-0.02em;margin-bottom:4px}
  .company-block .sub{font-family:var(--mono);font-size:11px;color:var(--text-muted);letter-spacing:0.06em;margin-bottom:14px;text-transform:uppercase}
  .company-block .desc{font-size:13.5px;color:var(--text-muted);line-height:1.6;margin:0}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

  .metric-box{padding:13px 14px;background:var(--bg-tint);border:1px solid var(--border);border-radius:4px;display:flex;flex-direction:column}
  .metric-box .l{font-family:var(--mono);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}
  .metric-box .v{font-family:var(--serif);font-size:20px;font-weight:500;letter-spacing:-0.01em;color:var(--text)}
  .metric-box .v.pos{color:var(--success)} .metric-box .v.neg{color:var(--danger)}
  .metric-box .sub{font-family:var(--mono);font-size:10px;color:var(--text-dim);margin-top:3px}
  .metric-box.cheap{border-color:#a7f3d0;background:#ecfdf5}
  .metric-box.rich{border-color:#fcd34d;background:#fffbeb}
  .metric-box.neutral{border-color:var(--border-blue);background:var(--bg-blue)}

  /* Regime badges */
  .badge{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:4px 10px;border-radius:3px;border:1px solid var(--border);background:var(--bg-tint);color:var(--text-muted);margin-right:6px}
  .badge.cheap{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
  .badge.rich{background:#fffbeb;border-color:#fcd34d;color:#92400e}
  .badge.lean-buy{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}
  .badge.lean-sell{background:#fef3c7;border-color:#fcd34d;color:#92400e}
  .badge.neutral{background:#f1f5f9;border-color:#cbd5e1;color:#334155}
  .badge.bad{background:var(--danger-bg);border-color:#fecaca;color:#991b1b}
  .badge.contango{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}
  .badge.backwardation{background:#fef3c7;border-color:#fcd34d;color:#92400e}
  .badge.flat{background:#f1f5f9;border-color:#cbd5e1;color:#334155}

  /* Strategy cards */
  .strat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  .strat-card{background:var(--bg);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:4px;padding:14px 16px}
  .strat-card.sell{border-left-color:var(--warning)}
  .strat-card .strat-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .strat-card .strat-name{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--text)}
  .strat-card .strat-score{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:600}
  .strat-card .strat-side{font-family:var(--mono);font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px}
  .strat-card .strat-rat{font-size:12.5px;color:var(--text);line-height:1.55;margin-bottom:8px}
  .strat-card .strat-when{font-size:11.5px;color:var(--text-muted);line-height:1.5;margin-bottom:4px}
  .strat-card .strat-when b{color:var(--text);font-weight:600}
  .strat-card .strat-flag{font-size:11.5px;color:var(--danger);line-height:1.5;margin-bottom:8px}
  .strat-card .strat-actions{margin-top:8px}

  /* Tables */
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);padding:8px 8px;border-bottom:1px solid var(--border);background:var(--bg-tint);position:sticky;top:0;z-index:1}
  td{padding:7px 8px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:11.5px;color:var(--text)}
  td.num{text-align:right} td.pos{color:var(--success)} td.neg{color:var(--danger)}
  td.itm{background:#fef3c7}
  tr.atm td{background:#eff6ff;font-weight:600}
  tr:hover td{background:var(--bg-blue)}

  /* Options chain wrapper */
  .chain-wrap{max-height:520px;overflow:auto;border:1px solid var(--border);border-radius:4px}
  .chain-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .chain-controls select, .chain-controls input{font-family:var(--mono);font-size:11px;background:var(--bg);border:1px solid var(--border);padding:6px 10px;border-radius:3px;color:var(--text)}
  .chain-controls label{font-family:var(--mono);font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-muted)}

  .term-sparkline{display:flex;align-items:flex-end;gap:14px;height:80px;padding:8px 0}
  .term-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
  .term-bar .b{width:100%;background:linear-gradient(to top,var(--accent),#60a5fa);border-radius:2px 2px 0 0;min-height:4px;position:relative}
  .term-bar .l{font-family:var(--mono);font-size:9px;color:var(--text-muted);letter-spacing:0.1em;text-transform:uppercase}
  .term-bar .v{font-family:var(--mono);font-size:11px;color:var(--text);font-weight:600}

  .news-item{padding:10px 0;border-bottom:1px solid var(--border)}
  .news-item:last-child{border-bottom:none}
  .news-item .headline{font-size:13.5px;color:var(--text);text-decoration:none;line-height:1.4;display:block;margin-bottom:3px}
  .news-item .headline:hover{color:var(--accent)}
  .news-item .src{font-family:var(--mono);font-size:10px;color:var(--text-dim);letter-spacing:0.08em;text-transform:uppercase}

  .note-item{padding:10px 12px;background:var(--bg-tint);border:1px solid var(--border);border-radius:4px;margin-bottom:8px;display:flex;justify-content:space-between;gap:12px}
  .note-item.pinned{border-left:3px solid var(--accent)}
  .note-item .txt{flex:1;font-size:13px;line-height:1.5;white-space:pre-wrap}
  .note-item .meta{font-family:var(--mono);font-size:10px;color:var(--text-dim);margin-top:4px}

  .field-mini label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px}
  .field-mini input, .field-mini select, .field-mini textarea{width:100%;background:var(--bg);border:1px solid var(--border);padding:8px 10px;font-family:var(--mono);font-size:12px;color:var(--text);border-radius:3px}
  .field-mini textarea{font-family:var(--sans);min-height:80px;resize:vertical}

  .empty{padding:24px;text-align:center;color:var(--text-muted);font-size:13px;font-style:italic}
  .msg{padding:10px 14px;font-size:13px;border-radius:4px;line-height:1.5;margin:8px 0}
  .msg-error{background:var(--danger-bg);border:1px solid #fecaca;color:#991b1b}
  .msg-info{background:var(--bg-blue);border:1px solid var(--border-blue);color:var(--accent-dark)}
  .msg-success{background:var(--success-bg);border:1px solid #a7f3d0;color:#065f46}

  @media (max-width:980px){
    .header-grid{grid-template-columns:1fr}
    .grid-4{grid-template-columns:repeat(2,1fr)}
    .grid-3{grid-template-columns:1fr}
    .strat-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div id="loading-screen" class="loading">Loading research…</div>

<div id="app" class="shell hidden">
  <div id="rr-nav-container"></div>

  <div class="ticker-bar">
    <input type="text" id="ticker-input" class="ticker-input" placeholder="Ticker" maxlength="8" autocomplete="off">
    <button class="btn btn-primary" id="load-btn">Load</button>
    <button class="btn btn-ghost" id="refresh-btn" title="Re-fire data webhooks">Refresh data</button>
    <span class="banner-meta" id="ticker-status"></span>
  </div>

  <div id="msg-area"></div>
  <div id="content"></div>
</div>

<script src="/nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script>
(() => {
  const N8N = 'https://victoryvision.app.n8n.cloud';
  const cfg = window.RR_CONFIG || {};
  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_PUBLISHABLE_KEY);
  let currentUser = null;
  let currentTicker = null;
  let currentSpot = null;

  const $ = id => document.getElementById(id);
  const show = (id, on=true) => $(id).classList.toggle('hidden', !on);
  const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt0 = n => (n==null||isNaN(n))?'—':Number(n).toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});
  const fmt2 = n => (n==null||isNaN(n))?'—':Number(n).toFixed(2);
  const fmt4 = n => (n==null||isNaN(n))?'—':Number(n).toFixed(4);
  const fmtPct = (n,d=1) => (n==null||isNaN(n))?'—':(Number(n)*100).toFixed(d)+'%';
  const fmtBigUSD = n => {
    if (n == null || isNaN(n)) return '—';
    const x = Number(n);
    if (x >= 1e12) return '$'+(x/1e12).toFixed(2)+'T';
    if (x >= 1e9) return '$'+(x/1e9).toFixed(2)+'B';
    if (x >= 1e6) return '$'+(x/1e6).toFixed(1)+'M';
    return '$'+x.toLocaleString();
  };
  const flash = (text, kind='info') => {
    $('msg-area').innerHTML = `<div class="msg msg-${esc(kind)}">${esc(text)}</div>`;
    if (kind !== 'error') setTimeout(()=>{ $('msg-area').innerHTML=''; }, 6000);
  };

  (async () => {
    const { data:{ session } } = await sb.auth.getSession();
    if (!session?.user) { window.location.href='/index.html'; return; }
    currentUser = session.user;
    show('loading-screen', false);
    show('app', true);
    try { if (window.RidgeRunNav) await window.RidgeRunNav.mount({active:'research', supabase:sb}); } catch(e){}

    const params = new URLSearchParams(location.search);
    const t = (params.get('ticker') || '').toUpperCase();
    if (t) {
      $('ticker-input').value = t;
      loadTicker(t);
    } else {
      $('content').innerHTML = '<div class="banner-card"><div class="banner-body"><div class="empty">Enter a ticker above to load research.</div></div></div>';
    }
  })();

  $('load-btn').addEventListener('click', () => {
    const t = ($('ticker-input').value||'').trim().toUpperCase();
    if (t) {
      history.replaceState(null,'','?ticker='+encodeURIComponent(t));
      loadTicker(t);
    }
  });
  $('ticker-input').addEventListener('keydown', e => { if (e.key==='Enter') $('load-btn').click(); });
  $('refresh-btn').addEventListener('click', () => {
    if (currentTicker) fireBootstrap(currentTicker, true);
  });

  async function loadTicker(ticker) {
    currentTicker = ticker;
    $('ticker-status').textContent = 'Loading…';
    $('content').innerHTML = '<div class="banner-card"><div class="banner-body"><div class="empty">Loading data for ' + esc(ticker) + '…</div></div></div>';

    // Check if bootstrap needed
    await maybeBootstrap(ticker);

    // Render skeleton
    $('content').innerHTML = renderSkeleton();

    // Parallel-load every section
    await Promise.allSettled([
      loadHeader(ticker),
      loadThesis(ticker),
      loadStrategies(ticker),
      loadOptionsChain(ticker),
      loadTermStructure(ticker),
      loadInsider(ticker),
      loadAnalysts(ticker),
      loadPriceTargets(ticker),
      loadNews(ticker),
      loadCatalysts(ticker),
      loadFundamentals(ticker),
      loadNotes(ticker)
    ]);
    $('ticker-status').textContent = 'Loaded ' + ticker;
  }

  async function maybeBootstrap(ticker) {
    try {
      const [{ count: c1 }, { count: c2 }, { count: c3 }, { count: c4 }] = await Promise.all([
        sb.from('vol_snapshots').select('ticker', { count:'exact', head:true }).eq('ticker', ticker),
        sb.from('insider_transactions').select('ticker', { count:'exact', head:true }).eq('ticker', ticker),
        sb.from('analyst_ratings').select('ticker', { count:'exact', head:true }).eq('ticker', ticker),
        sb.from('options_chain_snapshots').select('ticker', { count:'exact', head:true }).eq('ticker', ticker)
      ]);
      if ((c1||0)===0 && (c2||0)===0 && (c3||0)===0 && (c4||0)===0) {
        fireBootstrap(ticker, false);
      }
    } catch(e){}
  }

  function fireBootstrap(ticker, announce) {
    if (announce) flash('Re-firing data webhooks for ' + ticker + '. Data will populate within ~30s.', 'info');
    fetch(N8N + '/webhook/research/bootstrap', {
      method:'POST',
      headers:{'content-type':'application/json'},
      body: JSON.stringify({ ticker })
    }).catch(()=>{});
  }

  function renderSkeleton() {
    return `
      <div id="sec-header"></div>
      <div id="sec-thesis"></div>
      <div id="sec-regime"></div>
      <div id="sec-term"></div>
      <div id="sec-chain"></div>
      <div class="grid-2">
        <div id="sec-insider"></div>
        <div id="sec-analysts"></div>
      </div>
      <div id="sec-targets"></div>
      <div class="grid-2">
        <div id="sec-news"></div>
        <div id="sec-catalysts"></div>
      </div>
      <div id="sec-fund"></div>
      <div id="sec-notes"></div>
    `;
  }

  async function loadHeader(ticker) {
    const [{ data: prof }, { data: fund }, { data: vol }] = await Promise.all([
      sb.from('company_profile').select('*').eq('ticker', ticker).maybeSingle(),
      sb.from('company_fundamentals').select('*').eq('ticker', ticker).order('as_of_date',{ascending:false}).limit(1).maybeSingle(),
      sb.from('v_latest_vol_strategy').select('*').eq('ticker', ticker).maybeSingle()
    ]);

    if (vol?.spot) currentSpot = Number(vol.spot);

    const mcap = fund && currentSpot ? null : null; // mkt_cap may be in raw_data
    const ivR = vol?.iv_rank_1y;
    const ivClass = ivR == null ? 'neutral' : (ivR < 25 ? 'cheap' : ivR > 75 ? 'rich' : 'neutral');
    const ivLabel = ivR == null ? '' : (ivR < 25 ? 'Cheap vol' : ivR > 75 ? 'Rich vol' : 'Moderate');

    $('sec-header').innerHTML = `
      <div class="banner-card">
        <div class="banner-head">
          <h2>${esc(ticker)}${prof?.company_name ? ' · '+esc(prof.company_name) : ''}</h2>
          <span class="banner-meta">${prof?.sector ? esc(prof.sector) : ''}${prof?.industry ? ' · '+esc(prof.industry) : ''}</span>
        </div>
        <div class="banner-body">
          <div class="header-grid">
            <div class="company-block">
              <div class="sub">${[
                prof?.ceo ? 'CEO ' + esc(prof.ceo) : null,
                prof?.employees ? Number(prof.employees).toLocaleString() + ' employees' : null,
                prof?.beta != null ? 'β ' + Number(prof.beta).toFixed(2) : null,
                prof?.next_earnings_date ? 'Next earnings ' + esc(prof.next_earnings_date) : null
              ].filter(Boolean).join(' · ')}</div>
              <p class="desc">${esc(prof?.description || 'No description available.').slice(0,640)}${(prof?.description||'').length>640?'…':''}</p>
            </div>
            <div class="grid-2" style="grid-template-columns:1fr 1fr">
              <div class="metric-box">
                <div class="l">Spot</div>
                <div class="v">${vol?.spot != null ? '$'+fmt2(vol.spot) : '—'}</div>
                <div class="sub">${vol?.as_of_date || ''}</div>
              </div>
              <div class="metric-box ${ivClass}">
                <div class="l">IV Rank 1y</div>
                <div class="v">${vol?.iv_rank_1y != null ? Math.round(vol.iv_rank_1y) : '—'}</div>
                <div class="sub">${ivLabel}</div>
              </div>
              <div class="metric-box">
                <div class="l">IV 30d</div>
                <div class="v">${vol?.iv_30d != null ? fmtPct(vol.iv_30d) : '—'}</div>
                <div class="sub">${vol?.hv_30d != null ? 'HV30 '+fmtPct(vol.hv_30d) : ''}</div>
              </div>
              <div class="metric-box">
                <div class="l">25Δ Skew</div>
                <div class="v">${vol?.skew_25d != null ? (vol.skew_25d*100).toFixed(1)+'pp' : '—'}</div>
                <div class="sub">${vol?.skew_signal || ''}</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  async function loadThesis(ticker) {
    const { data } = await sb.from('thesis_models')
      .select('*').eq('user_id', currentUser.id).eq('ticker', ticker).eq('is_active', true)
      .order('updated_at',{ascending:false}).limit(1).maybeSingle();
    if (!data) {
      $('sec-thesis').innerHTML = `
        <div class="banner-card">
          <div class="banner-head"><h2>Thesis model</h2>
            <span class="banner-meta"><a class="btn btn-sm btn-ghost" style="text-decoration:none" href="/model.html?ticker=${esc(ticker)}">Build model →</a></span>
          </div>
          <div class="banner-body"><div class="empty">No active thesis model for ${esc(ticker)}.</div></div>
        </div>`;
      return;
    }
    const c = data.computed || {};
    $('sec-thesis').innerHTML = `
      <div class="banner-card">
        <div class="banner-head">
          <h2>Thesis model · ${esc(data.scenario_label || 'base')}</h2>
          <span class="banner-meta"><a class="btn btn-sm btn-ghost" style="text-decoration:none" href="/model.html?ticker=${esc(ticker)}">Open model →</a></span>
        </div>
        <div class="banner-body">
          <div class="grid-4">
            <div class="metric-box"><div class="l">Base price</div><div class="v">${data.base_price != null ? '$'+fmt2(data.base_price) : '—'}</div></div>
            <div class="metric-box"><div class="l">Implied terminal</div><div class="v">${c.implied_price_terminal != null ? '$'+fmt2(c.implied_price_terminal) : '—'}</div></div>
            <div class="metric-box"><div class="l">Annualized</div><div class="v ${c.annualized_return>0?'pos':'neg'}">${c.annualized_return != null ? fmtPct(c.annualized_return) : '—'}</div></div>

  function badgeFor(kind, val) {
    if (!val) return '';
    const lbl = String(val).replace(/_/g,' ');
    let cls = 'neutral';
    if (kind === 'vol') {
      if (val.includes('cheap')) cls='cheap';
      else if (val.includes('rich')) cls='rich';
      else if (val.includes('lean_buy')) cls='lean-buy';
      else if (val.includes('lean_sell')) cls='lean-sell';
    } else if (kind === 'term') {
      if (val === 'contango') cls='contango';
      else if (val === 'backwardation') cls='backwardation';
      else cls='flat';
    } else if (kind === 'skew') {
      if (val.includes('put')) cls='lean-sell';
      else if (val.includes('call')) cls='lean-buy';
    }
    return `<span class="badge ${cls}">${esc(lbl)}</span>`;
  }

  async function useStrategy(ticker, stratName, side) {
    const oppType = inferOppType(stratName);
    const structure = stratName.toLowerCase().replace(/ /g,'_');
    const direction = side === 'buy' ? 'long' : 'short';
    const { error } = await sb.from('trade_ideas').insert({
      user_id: currentUser.id,
      ticker,
      opportunity_type: oppType,
      direction,
      proposed_structure: structure,
      thesis: 'Seeded from research.html strategy selector: ' + stratName,
      status: 'idea',
      source: 'research_strategy_button',
      conviction: 3
    });
    if (error) flash('Failed to save: ' + error.message, 'error');
    else flash('Saved as trade idea: ' + stratName + ' on ' + ticker + '. Open Strategy page to flesh out.', 'success');
  }

  function inferOppType(s) {
    s = s.toLowerCase();
    if (s.includes('leap')) return 'asymmetric_leap';
    if (s.includes('straddle') || s.includes('strangle')) return 'earnings_play';
    if (s.includes('iron condor') || s.includes('covered call') || s.includes('cash-secured')) return 'short_thesis';
    if (s.includes('calendar')) return 'pair_trade';
    return 'asymmetric_leap';
  }

  async function loadOptionsChain(ticker) {
    const fiveDaysAgo = new Date(Date.now()-5*86400000).toISOString().slice(0,10);
    const { data, error } = await sb.from('options_chain_snapshots')
      .select('expiry, strike, side, bid, ask, last, volume, open_interest, iv, delta, gamma, theta, vega, underlying_price, as_of_date')
      .eq('ticker', ticker)
      .gte('as_of_date', fiveDaysAgo)
      .order('expiry', { ascending: true })
      .order('strike', { ascending: true })
      .limit(2000);

    if (error || !data || !data.length) {
      $('sec-chain').innerHTML = `
        <div class="banner-card">
          <div class="banner-head"><h2>Options chain</h2><span class="banner-meta">Multi-strike · multi-expiry · bid/ask/IV/greeks/OI</span></div>
          <div class="banner-body"><div class="empty">No recent options chain for ${esc(ticker)}. ${error?'Error: '+esc(error.message):''}</div></div>
        </div>`;
      return;
    }

    // Use freshest snapshot
    const latestDate = data.reduce((m,r) => r.as_of_date > m ? r.as_of_date : m, '');
    const fresh = data.filter(r => r.as_of_date === latestDate);

    const spot = fresh[0]?.underlying_price || currentSpot;
    const expiries = [...new Set(fresh.map(r => r.expiry))].sort();

    $('sec-chain').innerHTML = `
      <div class="banner-card">
        <div class="banner-head"><h2>Options chain</h2>
          <span class="banner-meta">As of ${esc(latestDate)} · Spot $${fmt2(spot)} · ${fresh.length} contracts · ${expiries.length} expirations</span>
        </div>
        <div class="banner-body">
          <div class="chain-controls">
            <label>Expiry
              <select id="chain-expiry">
                <option value="">All (${expiries.length})</option>
                ${expiries.map(e => `<option value="${esc(e)}">${esc(e)}</option>`).join('')}
              </select>
            </label>
            <label>Side
              <select id="chain-side">
                <option value="">Both</option>
                <option value="call">Calls only</option>
                <option value="put">Puts only</option>
              </select>
            </label>
            <label>Strike window (% from spot)
              <select id="chain-pct">
                <option value="0.20" selected>±20%</option>
                <option value="0.10">±10%</option>
                <option value="0.30">±30%</option>
                <option value="1.0">All</option>
              </select>
            </label>
            <label>Min OI
              <input type="number" id="chain-min-oi" min="0" value="0" style="width:80px">
            </label>
          </div>
          <div class="chain-wrap">
            <table>
              <thead>
                <tr>
                  <th>Expiry</th><th>Strike</th><th>Side</th>
                  <th style="text-align:right">Bid</th><th style="text-align:right">Ask</th><th style="text-align:right">Last</th>
                  <th style="text-align:right">IV</th>
                  <th style="text-align:right">Δ</th><th style="text-align:right">Γ</th><th style="text-align:right">Θ</th><th style="text-align:right">ν</th>
                  <th style="text-align:right">OI</th><th style="text-align:right">Vol</th>
                </tr>
              </thead>
              <tbody id="chain-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    `;

    const render = () => {
      const exp = $('chain-expiry').value;
      const side = $('chain-side').value;
      const pct = parseFloat($('chain-pct').value);
      const minOI = parseInt($('chain-min-oi').value||'0', 10);
      const lo = spot ? spot*(1-pct) : 0;
      const hi = spot ? spot*(1+pct) : Infinity;
      let rows = fresh.filter(r => {
        if (exp && r.expiry !== exp) return false;
        if (side && r.side !== side) return false;
        if (pct < 1 && spot && (r.strike < lo || r.strike > hi)) return false;
        if (minOI > 0 && (r.open_interest||0) < minOI) return false;
        return true;
      });
      if (!rows.length) {
        $('chain-tbody').innerHTML = '<tr><td colspan="13" class="empty">No contracts match filters.</td></tr>';
        return;
      }
      // Find ATM strike per expiry
      const atmByExp = {};
      const grouped = {};
      rows.forEach(r => {
        grouped[r.expiry] = grouped[r.expiry] || [];
        grouped[r.expiry].push(r);
      });
      Object.keys(grouped).forEach(e => {
        const strikes = [...new Set(grouped[e].map(r=>r.strike))];
        if (spot && strikes.length) {
          atmByExp[e] = strikes.reduce((a,b) => Math.abs(b-spot) < Math.abs(a-spot) ? b : a);
        }
      });
      $('chain-tbody').innerHTML = rows.map(r => {
        const isATM = spot && r.strike === atmByExp[r.expiry];
        const itm = (r.side==='call' && spot && r.strike < spot) || (r.side==='put' && spot && r.strike > spot);
        return `
        <tr class="${isATM?'atm':''}">
          <td>${esc(r.expiry)}</td>
          <td class="num ${itm?'itm':''}"><b>${fmt2(r.strike)}</b></td>
          <td>${esc(r.side||'')}</td>
          <td class="num">${r.bid!=null?fmt2(r.bid):'—'}</td>
          <td class="num">${r.ask!=null?fmt2(r.ask):'—'}</td>
          <td class="num">${r.last!=null?fmt2(r.last):'—'}</td>
          <td class="num">${r.iv!=null?(r.iv*100).toFixed(1)+'%':'—'}</td>
          <td class="num">${r.delta!=null?fmt2(r.delta):'—'}</td>
          <td class="num">${r.gamma!=null?fmt4(r.gamma):'—'}</td>
          <td class="num">${r.theta!=null?fmt2(r.theta):'—'}</td>
          <td class="num">${r.vega!=null?fmt2(r.vega):'—'}</td>
          <td class="num">${r.open_interest!=null?Number(r.open_interest).toLocaleString():'—'}</td>
          <td class="num">${r.volume!=null?Number(r.volume).toLocaleString():'—'}</td>
        </tr>`;
      }).join('');
    };

    $('chain-expiry').addEventListener('change', render);
    $('chain-side').addEventListener('change', render);
    $('chain-pct').addEventListener('change', render);
    $('chain-min-oi').addEventListener('input', render);
    render();
  }

  async function loadTermStructure(ticker) {
    const { data } = await sb.from('v_latest_vol_strategy').select('*').eq('ticker', ticker).maybeSingle();
    if (!data) { $('sec-term').innerHTML=''; return; }
    const pts = [
      { l:'30d', v: data.iv_30d },
      { l:'90d', v: data.iv_90d },
      { l:'180d', v: data.iv_180d },
      { l:'365d', v: data.iv_365d }
    ].filter(p => p.v != null);
    if (!pts.length) { $('sec-term').innerHTML=''; return; }
    const max = Math.max(...pts.map(p=>p.v));
    const slope = (data.iv_365d != null && data.iv_30d != null)
      ? ((data.iv_365d - data.iv_30d) / data.iv_30d) : null;
    const slopeLabel = slope == null ? '' : (slope > 0.05 ? 'Contango (back richer)' : slope < -0.05 ? 'Backwardation (front richer)' : 'Flat term');

    $('sec-term').innerHTML = `
      <div class="banner-card">
        <div class="banner-head"><h2>IV term structure</h2><span class="banner-meta">${esc(slopeLabel)}${slope!=null?' · slope '+(slope*100).toFixed(1)+'%':''}</span></div>
        <div class="banner-body">
          <div class="term-sparkline">
            ${pts.map(p => `
              <div class="term-bar">
                <div class="v">${fmtPct(p.v)}</div>
                <div class="b" style="height:${(p.v/max*72).toFixed(1)}px"></div>
                <div class="l">${p.l}</div>
              </div>`).join('')}
          </div>
        </div>
      </div>
    `;
  }

                <td class="num">${r.fcf_yield_ltm!=null?fmtPct(r.fcf_yield_ltm):'—'}</td>
                <td class="num">${r.rev_growth_1y!=null?fmtPct(r.rev_growth_1y):'—'}</td>
                <td class="num">${r.gross_margin!=null?fmtPct(r.gross_margin):'—'}</td>
                <td class="num">${r.ebitda_margin!=null?fmtPct(r.ebitda_margin):'—'}</td>
                <td class="num">${r.fcf_margin!=null?fmtPct(r.fcf_margin):'—'}</td>
                <td class="num">${r.net_debt_ebitda!=null?fmt2(r.net_debt_ebitda):'—'}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  async function loadNotes(ticker) {
    const { data } = await sb.from('ticker_notes')
      .select('*').eq('user_id', currentUser.id).eq('ticker', ticker)
      .order('pinned',{ascending:false}).order('created_at',{ascending:false}).limit(50);
    $('sec-notes').innerHTML = `
      <div class="banner-card">
        <div class="banner-head"><h2>Notes</h2><span class="banner-meta">${data?data.length:0} note(s)</span></div>
        <div class="banner-body">
          <div style="display:flex;gap:8px;margin-bottom:14px">
            <textarea id="note-text" class="ticker-input" style="flex:1;width:auto;font-family:var(--sans);text-transform:none;letter-spacing:0;min-height:60px;font-size:13px" placeholder="Add a note for ${esc(ticker)}…"></textarea>
            <button class="btn btn-primary" id="add-note-btn">Add note</button>
          </div>
          <div id="notes-list">
            ${(!data||!data.length) ? '<div class="empty">No notes yet.</div>' : data.map(n => `
              <div class="note-item ${n.pinned?'pinned':''}">
                <div>
                  <div class="txt">${esc(n.note_text||'')}</div>
                  <div class="meta">${esc((n.created_at||'').slice(0,16).replace('T',' '))}${n.pinned?' · pinned':''}</div>
                </div>
                <div>
                  <button class="btn btn-sm btn-ghost" data-note-del="${esc(n.id)}">Delete</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    `;

    $('add-note-btn').addEventListener('click', async () => {
      const text = ($('note-text').value||'').trim();
      if (!text) return;
      const { error } = await sb.from('ticker_notes').insert({
        user_id: currentUser.id, ticker, note_text: text, pinned: false
      });
      if (error) flash('Failed to save note: ' + error.message, 'error');
      else { $('note-text').value=''; loadNotes(ticker); }
    });
    $('notes-list').querySelectorAll('button[data-note-del]').forEach(b => {
      b.addEventListener('click', async () => {
        if (!confirm('Delete this note?')) return;
        await sb.from('ticker_notes').delete().eq('id', b.dataset.noteDel);
        loadNotes(ticker);
      });
    });
  }
})();
</script>
</body>
</html>
