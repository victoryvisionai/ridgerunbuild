<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Research — Ridge Run</title>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#fff;--ink:#0f172a;--ink2:#475569;--muted:#94a3b8;--line:#e2e8f0;--brand:#2563eb;--brand2:#1d4ed8;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--chip:#f1f5f9}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif}
  a{color:var(--brand);text-decoration:none}
  a:hover{text-decoration:underline}
  .layout{display:grid;grid-template-columns:280px 1fr;gap:14px;padding:14px;max-width:1700px;margin:0 auto}
  @media(max-width:1100px){.layout{grid-template-columns:1fr}}
  .panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
  .h1{font-size:18px;font-weight:700;margin:0 0 8px}
  .h2{font-size:13px;font-weight:700;color:var(--ink2);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em}
  .muted{color:var(--muted)}
  .row{display:flex;gap:8px;align-items:center}
  .pill{display:inline-block;background:var(--chip);color:var(--ink);padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
  .pill.ok{background:#dcfce7;color:#166534}
  .pill.bad{background:#fee2e2;color:#991b1b}
  .pill.brand{background:var(--brand);color:#fff}
  table.tbl{border-collapse:collapse;width:100%;font-size:12px;margin:6px 0}
  table.tbl th,table.tbl td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:right}
  table.tbl th:first-child,table.tbl td:first-child{text-align:left}
  table.tbl th{color:var(--ink2);font-weight:600;background:#f8fafc;position:sticky;top:0}
  .ok-txt{color:var(--ok);font-weight:600}
  .bad-txt{color:var(--bad);font-weight:600}
  .ticker-link{font-weight:700;color:var(--brand);cursor:pointer}
  .ticker-link:hover{text-decoration:underline}
  .wl-row{display:grid;grid-template-columns:48px 1fr auto;gap:6px;align-items:center;padding:8px 6px;border-radius:8px;cursor:pointer;border:1px solid transparent}
  .wl-row:hover{background:#f8fafc}
  .wl-row.active{background:#eef2ff;border-color:#c7d2fe}
  .wl-row b{font-size:13px}
  .wl-spark{height:24px;width:48px}
  .wl-perf{font-size:11px;text-align:right}
  .perf-strip{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .perf-strip .p{border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:78px}
  .perf-strip .p .l{font-size:10px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
  .perf-strip .p .v{font-size:14px;font-weight:700}
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin:8px 0}
  .kpi{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
  .kpi .l{font-size:10px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
  .kpi .v{font-size:14px;font-weight:700}
  .heatmap{display:grid;grid-template-columns:38px repeat(12,1fr);gap:2px;font-size:11px;margin:6px 0}
  .heatmap .hd{color:var(--ink2);text-align:center;padding:3px 0}
  .heatmap .yr{font-weight:600;text-align:right;padding:3px 4px;color:var(--ink2)}
  .heatmap .cell{padding:4px 2px;text-align:center;border-radius:3px;color:#1e293b}
  .news-item{padding:6px 0;border-bottom:1px solid var(--line)}
  .news-item:last-child{border:0}
  .news-item .ttl{font-weight:600;color:var(--ink)}
  .news-item .meta{font-size:11px;color:var(--muted)}
  .empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:8px;font-size:12px}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn:hover{filter:brightness(.98)}
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:50}
  .modal.show{display:flex}
  .modal .inner{background:#fff;border-radius:12px;max-width:900px;width:94%;max-height:84vh;overflow:auto;padding:18px;border:1px solid var(--line)}
  .modal .close{float:right;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
  .section-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:900px){.section-grid{grid-template-columns:1fr}}
  .lookup{display:flex;gap:6px;margin-bottom:8px}
  .lookup input{flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;text-transform:uppercase}
  .insider-row{cursor:pointer}
  .insider-row:hover{background:#f8fafc}
</style>
</head>
<body>
  <nav style="display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid #e5e7eb;background:#fafafa;font:14px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;align-items:center;position:sticky;top:0;z-index:50">
  <strong style="margin-right:12px">Ridge Run</strong>
  <a href="/strategy.html" style="padding:6px 12px;border-radius:6px;text-decoration:none;color:#111;background:#fff;border:1px solid #e5e7eb">Strategy</a>
  <a href="/research.html" style="padding:6px 12px;border-radius:6px;text-decoration:none;color:#111;background:#fff;border:1px solid #e5e7eb">Research</a>
  <a href="/screener.html" style="padding:6px 12px;border-radius:6px;text-decoration:none;color:#111;background:#fff;border:1px solid #e5e7eb">Screener</a>
  <a href="/model.html" style="padding:6px 12px;border-radius:6px;text-decoration:none;color:#111;background:#fff;border:1px solid #e5e7eb">Model</a>
  <a href="/portfolio.html" style="padding:6px 12px;border-radius:6px;text-decoration:none;color:#111;background:#fff;border:1px solid #e5e7eb">Portfolio</a>
  <a href="/watchlist.html" style="padding:6px 12px;border-radius:6px;text-decoration:none;color:#111;background:#fff;border:1px solid #e5e7eb">Watchlist</a>
  <a href="/dna.html" style="padding:6px 12px;border-radius:6px;text-decoration:none;color:#111;background:#fff;border:1px solid #e5e7eb">DNA</a>
</nav>
<div id="nav"></div>
<script src="/nav.js"></script>

<div class="layout">
  <!-- SIDEBAR: Watchlist sparklines -->
  <aside class="panel">
    <div class="h1">Watchlist</div>
    <div class="lookup">
      <input id="tickerLookup" placeholder="LOAD TICKER…" maxlength="10"/>
      <button class="btn primary" id="goLookup">Go</button>
    </div>
    <div id="wlList"><div class="empty">Loading…</div></div>
  </aside>

  <!-- MAIN -->
  <main>
    <section class="panel" id="main">
      <div class="empty">Pick a ticker from the watchlist or type one above.</div>
    </section>
  </main>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)hideModal()">
  <div class="inner" id="modalInner"></div>
</div>

<script>
(function(){
  if(!window.RR_CONFIG){alert("Missing RR_CONFIG (load /config.js first)");return;}
  const sb = window.supabase = supabase.createClient(window.RR_CONFIG.SUPABASE_URL, window.RR_CONFIG.SUPABASE_ANON_KEY);
  const USER_ID = window.RR_CONFIG.USER_ID || 'e048e890-8554-429e-883e-d9c5d03a3510';

  const $=(s,r=document)=>r.querySelector(s); const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
  function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
  function fmt(x,d=2){return (x==null||isNaN(x))?'—':Number(x).toFixed(d)}
  function fmtPct(x,d=1){return (x==null||isNaN(x))?'—':((x>=0?'+':'')+(x*100).toFixed(d)+'%')}
  function fmtMcap(x){if(x==null)return'—';if(x>=1e12)return '$'+(x/1e12).toFixed(2)+'T';if(x>=1e9)return '$'+(x/1e9).toFixed(1)+'B';if(x>=1e6)return '$'+(x/1e6).toFixed(0)+'M';return '$'+x}
  function fmtMoney(x){if(x==null||isNaN(x))return'—';const n=Number(x);if(Math.abs(n)>=1e9)return '$'+(n/1e9).toFixed(1)+'B';if(Math.abs(n)>=1e6)return '$'+(n/1e6).toFixed(1)+'M';if(Math.abs(n)>=1e3)return '$'+(n/1e3).toFixed(0)+'K';return '$'+n.toFixed(0)}
  function tickerLink(t){return `<span class="ticker-link" onclick="loadTicker('${esc(t)}')">${esc(t)}</span>`}
  function perfColor(p){if(p==null||isNaN(p))return'';return p>=0?'ok-txt':'bad-txt'}
  function showModal(html){$('#modalInner').innerHTML=`<button class="close" onclick="hideModal()">Close</button>`+html;$('#modal').classList.add('show')}
  function hideModal(){$('#modal').classList.remove('show')}
  window.hideModal=hideModal;

  // ---------- Sparkline SVG ----------
  function sparkSvg(series, w=48, h=24){
    if(!Array.isArray(series)||series.length<2) return '';
    const ys = series.map(p=>Number(p.c)).filter(n=>!isNaN(n));
    if(ys.length<2) return '';
    const min=Math.min(...ys), max=Math.max(...ys), rng=max-min||1;
    const step=w/(ys.length-1);
    const pts = ys.map((y,i)=>`${(i*step).toFixed(1)},${(h-((y-min)/rng)*h).toFixed(1)}`).join(' ');
    const up = ys[ys.length-1]>=ys[0];
    return `<svg class="wl-spark" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg"><polyline fill="none" stroke="${up?'#16a34a':'#dc2626'}" stroke-width="1.5" points="${pts}"/></svg>`;
  }

  // ---------- Heatmap ----------
  function heatCell(v){
    if(v==null||isNaN(v)) return `<div class="cell" style="background:#f1f5f9">—</div>`;
    const pct = v*100;
    const intensity = Math.min(1, Math.abs(pct)/15);
    const r = v>=0?22:220, g = v>=0?163:38, b = v>=0?74:38;
    const bg = `rgba(${r},${g},${b},${0.15+intensity*0.55})`;
    return `<div class="cell" style="background:${bg}">${(pct>=0?'+':'')+pct.toFixed(1)}</div>`;
  }
  function renderHeatmap(d){
  const ys = (d&&Array.isArray(d.years))?d.years:[];
  if(!ys.length) return `<div class="empty">No monthly return data (waiting on daily_bars seed)</div>`;
  const months=['J','F','M','A','M','J','J','A','S','O','N','D'];
  let html = `<div class="heatmap"><div class="hd"></div>${months.map(m=>`<div class="hd">${m}</div>`).join('')}`;
  for(const yr of ys){
    const lookup={}; (yr.months||[]).forEach(m=>{lookup[m.m]=m.ret});
    html += `<div class="yr">${yr.y}</div>`;
    for(let m=1;m<=12;m++) html += heatCell(lookup[m]);
  }
  // Average row at bottom (5y average per month — seasonality signal)
  const avg = Array.isArray(d.avg_by_month) ? d.avg_by_month : [];
  if(avg.length){
    const al={}; avg.forEach(m=>{al[m.m]=m.avg});
    html += `<div class="yr" style="border-top:2px solid #94a3b8;font-weight:700;color:#0f172a">AVG</div>`;
    for(let m=1;m<=12;m++){
      const v=al[m]; 
      if(v==null||isNaN(v)){ html += `<div class="cell" style="background:#f1f5f9;border-top:2px solid #94a3b8">—</div>`; }
      else {
        const pct=v*100, intensity=Math.min(1,Math.abs(pct)/15);
        const r=v>=0?22:220, g=v>=0?163:38, b=v>=0?74:38;
        const bg=`rgba(${r},${g},${b},${0.15+intensity*0.55})`;
        html += `<div class="cell" style="background:${bg};border-top:2px solid #94a3b8;font-weight:700">${(pct>=0?'+':'')+pct.toFixed(1)}</div>`;
      }
    }
  }
  html += `</div>`;
  return html;
}

  // ---------- Sidebar watchlist ----------
  async function loadWatchlistSidebar(){
    try{
      const {data,error} = await sb.rpc('get_watchlist_sparklines',{p_user:USER_ID});
      if(error) throw error;
      const arr = Array.isArray(data)?data:[];
      if(!arr.length){$('#wlList').innerHTML='<div class="empty">Empty watchlist</div>';return}
      $('#wlList').innerHTML = arr.map(r=>{
        const r1y=r.ret_1y;
        return `<div class="wl-row" data-ticker="${esc(r.ticker)}">
          <div>${sparkSvg(r.sparkline)}</div>
          <div><b>${esc(r.ticker)}</b><div class="muted" style="font-size:11px">$${fmt(r.price)}</div></div>
          <div class="wl-perf">
            <div class="${perfColor(r.ret_1d)}">${fmtPct(r.ret_1d)}</div>
            <div class="muted" style="font-size:10px">${fmtPct(r.ret_1y)} y</div>
          </div>
        </div>`;
      }).join('');
      $$('.wl-row').forEach(el=>el.addEventListener('click',()=>loadTicker(el.dataset.ticker)));
    }catch(e){console.error(e); $('#wlList').innerHTML='<div class="empty">Load failed</div>'}
  }

  // ---------- Main: load research page ----------
  let currentTicker=null;
  async function loadTicker(t){
    if(!t) return;
    t = String(t).toUpperCase().trim();
    currentTicker = t;
    $$('.wl-row').forEach(el=>el.classList.toggle('active', el.dataset.ticker===t));
    const url = new URL(window.location.href); url.searchParams.set('ticker',t); window.history.replaceState(null,'',url.toString());
    $('#main').innerHTML = `<div class="empty">Loading ${esc(t)}…</div>`;
    try{
      const {data,error} = await sb.rpc('get_research_page',{p_user:USER_ID, p_ticker:t});
      if(error) throw error;
      renderMain(t, data||{});
    }catch(e){
      console.error(e);
      $('#main').innerHTML = `<div class="empty">Failed: ${esc(e.message||e)}</div>`;
    }
  }
  window.loadTicker = loadTicker;

  function renderMain(t, payload){
    const d = payload.deepdive||{};
    const sparkline = payload.sparkline_self||[];
    const co = d.company||{};
    const f = d.fundamentals_latest||{};
    const v = d.vol_latest||{};
    const wlRow = (payload._wlPerf||{});

    const header = `
      <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:10px">
        <div>
          <div class="h1" style="margin-bottom:2px">${esc(t)} <span class="muted" style="font-weight:400;font-size:14px">${esc(co.name||'')}</span></div>
          <div class="muted" style="font-size:12px">${esc(co.sector||'')}${co.industry?' · '+esc(co.industry):''} · ${fmtMcap(co.market_cap)}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:22px;font-weight:700">$${fmt(co.price)}</div>
          <div class="muted" style="font-size:11px">52w: $${fmt(co.year_low)} – $${fmt(co.year_high)}</div>
        </div>
      </div>
      <div id="perfStrip"></div>`;

    const kpi = `<div class="kpi-grid">
      <div class="kpi"><div class="l">PE</div><div class="v">${fmt(co.pe||f.pe_ltm,1)}</div></div>
      <div class="kpi"><div class="l">EV/EBITDA</div><div class="v">${fmt(f.ev_ebitda_ntm||f.ev_ebitda_ltm,1)}</div></div>
      <div class="kpi"><div class="l">FCF Yield</div><div class="v">${fmtPct(f.fcf_yield_ntm||f.fcf_yield_ltm)}</div></div>
      <div class="kpi"><div class="l">Rev g 3y hist</div><div class="v">${fmtPct(f.rev_growth_3y_hist)}</div></div>
      <div class="kpi"><div class="l">Rev g 3y fwd</div><div class="v">${fmtPct(f.rev_growth_3y_fwd)}</div></div>
      <div class="kpi"><div class="l">Net debt/EBITDA</div><div class="v">${fmt(f.net_debt_ebitda,1)}</div></div>
      <div class="kpi"><div class="l">Gross margin</div><div class="v">${fmtPct(f.gross_margin)}</div></div>
      <div class="kpi"><div class="l">EBITDA margin</div><div class="v">${fmtPct(f.ebitda_margin)}</div></div>
      <div class="kpi"><div class="l">IV 30d</div><div class="v">${fmtPct(v.iv_30d)}</div></div>
      <div class="kpi"><div class="l">IV rank</div><div class="v">${fmt(v.iv_rank_1y,0)} ${v.vol_regime?`<span class="pill ${v.vol_regime==='cheap'?'ok':v.vol_regime==='rich'?'bad':''}">${esc(v.vol_regime)}</span>`:''}</div></div>
      <div class="kpi"><div class="l">% from high</div><div class="v ${perfColor(co.pct_from_high)}">${fmtPct(co.pct_from_high)}</div></div>
      <div class="kpi"><div class="l">% from low</div><div class="v ${perfColor(co.pct_from_low)}">${fmtPct(co.pct_from_low)}</div></div>
    </div>`;

    const annual = renderAnnual(d.annual_history||[]);
    const heatmap = `<div class="h2">Monthly returns (5y)</div>${renderHeatmap(d.monthly_returns_5y||{})}`;
    const comps = renderComps(d.top_comps||[]);
    const insider = renderInsider(d.insider_grouped_720d||[]);
    const news = renderNews(d.news||[]);
    const analyst = renderAnalyst(d.analyst_targets, d.analyst_ratings||[]);
    const holders = renderHolders(d.investor_holders||[]);
    const chainBtn = (d.options_chain&&d.options_chain.length) ? `<button class="btn primary" id="openChain">View options chain (${d.options_chain.length} contracts)</button>` : `<div class="empty">No chain data yet</div>`;
    const spreadSummary = renderSpreadSummary(d.spread_candidates||{});
    const notes = renderNotes(d.my_notes||[], d.thesis_model);

    $('#main').innerHTML = `
      ${header}
      <div class="h2">Snapshot</div>
      ${kpi}
      <div class="section-grid">
        <div>
          <div class="h2">5yr fundamentals</div>${annual}
          ${heatmap}
          <div class="h2">Top 5 comps</div>${comps}
        </div>
        <div>
          <div class="h2">Options</div>${chainBtn}${spreadSummary}
          <div class="h2">Analyst</div>${analyst}
          <div class="h2">13F holders</div>${holders}
          <div class="h2">My notes / thesis</div>${notes}
        </div>
      </div>
      <div class="section-grid">
        <div><div class="h2">Insider (720d, grouped)</div>${insider}</div>
        <div><div class="h2">News (180d)</div>${news}</div>
      </div>`;

    // Perf strip via watchlist data (already loaded) — fall back to deepdive's monthly avg or skip
    renderPerfStrip(t);
    const chainBtnEl = document.getElementById('openChain');
    if(chainBtnEl) chainBtnEl.addEventListener('click', ()=>openChainModal(d.options_chain||[], co.price));
    $$('.insider-row').forEach(el=>el.addEventListener('click', ()=>openInsiderModal(el.dataset.name, d.insider_grouped_720d||[])));
  }

  async function renderPerfStrip(t){
    try{
      const {data} = await sb.rpc('get_watchlist_sparklines',{p_user:USER_ID});
      const arr = Array.isArray(data)?data:[];
      const row = arr.find(r=>r.ticker===t);
      const strip = (row?
        ['ret_1d','ret_1w','ret_1m','ret_1y','ret_3y'].map((k,i)=>{
          const lbl=['1D','1W','1M','1Y','3Y'][i];
          const v=row[k];
          return `<div class="p"><div class="l">${lbl}</div><div class="v ${perfColor(v)}">${fmtPct(v)}</div></div>`;
        }).join('')
        :'<div class="muted" style="font-size:12px">Add to watchlist for daily perf strip (or run WF38 to seed daily_bars).</div>');
      const el = document.getElementById('perfStrip'); if(el) el.innerHTML = `<div class="perf-strip">${strip}</div>`;
    }catch(_){}
  }

  function renderAnnual(rows){
    if(!rows.length) return '<div class="empty">No annual history</div>';
    const slice = rows.slice(0,6);
    return `<table class="tbl"><thead><tr><th>Year</th><th>Rev</th><th>EBITDA</th><th>FCF</th><th>EPS</th><th>Net debt</th></tr></thead><tbody>${slice.map(r=>`<tr><td>${esc(r.year)}</td><td>${fmtMoney(r.revenue)}</td><td>${fmtMoney(r.ebitda)}</td><td>${fmtMoney(r.fcf)}</td><td>${fmt(r.eps,2)}</td><td>${fmtMoney(r.net_debt)}</td></tr>`).join('')}</tbody></table>`;
  }
  function renderComps(rows){
    if(!rows.length) return '<div class="empty">No comps</div>';
    return `<table class="tbl"><thead><tr><th>Ticker</th><th>MCap</th><th>PE</th><th>EV/EBITDA</th><th>FCF Yld</th><th>Rev g 3yh</th><th>Rev g 3yf</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${tickerLink(r.ticker)}<div class="muted" style="font-size:10px">${esc(r.name||'')}</div></td><td>${fmtMcap(r.market_cap)}</td><td>${fmt(r.pe,1)}</td><td>${fmt(r.ev_ebitda,1)}</td><td>${fmtPct(r.fcf_yield)}</td><td>${fmtPct(r.rev_growth_3y_hist)}</td><td>${fmtPct(r.rev_growth_3y_fwd)}</td></tr>`).join('')}</tbody></table>`;
  }
  function renderInsider(rows){
    if(!rows.length) return '<div class="empty">No insider activity (720d)</div>';
    return `<table class="tbl"><thead><tr><th>Insider</th><th>Title</th><th>Buys</th><th>Sells</th><th>Net $</th><th>Last</th></tr></thead><tbody>${rows.map(r=>`<tr class="insider-row" data-name="${esc(r.insider_name)}"><td>${esc(r.insider_name||'')}</td><td>${esc(r.insider_title||'')}</td><td>${r.n_buys||0}</td><td>${r.n_sells||0}</td><td class="${(r.net_value||0)>=0?'ok-txt':'bad-txt'}">${fmtMoney(r.net_value)}</td><td>${esc((r.last_date||'').slice(0,10))}</td></tr>`).join('')}</tbody></table>`;
  }
  function openInsiderModal(name, allRows){
    const r = allRows.find(x=>x.insider_name===name); if(!r) return;
    const tx = Array.isArray(r.transactions)?r.transactions:[];
    showModal(`<h3 style="margin:0 0 6px">${esc(name)} <span class="muted" style="font-weight:400;font-size:13px">${esc(r.insider_title||'')}</span></h3>
      <div class="muted" style="font-size:12px;margin-bottom:8px">${r.n_buys||0} buys · ${r.n_sells||0} sells · Net <b class="${(r.net_value||0)>=0?'ok-txt':'bad-txt'}">${fmtMoney(r.net_value)}</b></div>
      <table class="tbl"><thead><tr><th>Date</th><th>Type</th><th>Shares</th><th>Price</th><th>Value</th><th>After</th></tr></thead><tbody>${tx.map(x=>`<tr><td>${esc((x.date||'').slice(0,10))}</td><td>${esc(x.type||'')}</td><td>${fmt(x.shares,0)}</td><td>${fmt(x.price,2)}</td><td>${fmtMoney(x.value)}</td><td>${fmt(x.after,0)}</td></tr>`).join('')}</tbody></table>`);
  }
  function renderNews(rows){
    if(!rows.length) return '<div class="empty">No news (180d)</div>';
    return rows.slice(0,15).map(n=>`<div class="news-item"><div class="ttl"><a href="${esc(n.url||'#')}" target="_blank" rel="noopener">${esc(n.title||'')}</a></div><div class="meta">${esc((n.published||'').slice(0,16).replace('T',' '))}</div></div>`).join('');
  }
  function renderAnalyst(targets, ratings){
    let html='';
    if(targets){html += `<div class="kpi-grid"><div class="kpi"><div class="l">Consensus</div><div class="v">${fmt(targets.target_consensus)}</div></div><div class="kpi"><div class="l">High</div><div class="v">${fmt(targets.target_high)}</div></div><div class="kpi"><div class="l">Low</div><div class="v">${fmt(targets.target_low)}</div></div><div class="kpi"><div class="l">Analysts</div><div class="v">${esc(targets.analyst_count??'—')}</div></div></div>`;}
    if(ratings.length){html += `<table class="tbl"><thead><tr><th>Date</th><th>Firm</th><th>Action</th><th>Rating</th><th>PT</th></tr></thead><tbody>${ratings.slice(0,8).map(r=>`<tr><td>${esc((r.date||'').slice(0,10))}</td><td>${esc(r.firm||'')}</td><td>${esc(r.action||'')}</td><td>${esc(r.rating||'')}</td><td>${fmt(r.pt)}</td></tr>`).join('')}</tbody></table>`;}
    return html||'<div class="empty">No analyst data</div>';
  }
  function renderHolders(rows){
    if(!rows.length) return '<div class="empty">None of your tracked investors hold this</div>';
    return `<table class="tbl"><thead><tr><th>Investor</th><th>% of portfolio</th><th>Period</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.investor)}</td><td>${fmtPct(r.pct,2)}</td><td>${esc(r.period||'')}</td></tr>`).join('')}</tbody></table>`;
  }
  function renderNotes(notes, thesis){
    let html='';
    if(thesis){html += `<div class="kpi" style="margin-bottom:6px"><div class="l">Thesis (${esc(thesis.scenario_label||'')})</div><div style="font-size:12px">${esc(thesis.notes||'')}</div></div>`;}
    if(notes.length){html += notes.slice(0,8).map(n=>`<div class="news-item"><div>${esc(n.note)}</div><div class="meta">${esc((n.at||'').slice(0,10))}${n.pinned?' · 📌':''}</div></div>`).join('');}
    return html||'<div class="empty">No notes</div>';
  }
  function renderSpreadSummary(sc){
    if(!sc||sc.error) return '';
    const leap = Array.isArray(sc.cheap_otm_leaps)?sc.cheap_otm_leaps:[];
    const rich = Array.isArray(sc.rich_short_dated)?sc.rich_short_dated:[];
    const vert = Array.isArray(sc.top_verticals_by_iv_edge)?sc.top_verticals_by_iv_edge:[];
    const cal = Array.isArray(sc.top_calendars_by_term_edge)?sc.top_calendars_by_term_edge:[];
    function vlistLeap(){return leap.slice(0,4).map(x=>`<tr><td>${esc(x.expiry)}</td><td>${fmt(x.strike)}</td><td>${fmtPct(x.otm_pct)}</td><td>${fmtPct(x.iv)}</td><td>${fmt(x.delta,2)}</td><td>${fmt(x.day_close,2)}</td></tr>`).join('')}
    function vlistRich(){return rich.slice(0,4).map(x=>`<tr><td>${esc(x.side)}</td><td>${esc(x.expiry)}</td><td>${fmt(x.strike)}</td><td>${fmtPct(x.iv)}</td><td>${fmt(x.delta,2)}</td><td>${fmt(x.day_close,2)}</td></tr>`).join('')}
    return `<div class="h2">Cheap OTM LEAPs</div>${leap.length?`<table class="tbl"><thead><tr><th>Expiry</th><th>K</th><th>OTM</th><th>IV</th><th>Δ</th><th>Px</th></tr></thead><tbody>${vlistLeap()}</tbody></table>`:'<div class="muted" style="font-size:12px">None in chain</div>'}
    <div class="h2">Rich short-dated (sell candidates)</div>${rich.length?`<table class="tbl"><thead><tr><th>Side</th><th>Expiry</th><th>K</th><th>IV</th><th>Δ</th><th>Px</th></tr></thead><tbody>${vlistRich()}</tbody></table>`:'<div class="muted" style="font-size:12px">None</div>'}
    <div class="muted" style="font-size:11px">${vert.length} vertical · ${cal.length} calendar candidates flagged. Use Strategy chat for full analysis.</div>`;
  }
  function openChainModal(chain, spot){
    const byExp = {};
    for(const c of chain){ (byExp[c.expiry]=byExp[c.expiry]||[]).push(c); }
    const exps = Object.keys(byExp).sort();
    const html = `<h3 style="margin:0 0 6px">${esc(currentTicker)} options chain <span class="muted" style="font-weight:400;font-size:13px">spot $${fmt(spot)}</span></h3>
    ${exps.map(e=>{
      const calls = byExp[e].filter(c=>c.side==='call').sort((a,b)=>a.strike-b.strike);
      const puts  = byExp[e].filter(c=>c.side==='put').sort((a,b)=>a.strike-b.strike);
      const strikes = Array.from(new Set([...calls.map(c=>c.strike), ...puts.map(p=>p.strike)])).sort((a,b)=>a-b);
      return `<div class="h2">${esc(e)}</div>
        <table class="tbl"><thead><tr>
          <th colspan="4" style="text-align:center;color:#16a34a">CALL</th><th>Strike</th><th colspan="4" style="text-align:center;color:#dc2626">PUT</th>
        </tr><tr><th>Δ</th><th>IV</th><th>OI</th><th>Px</th><th></th><th>Px</th><th>OI</th><th>IV</th><th>Δ</th></tr></thead><tbody>
        ${strikes.map(k=>{
          const c = calls.find(x=>x.strike===k)||{}; const p = puts.find(x=>x.strike===k)||{};
          const itm = spot && k<spot;
          return `<tr style="${itm?'background:#fafafa':''}"><td>${fmt(c.delta,2)}</td><td>${fmtPct(c.iv)}</td><td>${fmt(c.oi,0)}</td><td>${fmt(c.day_close,2)}</td><td><b>${fmt(k)}</b></td><td>${fmt(p.day_close,2)}</td><td>${fmt(p.oi,0)}</td><td>${fmtPct(p.iv)}</td><td>${fmt(p.delta,2)}</td></tr>`;
        }).join('')}
        </tbody></table>`;
    }).join('')}`;
    showModal(html);
  }

  // ---------- Lookup ----------
  $('#goLookup').addEventListener('click', ()=>{const v=$('#tickerLookup').value.trim().toUpperCase(); if(v) loadTicker(v)});
  $('#tickerLookup').addEventListener('keydown', e=>{if(e.key==='Enter'){const v=e.target.value.trim().toUpperCase(); if(v) loadTicker(v)}});

  // ---------- Init ----------
  const url = new URL(window.location.href);
  const initTicker = url.searchParams.get('ticker');
  loadWatchlistSidebar().then(()=>{ if(initTicker) loadTicker(initTicker); });
})();
</script>
</body>
</html>
