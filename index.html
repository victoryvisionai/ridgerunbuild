<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ridge Run — Investor DNA Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #ffffff;
    --bg-tint: #f8fafc;
    --bg-blue: #eff6ff;
    --bg-blue-soft: #f0f7ff;
    --border: #e2e8f0;
    --border-blue: #bfdbfe;
    --text: #0f172a;
    --text-muted: #475569;
    --text-dim: #94a3b8;
    --accent: #2563eb;
    --accent-dark: #1e40af;
    --accent-bg: #dbeafe;
    --success: #059669;
    --success-bg: #d1fae5;
    --danger: #dc2626;
    --danger-bg: #fee2e2;
    --serif: 'Source Serif 4', Georgia, serif;
    --sans: 'Inter', -apple-system, sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh; background: var(--bg-tint);
    font-family: var(--sans); color: var(--text); font-size: 14px;
    line-height: 1.5;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px;
  }
  .hidden { display: none !important; }

  /* ===== Auth ===== */
  .auth-card {
    width: 100%; max-width: 420px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 40px 32px;
  }
  .auth-brand { text-align: center; margin-bottom: 32px; }
  .auth-mark {
    font-family: var(--serif); font-size: 40px; font-weight: 600;
    color: var(--accent); letter-spacing: -0.02em; display: block;
  }
  .auth-name {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--text-muted); margin-top: 6px;
  }
  .auth-title {
    font-family: var(--serif); font-size: 24px; font-weight: 500;
    letter-spacing: -0.015em; margin: 0 0 6px; text-align: center;
  }
  .auth-subtitle {
    font-size: 13px; color: var(--text-muted); text-align: center;
    margin: 0 0 28px; line-height: 1.5;
  }
  .field { margin-bottom: 14px; }
  .label {
    display: block; font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 6px;
  }
  .input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 11px 13px; font-family: var(--sans);
    font-size: 14px; border-radius: 4px;
  }
  .input:focus { outline: none; border-color: var(--accent); }
  .btn {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 12px 18px; border-radius: 4px;
    cursor: pointer; transition: all 0.15s; border: 1px solid transparent;
    font-weight: 500;
  }
  .btn-primary {
    background: var(--accent); color: white;
    width: 100%; margin-top: 8px;
  }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary:disabled { opacity: 0.5; cursor: wait; }
  .btn-ghost {
    background: var(--bg); color: var(--text-muted); border-color: var(--border);
  }
  .btn-ghost:hover:not(:disabled) { border-color: var(--text-dim); color: var(--text); }
  .btn-ghost:disabled { opacity: 0.3; cursor: not-allowed; }
  .auth-toggle {
    text-align: center; margin-top: 18px; font-size: 13px;
    color: var(--text-muted); cursor: pointer;
  }
  .auth-toggle:hover { color: var(--text); }
  .auth-toggle b { color: var(--accent); font-weight: 500; }
  .msg {
    margin-top: 14px; padding: 10px 14px; font-size: 13px;
    border-radius: 4px; line-height: 1.5;
  }
  .msg-error { background: var(--danger-bg); border: 1px solid #fecaca; color: #991b1b; }
  .msg-success { background: var(--success-bg); border: 1px solid #a7f3d0; color: #065f46; }
  .msg-info { background: var(--bg-blue); border: 1px solid var(--border-blue); color: var(--accent-dark); }

  /* ===== Modal ===== */
  .modal {
    width: 100%; max-width: 720px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; overflow: hidden;
  }
  .header {
    padding: 20px 28px 16px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border); background: var(--bg);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    font-family: var(--serif); font-size: 22px; font-weight: 600;
    color: var(--accent); letter-spacing: -0.02em;
  }
  .brand-name {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--text-muted);
  }
  .progress-meta { display: flex; align-items: center; gap: 14px; font-family: var(--mono); font-size: 11px; }
  .question-count { color: var(--text); letter-spacing: 0.1em; }
  .divider { color: var(--text-dim); margin: 0 2px; }
  .section-pill {
    color: var(--accent-dark); text-transform: uppercase; letter-spacing: 0.08em;
    padding: 4px 10px; background: var(--bg-blue); border: 1px solid var(--border-blue);
    border-radius: 3px;
  }
  .signout {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-dim); cursor: pointer;
    background: transparent; border: 1px solid var(--border); padding: 5px 10px;
    border-radius: 3px;
  }
  .signout:hover { border-color: var(--text-dim); color: var(--text-muted); }
  .progress-bar { height: 3px; background: var(--bg-tint); position: relative; overflow: hidden; }
  .progress-fill {
    position: absolute; top: 0; left: 0; bottom: 0;
    background: var(--accent);
    transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .section-intro {
    padding: 28px 28px 0; background: var(--bg-blue-soft);
    border-bottom: 1px solid var(--border-blue);
  }
  .section-eyebrow {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 8px;
  }
  .section-title {
    font-family: var(--serif); font-size: 26px; font-weight: 500;
    letter-spacing: -0.02em; margin: 0 0 6px; color: var(--text);
  }
  .section-subtitle {
    font-size: 13px; color: var(--text-muted); margin: 0 0 24px; line-height: 1.55;
  }
  .body { padding: 28px; }
  .question-number {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em;
    color: var(--text-dim); margin-bottom: 10px;
  }
  .question-label {
    display: block; font-family: var(--serif); font-size: 21px;
    font-weight: 500; line-height: 1.35; letter-spacing: -0.015em;
    color: var(--text); margin-bottom: 8px;
  }
  .question-help {
    font-size: 13px; color: var(--text-muted); line-height: 1.55;
    margin: 0 0 20px;
  }
  .input-area { margin-top: 20px; }
  .textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 12px 14px;
    font-family: var(--mono); font-size: 13px; line-height: 1.6;
    border-radius: 4px; resize: vertical;
  }
  .textarea:focus { outline: none; border-color: var(--accent); }
  .number-wrap {
    display: flex; align-items: center; background: var(--bg);
    border: 1px solid var(--border); border-radius: 4px;
  }
  .number-wrap:focus-within { border-color: var(--accent); }
  .prefix {
    padding: 0 14px; font-family: var(--mono); color: var(--text-muted);
    font-size: 14px; border-right: 1px solid var(--border);
  }
  .input-number {
    border: none; background: transparent; font-family: var(--mono);
    width: 100%; padding: 12px 14px; color: var(--text); font-size: 15px;
  }
  .input-number:focus { outline: none; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option {
    display: flex; align-items: center; gap: 14px; padding: 13px 16px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; color: var(--text); font-family: var(--sans);
    font-size: 14px; cursor: pointer; text-align: left; transition: all 0.15s;
    width: 100%;
  }
  .option:hover { border-color: var(--accent); background: var(--bg-blue-soft); }
  .option.selected {
    border-color: var(--accent); background: var(--bg-blue);
    color: var(--accent-dark); font-weight: 500;
  }
  .option-mark {
    font-family: var(--mono); color: var(--text-dim); font-size: 14px; width: 16px;
  }
  .option.selected .option-mark { color: var(--accent); }
  .option-label { flex: 1; line-height: 1.4; }
  .file-upload {
    padding: 24px; background: var(--bg-tint);
    border: 1px dashed var(--border); border-radius: 4px; text-align: center;
  }
  .file-help { font-size: 13px; color: var(--text-muted); margin: 0 0 12px; }
  .footer {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px; border-top: 1px solid var(--border); background: var(--bg-tint);
  }
  .save-state {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--text-dim);
  }
  .save-state.saving { color: var(--accent); }

  /* Complete */
  .complete { text-align: center; max-width: 480px; }
  .complete-mark {
    font-family: var(--serif); font-size: 56px; color: var(--accent);
    margin-bottom: 12px;
  }
  .complete h1 {
    font-family: var(--serif); font-size: 28px; font-weight: 500;
    letter-spacing: -0.02em; margin: 0 0 12px;
  }
  .complete p { color: var(--text-muted); font-size: 14px; line-height: 1.6; margin: 0 0 24px; }

  @media (max-width: 640px) {
    body { padding: 0; }
    .modal, .auth-card { border-radius: 0; min-height: 100vh; max-width: 100%; border: none; }
    .header { padding: 14px 18px 12px; flex-direction: column; gap: 10px; align-items: flex-start; }
    .section-intro, .body, .footer { padding-left: 18px; padding-right: 18px; }
    .question-label { font-size: 19px; }
    .section-title { font-size: 22px; }
  }
</style>
</head>
<body>

<div id="auth-screen" class="auth-card">
  <div class="auth-brand">
    <span class="auth-mark">RR</span>
    <div class="auth-name">Ridge Run Portal</div>
  </div>
  <h1 class="auth-title" id="auth-title">Sign in</h1>

  <div class="field">
    <label class="label" for="auth-email">Email</label>
    <input class="input" type="email" id="auth-email" autocomplete="email" />
  </div>
  <div class="field">
    <label class="label" for="auth-password">Password</label>
    <input class="input" type="password" id="auth-password" autocomplete="current-password" />
  </div>

  <button class="btn btn-primary" id="auth-submit">Continue</button>
  <div class="auth-toggle" id="auth-toggle">Need an account? <b>Create one</b></div>
  <div id="auth-msg"></div>
</div>

<div id="modal" class="modal hidden">
  <header class="header">
    <div class="brand">
      <span class="brand-mark">RR</span>
      <span class="brand-name">Ridge Run</span>
    </div>

  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width: 0%"></div></div>

  <div class="section-intro hidden" id="section-intro">

    <h2 class="section-title" id="section-title"></h2>
    <p class="section-subtitle" id="section-subtitle"></p>
  </div>

  <main class="body">

    <p class="question-help hidden" id="q-help"></p>
    <div class="input-area" id="input-area"></div>
    <div id="inline-msg"></div>
  </main>

  <footer class="footer">
    <button class="btn btn-ghost" id="back-btn">← Back</button>
    <div class="save-state" id="save-state">Ready</div>
    <button class="btn btn-primary" id="next-btn" style="width: auto;">Next →</button>
  </footer>
</div>

<div id="complete-screen" class="complete hidden">
  <div class="complete-mark">✓</div>
  <h1>Onboarding complete</h1>
  <p>Your investor DNA profile is being generated. This typically takes under a minute.</p>
  <a href="/dashboard.html" class="btn btn-primary" style="max-width: 280px; display: inline-block; text-decoration: none;">Go to dashboard</a>
</div>

          options: [
            { value: 'thesis', label: 'Thesis — was simply wrong about the business' },

      ]},
    { id: 'investor_monitoring', order: 6, title: 'Top Investor Monitoring', subtitle: 'Whose moves should the system watch?',
      questions: [
        { id: 'q32_daily_investors', order: 33, type: 'text_list', label: 'Which investors should be monitored daily?', help: 'One per line. Examples: Druckenmiller, Klarman, Loeb, Buffett.', placeholder: 'Stanley Druckenmiller / Duquesne\nSeth Klarman / Baupost\nDan Loeb / Third Point', required: false },
        { id: 'q33_quarterly_investors', order: 34, type: 'text_list', label: 'Which investors should only be monitored quarterly?', placeholder: 'One per line', required: false },
        { id: 'q34_signal_use', order: 35, type: 'single_select', label: 'Do you want to clone ideas, use them as confirmation, or use them only as research leads?', required: true,
          options: [
            { value: 'research_leads_only', label: 'Research leads only — never copy' },
            { value: 'confirmation', label: 'Use as confirmation of independent ideas' },

            { value: 'clone_broadly', label: 'Clone broadly with sizing adjustment' }
          ]},
        { id: 'q35_distrust_list', order: 36, type: 'long_text', label: 'Are there investors you specifically distrust or want the AI to fade?', placeholder: 'e.g. Investor X — track record is mostly luck', required: false }
      ]}
  ]
};

const ALL_QUESTIONS = QUESTIONNAIRE.sections.flatMap(s =>
  s.questions.map(q => ({ ...q, sectionId: s.id, section: s }))
);

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let currentUser = null, currentSession = null, currentIndex = 0, answers = {}, saveTimer = null;

const $ = id => document.getElementById(id);
const show = (id, on = true) => $(id).classList.toggle('hidden', !on);

let authMode = 'signin';
function setAuthMode(mode) {
  authMode = mode;
  if (mode === 'signin') {
    $('auth-title').textContent = 'Sign in';
    $('auth-subtitle').textContent = 'Welcome back. Continue your onboarding.';
    $('auth-toggle').innerHTML = 'Need an account? <b>Create one</b>';
  } else {
    $('auth-title').textContent = 'Create account';
    $('auth-subtitle').textContent = 'Start your investor DNA onboarding.';
    $('auth-toggle').innerHTML = 'Already have an account? <b>Sign in</b>';
  }
  $('auth-msg').innerHTML = '';
}

$('auth-toggle').addEventListener('click', () => setAuthMode(authMode === 'signin' ? 'signup' : 'signin'));
$('auth-submit').addEventListener('click', handleAuth);
$('auth-email').addEventListener('keydown', e => { if (e.key === 'Enter') $('auth-password').focus(); });
$('auth-password').addEventListener('keydown', e => { if (e.key === 'Enter') handleAuth(); });

async function handleAuth() {
  const email = $('auth-email').value.trim();
  const password = $('auth-password').value;
  if (!email || !password) return showAuthMsg('Email and password are required.', 'error');
  if (password.length < 8 && authMode === 'signup') return showAuthMsg('Password must be at least 8 characters.', 'error');
  $('auth-submit').disabled = true;
  $('auth-submit').textContent = 'Working...';
  try {
    const { data, error } = authMode === 'signup'
      ? await supabase.auth.signUp({ email, password })
      : await supabase.auth.signInWithPassword({ email, password });
    if (error) { showAuthMsg(error.message, 'error'); $('auth-submit').disabled = false; $('auth-submit').textContent = 'Continue'; return; }
    if (authMode === 'signup' && !data.session) {
      showAuthMsg('Check your email to confirm your account, then sign in.', 'success');
      $('auth-submit').disabled = false; $('auth-submit').textContent = 'Continue';
      setAuthMode('signin'); return;
    }
    await initializeUser(data.user);
  } catch (err) {
    showAuthMsg('Error: ' + err.message, 'error');
    $('auth-submit').disabled = false; $('auth-submit').textContent = 'Continue';
  }
}
function showAuthMsg(text, kind) { $('auth-msg').innerHTML = `<div class="msg msg-${kind}">${text}</div>`; }

$('signout-btn').addEventListener('click', async () => { await supabase.auth.signOut(); window.location.reload(); });

async function initializeUser(user) {
  currentUser = user;
  const { data: existing } = await supabase.from('onboarding_sessions').select('*')
    .eq('user_id', user.id).eq('status', 'in_progress')
    .order('started_at', { ascending: false }).limit(1).maybeSingle();

  if (existing) {
    currentSession = existing;
    const { data: responses } = await supabase.from('onboarding_responses')
      .select('question_id, answer').eq('session_id', existing.id);
    if (responses) responses.forEach(r => { answers[r.question_id] = r.answer?.value; });
    const firstUnanswered = ALL_QUESTIONS.findIndex(q => !(q.id in answers));
    currentIndex = firstUnanswered === -1 ? ALL_QUESTIONS.length - 1 : firstUnanswered;
  } else {
    const { data: created, error } = await supabase.from('onboarding_sessions')
      .insert({ user_id: user.id }).select().single();
    if (error) return showAuthMsg('Could not start session: ' + error.message, 'error');
    currentSession = created;
    await supabase.from('users').update({ onboarding_status: 'in_progress' }).eq('id', user.id);
  }
  show('auth-screen', false); show('modal', true);
  renderQuestion();
}

function renderQuestion() {
  const q = ALL_QUESTIONS[currentIndex];
  if (!q) return;
  const total = ALL_QUESTIONS.length;
  const pct = ((currentIndex + 1) / total) * 100;
  $('progress-fill').style.width = pct + '%';
  $('q-count').innerHTML = `${String(currentIndex + 1).padStart(2, '0')} <span class="divider">/</span> ${total}`;
  $('section-pill').textContent = `${String(q.section.order).padStart(2, '0')} · ${q.section.title}`;

  const isFirstOfSection = q.section.questions[0].id === q.id;
  if (isFirstOfSection) {
    show('section-intro', true);
    $('section-eyebrow').textContent = `Section ${q.section.order}`;
    $('section-title').textContent = q.section.title;
    $('section-subtitle').textContent = q.section.subtitle;
  } else show('section-intro', false);

  $('q-number').textContent = 'Q' + q.order;
  $('q-label').textContent = q.label;
  if (q.help) { show('q-help', true); $('q-help').textContent = q.help; } else show('q-help', false);
  $('inline-msg').innerHTML = '';
  renderInput(q);
  $('back-btn').disabled = currentIndex === 0;
  $('next-btn').textContent = currentIndex === total - 1 ? 'Finish' : 'Next →';
}

function renderInput(q) {
  const area = $('input-area');
  area.innerHTML = '';
  const value = answers[q.id];
  switch (q.type) {
    case 'number': {
      const wrap = document.createElement('div'); wrap.className = 'number-wrap';
      if (q.prefix) { const p = document.createElement('span'); p.className = 'prefix'; p.textContent = q.prefix; wrap.appendChild(p); }
      const input = document.createElement('input');
      input.type = 'number'; input.className = 'input-number'; input.value = value ?? '';
      input.addEventListener('input', () => { answers[q.id] = input.value === '' ? null : Number(input.value); scheduleSave(q); });
      wrap.appendChild(input); area.appendChild(wrap); input.focus();
      break;
    }
    case 'text': {
      const input = document.createElement('input');
      input.type = 'text'; input.className = 'input'; input.value = value ?? '';
      input.placeholder = q.placeholder || '';
      input.addEventListener('input', () => { answers[q.id] = input.value; scheduleSave(q); });
      area.appendChild(input); input.focus(); break;
    }
    case 'long_text': {
      const ta = document.createElement('textarea');
      ta.className = 'textarea'; ta.rows = 8; ta.value = value ?? '';
      ta.placeholder = q.placeholder || '';
      ta.addEventListener('input', () => { answers[q.id] = ta.value; scheduleSave(q); });
      area.appendChild(ta); break;
    }
    case 'text_list': {
      const ta = document.createElement('textarea');
      ta.className = 'textarea'; ta.rows = 6;
      ta.value = Array.isArray(value) ? value.join('\n') : '';
      ta.placeholder = q.placeholder || '';
      ta.addEventListener('input', () => { answers[q.id] = ta.value.split('\n').map(s => s.trim()).filter(Boolean); scheduleSave(q); });
      area.appendChild(ta); break;
    }
    case 'single_select': {
      const wrap = document.createElement('div'); wrap.className = 'options';
      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option' + (value === opt.value ? ' selected' : '');
        btn.innerHTML = `<span class="option-mark">${value === opt.value ? '●' : '○'}</span><span class="option-label">${opt.label}</span>`;
        btn.addEventListener('click', () => { answers[q.id] = opt.value; renderInput(q); scheduleSave(q); });
        wrap.appendChild(btn);
      });
      area.appendChild(wrap); break;
    }
    case 'multi_select': {
      const wrap = document.createElement('div'); wrap.className = 'options';
      const selected = Array.isArray(value) ? value : [];
      q.options.forEach(opt => {
        const isSel = selected.includes(opt.value);
        const btn = document.createElement('button');
        btn.className = 'option' + (isSel ? ' selected' : '');
        btn.innerHTML = `<span class="option-mark">${isSel ? '▣' : '☐'}</span><span class="option-label">${opt.label}</span>`;
        btn.addEventListener('click', () => {
          const next = isSel ? selected.filter(v => v !== opt.value) : [...selected, opt.value];
          answers[q.id] = next; renderInput(q); scheduleSave(q);
        });
        wrap.appendChild(btn);
      });
      area.appendChild(wrap); break;
    }
    case 'file_upload': {
      const wrap = document.createElement('div'); wrap.className = 'file-upload';
      wrap.innerHTML = `<p class="file-help">${q.help || 'File upload is a Phase 2 task.'}</p>`;
      const btn = document.createElement('button');
      btn.className = 'btn btn-ghost'; btn.textContent = 'Skip for now';
      btn.addEventListener('click', () => { answers[q.id] = 'skipped_for_now'; scheduleSave(q); goNext(); });
      wrap.appendChild(btn); area.appendChild(wrap); break;
    }
  }
}

function scheduleSave(q) {
  $('save-state').textContent = 'Saving…';
  $('save-state').classList.add('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveAnswer(q), 600);
}

async function saveAnswer(q) {
  if (!currentSession || !currentUser) return;
  const value = answers[q.id];
  try {
    await supabase.from('onboarding_responses').upsert({
      session_id: currentSession.id, user_id: currentUser.id,
      question_id: q.id, section_id: q.sectionId, answer: { value }
    }, { onConflict: 'session_id,question_id' });
    await supabase.from('onboarding_sessions').update({ current_question_id: q.id }).eq('id', currentSession.id);
    await supabase.from('audit_log').insert({
      user_id: currentUser.id, actor: 'user',
      action_type: 'onboarding.answer',
      payload: { question_id: q.id, answer: value }
    });
    $('save-state').textContent = 'Saved';
    $('save-state').classList.remove('saving');
  } catch (err) {
    $('save-state').textContent = 'Save failed';
    $('inline-msg').innerHTML = `<div class="msg msg-error">${err.message}</div>`;
  }
}

$('next-btn').addEventListener('click', goNext);
$('back-btn').addEventListener('click', goBack);

async function goNext() {
  const q = ALL_QUESTIONS[currentIndex];
  const value = answers[q.id];
  if (q.required && (value === undefined || value === null || value === '' || (Array.isArray(value) && value.length === 0))) {
    $('inline-msg').innerHTML = '<div class="msg msg-error">This question is required.</div>';
    return;
  }
  clearTimeout(saveTimer);
  if (value !== undefined) await saveAnswer(q);
  if (currentIndex < ALL_QUESTIONS.length - 1) { currentIndex++; renderQuestion(); }
  else await completeOnboarding();
}

function goBack() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }

async function completeOnboarding() {
  $('next-btn').disabled = true; $('next-btn').textContent = 'Finishing...';
  await supabase.from('onboarding_sessions')
    .update({ status: 'completed', completed_at: new Date().toISOString() })
    .eq('id', currentSession.id);
  await supabase.from('users')
    .update({ onboarding_status: 'completed', onboarding_completed_at: new Date().toISOString() })
    .eq('id', currentUser.id);
  await supabase.from('audit_log').insert({
    user_id: currentUser.id, actor: 'user',
    action_type: 'onboarding.completed',
    payload: { session_id: currentSession.id }
  });
  if (N8N_DNA_WEBHOOK_URL) {
    try {
      await fetch(N8N_DNA_WEBHOOK_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: currentUser.id, session_id: currentSession.id })
      });
    } catch (e) { console.error(e); }
  }
  show('modal', false); show('complete-screen', true);
}

(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (session?.user) await initializeUser(session.user);
})();
</script>
